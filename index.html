<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedDecks</title>
<meta name="description" content="Your own question bank for medical school.">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A20" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedDecks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="md-build" content="04932dc6fe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Libre+Franklin:wght@400;500;600;700&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&amp;display=swap">
<style>[hidden]{display:none!important}</style>
<style>
/* ===== MedDecks v3 · "Atlas plate" design system ===== */
:root{--bg:#F2F0EB;--sf:#FFFFFF;--sf2:#F7F6F2;--ink:#15171C;--ink2:#3B404B;--mut:#5B616D;--ln:#D3CFC5;--ln2:#E7E4DC;
  --pri:#1F3A68;--priH:#172D52;--priT:#E6EBF3;--lnk:#1F3A68;--red:#B3261E;--redF:#B3261E;--redT:#FBE9E7;--grn:#17703A;--grnF:#17703A;--grnT:#E3F0E7;
  --amb:#8A5A00;--ambF:#E3A21A;--ambT:#FCF1D6;--hl:#FFE08A;--shade:rgba(21,23,28,.5);
  --h1:#C9D3E4;--h2:#8FA4C8;--h3:#4E6C9E;--h4:#1F3A68;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Libre Franklin","Helvetica Neue",Arial,sans-serif;--mono:"IBM Plex Mono",Menlo,Consolas,monospace;
  --z:1;--gut:40px;--sx:var(--sc,#1F3A68);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1115;--sf:#171A20;--sf2:#1D2129;--ink:#ECEAE4;--ink2:#C6C9D0;--mut:#9BA1AD;--ln:#30353F;--ln2:#252932;
  --pri:#3C64A9;--priH:#4A73B9;--priT:#1B2539;--lnk:#A3BCEB;--red:#EE7368;--redF:#C2372D;--redT:#2E1816;--grn:#63C886;--grnF:#1F8447;--grnT:#14281C;--amb:#F2B744;--ambT:#2B2311;--hl:#7A5F12;--shade:rgba(0,0,0,.62);
  --h1:#22304A;--h2:#2E4A7A;--h3:#4469A8;--h4:#7FA2DC;--sx:var(--scl,#A3BCEB);color-scheme:dark}:root:not([data-theme=light]) [style*="--sc:"]{--sx:var(--scl)}}
:root[data-theme=dark]{--bg:#0F1115;--sf:#171A20;--sf2:#1D2129;--ink:#ECEAE4;--ink2:#C6C9D0;--mut:#9BA1AD;--ln:#30353F;--ln2:#252932;
  --pri:#3C64A9;--priH:#4A73B9;--priT:#1B2539;--lnk:#A3BCEB;--red:#EE7368;--redF:#C2372D;--redT:#2E1816;--grn:#63C886;--grnF:#1F8447;--grnT:#14281C;--amb:#F2B744;--ambT:#2B2311;--hl:#7A5F12;--shade:rgba(0,0,0,.62);
  --h1:#22304A;--h2:#2E4A7A;--h3:#4469A8;--h4:#7FA2DC;--sx:var(--scl,#A3BCEB);color-scheme:dark}
:root[data-theme=dark] [style*="--sc:"]{--sx:var(--scl)}
@media (max-width:1024px){:root{--gut:24px}}
@media (max-width:600px){:root{--gut:16px}}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh;overflow-x:hidden}
h1,h2,h3,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default}
a{color:var(--lnk)}
img{max-width:100%}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{min-height:100vh;display:flex;flex-direction:column}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left));padding-right:max(var(--gut),env(safe-area-inset-right))}
.wrap{width:100%;max-width:1200px;margin:0 auto}
.sp{flex:1}
.tn{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--mut)}
.serif{font-family:var(--serif)}

/* ===== type ===== */
.display{font-family:var(--serif);font-weight:500;font-size:48px;line-height:56px;letter-spacing:-.01em}
.h1{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.1;letter-spacing:-.01em}
.h2{font-family:var(--serif);font-weight:500;font-size:24px;line-height:32px}
.h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:26px}
.lbl{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.lbl.ink{color:var(--ink)}
@media (max-width:600px){.display{font-size:32px;line-height:40px}.h1{font-size:34px}.h2{font-size:21px;line-height:28px}.h3{font-size:17px;line-height:24px}}

/* ===== icons ===== */
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:square;stroke-linejoin:miter;flex:none}
.sm .i,.i.s{width:16px;height:16px}

/* ===== buttons ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-family:var(--sans);font-size:14px;font-weight:600;line-height:1.2;white-space:nowrap;text-decoration:none;flex:none;user-select:none;-webkit-user-select:none}
.btn:hover:not(:disabled){border-color:var(--ink2)}
.btn:disabled{opacity:.45}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover:not(:disabled){background:var(--priH);border-color:var(--priH)}
.btn.dan{background:var(--redF);border-color:var(--redF);color:#fff}
.btn.dan:hover:not(:disabled){filter:brightness(1.08)}
.btn.redt{color:var(--red)}
.btn.gho{background:transparent;border-color:transparent}
.btn.gho:hover:not(:disabled){background:var(--sf2);border-color:transparent}
.btn.lg{height:48px;padding:0 22px;font-size:15px}
.btn.sm{height:32px;padding:0 10px;font-size:13px;gap:6px}
.btn.ico{width:40px;padding:0}.btn.ico.lg{width:48px}.btn.ico.sm{width:32px}
.btn.wide{width:100%}
.btn.on-sc{background:transparent;border-color:rgba(255,255,255,.75);color:#fff}
.btn.on-sc:hover:not(:disabled){background:rgba(255,255,255,.12);border-color:#fff}
.btn.white{background:#fff;border-color:#fff;color:#15171C}
.btn.star-on{background:var(--ambT);border-color:var(--ambF);color:var(--amb)}
.btn.star-on .i{fill:var(--ambF);stroke:var(--amb)}
.btn .cnt{font-family:var(--mono);font-weight:500;color:var(--mut)}
.btn.pri .cnt{color:rgba(255,255,255,.75)}
.link{display:inline-flex;align-items:center;gap:6px;color:var(--lnk);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;padding:0}
.link:hover{text-decoration:underline}

/* ===== chips, inputs ===== */
.chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:1px solid var(--ln);background:var(--sf);font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.chip.amb{background:var(--ambT);border-color:var(--ambF);color:var(--amb)}
.chip.ink{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.pri{background:var(--priT);border-color:var(--pri);color:var(--lnk)}
[style*="--sc:"]{--sx:var(--sc)}
.sw{display:inline-block;width:10px;height:10px;flex:none;background:var(--sx)}
.inp{display:block;width:100%;min-height:44px;border:1px solid var(--ln);background:var(--sf);padding:0 12px;font-size:15px;border-radius:2px;outline:none;color:var(--ink)}
textarea.inp{padding:10px 12px;line-height:1.5;resize:vertical}
select.inp{padding-right:32px}
.inp:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.inp.n{width:72px;text-align:center;font-family:var(--mono);display:inline-block}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.fld>.fl{font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.fld>label small,.fld>.fl small{margin-left:auto;font-weight:400;font-size:12px;color:var(--mut)}
input[type=checkbox],input[type=radio]{accent-color:var(--pri);width:18px;height:18px;margin:0;flex:none}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;min-height:34px;cursor:pointer}
.chk .muted{font-family:var(--mono);font-size:12px}
.err{color:var(--red);font-size:14px;font-weight:500}
.note{font-size:13px;line-height:20px;color:var(--mut)}
mark{background:var(--hl);color:inherit;padding:0 2px}
.seg{display:flex;border:1px solid var(--ln);background:var(--sf);flex-wrap:nowrap}
.seg>button{flex:1;min-height:40px;padding:0 14px;font-size:14px;font-weight:500;border-left:1px solid var(--ln);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg>button:first-child{border-left:0}
.seg>button.on{background:var(--ink);color:var(--bg);font-weight:600}
.seg>button .cnt{font-family:var(--mono);font-size:12px;color:var(--mut)}
.seg>button.on .cnt{color:var(--bg);opacity:.75}
.seg.mono>button{font-family:var(--mono);font-size:13px}

/* ===== panels ===== */
.panel{background:var(--sf);border:1px solid var(--ln)}
.ph{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.pb{padding:20px 22px}
.sech{display:flex;align-items:baseline;gap:14px;padding-bottom:12px;border-bottom:1px solid var(--ink);flex-wrap:wrap}
.sech span.s{font-size:14px;color:var(--mut)}
.sech .btn{align-self:center;margin-left:auto}
.empty{padding:22px;color:var(--mut);font-size:14px;text-align:center}
.meter{display:block;height:3px;background:var(--ln2);position:relative;overflow:hidden}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--sx)}
.meter.thick{height:8px}
.col{display:flex;flex-direction:column;gap:32px}
.col-s{display:flex;flex-direction:column;gap:16px}

/* ===== app bar ===== */
.nav{height:64px;display:flex;align-items:center;gap:20px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20;flex:none}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;flex:none}
.brand .mk{width:32px;height:32px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:21px;font-weight:600;line-height:1}
.brand .wm{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.01em}
.srch{flex:0 1 440px;min-width:0;display:flex;align-items:center;gap:10px;height:40px;padding:0 8px 0 12px;border:1px solid var(--ln);background:var(--sf2);color:var(--mut)}
.srch:focus-within{border-color:var(--pri);background:var(--sf)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:14px;color:var(--ink)}
.srch input::-webkit-search-cancel-button{display:none}
.srch .chip{height:22px;padding:0 6px;font-size:10px}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.s-only{display:none}
@media (max-width:820px){.srch .chip{display:none}}
@media (max-width:600px){
  .nav{height:56px;gap:4px;padding-right:6px}
  .brand .mk{width:28px;height:28px;font-size:19px}.brand .wm{font-size:20px}.brand{margin-right:auto}
  .nav .srch,.hide-s{display:none!important}.s-only{display:inline-flex}
  .nav .btn{width:44px;height:44px;padding:0;background:transparent;border-color:transparent;color:var(--ink)}
  .nav .avatar{width:32px;height:32px;font-size:12px;margin:0 6px}
}

/* ===== page ===== */
.page{flex:1;padding-top:28px;padding-bottom:64px}
.crumbs{display:flex;align-items:center;gap:8px;font-size:14px;flex-wrap:wrap;color:var(--ink2);min-width:0}
.crumbs a,.crumbs button{display:inline-flex;align-items:center;gap:6px;color:var(--lnk);font-weight:600;text-decoration:none}
.crumbs .sep{color:var(--mut)}
.crumbs .sw{background:var(--sx)}

/* ===== cover art ===== */
.cvr{position:relative;display:block;overflow:hidden;background:var(--sc,#545D62)}
.cvr img{max-width:none;position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;object-position:var(--op,left center);display:block}
.cvr.tint img{filter:grayscale(1) contrast(1.05);mix-blend-mode:luminosity;opacity:.9}
.cvr .art{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%}

/* iPad Safari does not stretch the children of a <button> laid out as a column; give them full width explicitly */
.subj>*,.subj-b>*,.artb>*,.thb>*,.qtx>*,.planc .tx>*{width:100%;align-self:stretch}
.subj-b,.planc .tx{min-width:0}
.planc .tx{flex:1}
.cvr{width:100%}
.planc .cvr{width:64px}

/* ===== home ===== */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);gap:32px;padding:32px 28px}
.hero .vr{background:var(--ln)}
.hero-l{display:flex;flex-direction:column;gap:14px;min-width:0}
.hero-l p{font-size:16px;line-height:25px;color:var(--ink2);max-width:470px}
.hero-l .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hero-r{display:flex;flex-direction:column;gap:12px;min-width:0}
.goalhd{display:flex;justify-content:space-between;gap:10px}
.goalhd .r{font-family:var(--mono);font-size:13px;color:var(--mut)}
.goalbig{display:flex;align-items:baseline;gap:8px;margin-top:-2px}
.goalbig b{font-family:var(--serif);font-weight:500;font-size:48px;line-height:1}
.goalbig span{font-family:var(--serif);font-size:24px;color:var(--ink2)}
.goalbar{display:flex;height:22px;border:1px solid var(--ink);background:var(--sf)}
.goalbar i{flex:1;border-left:1px solid var(--ln2)}
.goalbar i:first-child{border-left:0}
.goalbar i.f{background:var(--pri);border-left-color:rgba(255,255,255,.35)}
.goalbar i.f.done{background:var(--grnF)}
.goalbar i.t{border-left:1px solid var(--ink)}
.goalsc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut)}
.hstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ln);margin-top:6px}
.hst{padding:14px 14px 0;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:2px;min-width:0}
.hst:first-child{border-left:0;padding-left:0}
.hst .lbl{display:flex;align-items:center;gap:5px}
.hst .lbl.amb{color:var(--amb)}
.hst b{font-family:var(--serif);font-weight:500;font-size:26px;line-height:34px}
.hst small{font-size:12px;color:var(--mut)}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.planc{display:flex;gap:14px;padding:14px;background:var(--sf);border:1px solid var(--ln);text-align:left;min-width:0;color:var(--ink)}
.planc:hover{border-color:var(--ink2)}
.planc .cvr{width:64px;height:96px;flex:none}
.planc .cvr.ph{display:flex;align-items:center;justify-content:center;color:#fff;background:var(--pri)}
.planc .cvr.ph .i{width:26px;height:26px}
.planc .tx{display:flex;flex-direction:column;gap:4px;min-width:0}
.planc .lbl{color:var(--k,var(--lnk))}
.planc .h3{font-weight:500}
.planc .sub{font-size:13px;line-height:19px;color:var(--ink2)}
.planc .go{margin-top:auto;padding-top:6px;display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--lnk)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.subj{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);text-align:left;min-width:0;color:var(--ink)}
.subj:hover{border-color:var(--ink2)}
.subj .cvr{height:112px}
.subj-b{display:flex;flex-direction:column;gap:6px;padding:14px 16px 16px;flex:1}
.subj-n{display:flex;align-items:baseline;gap:8px;justify-content:space-between}
.subj-n b{font-family:var(--serif);font-weight:500;font-size:21px;line-height:26px}
.subj-n span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mut);white-space:nowrap}
.subj-m{font-size:13px;color:var(--ink2)}
.subj-b .meter{margin:6px 0 4px}
.subj-f{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink2);margin-top:auto;flex-wrap:wrap}
.subj-f b{color:var(--ink)}
.planc .go{width:auto!important;align-self:flex-start!important}
.addsubj{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--ln);min-height:230px;color:var(--lnk);font-weight:600;font-size:14px;background:transparent}
.addsubj:hover{border-color:var(--pri);background:var(--sf)}
.two{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:stretch}
.two>.panel{display:flex;flex-direction:column}
.heat-w{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.heat-d{display:grid;grid-template-rows:16px repeat(7,1fr);gap:4px;font-family:var(--mono);font-size:10px;color:var(--mut);flex:none}
.heat-d span{height:var(--hc);line-height:var(--hc)}
.heat{display:flex;gap:4px;--hc:22px}
.hcol{display:grid;grid-template-rows:16px repeat(7,var(--hc));gap:4px}
.hmon{font-family:var(--mono);font-size:10px;color:var(--mut);white-space:nowrap;line-height:16px;width:var(--hc);overflow:visible}
.hd{width:var(--hc);height:var(--hc);background:var(--ln2);display:block}
.hd.l1{background:var(--h1)}.hd.l2{background:var(--h2)}.hd.l3{background:var(--h3)}.hd.l4{background:var(--h4)}
.hd.f{background:transparent}
.hd.now{outline:2px solid var(--ink);outline-offset:-1px}
.heat-k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);margin-top:16px;flex-wrap:wrap}
.heat-k .hd{width:11px;height:11px}
.heat-k .td{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.heat-k .td i{width:14px;height:14px;border:1.5px solid var(--ink)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;height:190px;padding-top:22px;border-bottom:1px solid var(--ink)}
.wk{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;position:relative;z-index:1}
.wv{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.wb{width:100%;max-width:34px;background:var(--pri);display:block}
.wb.under{background:var(--priT);border:1px solid var(--pri)}
.wb.today{background:repeating-linear-gradient(-45deg,var(--pri) 0 2px,transparent 2px 6px);border:1px solid var(--pri)}
.wb.zero{height:1px!important;background:var(--mut);max-width:10px}
.wls{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:8px}
.wl{text-align:center;font-size:13px;color:var(--ink2)}
.wl.now{font-weight:700;color:var(--ink)}
.wgoal{position:absolute;left:0;right:0;border-top:1px dashed var(--ink2);z-index:0}
.wgoal span{position:absolute;right:0;top:-17px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink2);background:var(--sf);padding-left:4px}
.wkey{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:16px}
.wkey span{display:inline-flex;align-items:center;gap:6px}
.wkey i{width:11px;height:11px;display:inline-block}
.acts-list{display:flex;flex-direction:column}
.actr{display:flex;align-items:center;gap:14px;padding:12px 22px;border-top:1px solid var(--ln2)}
.actr:first-child{border-top:0}
.actr .ai{width:36px;height:36px;border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2);background:var(--sf2)}
.actr .ai.done{color:var(--grn)}.actr .ai.score{color:var(--lnk)}.actr .ai.add{color:var(--amb)}
.actr .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.actr .tx span{font-size:14px;font-weight:500;color:var(--ink)}
.actr .tx small{font-size:12px;color:var(--mut)}
.actr .tm{font-family:var(--mono);font-size:12px;color:var(--mut);white-space:nowrap}

/* ===== subject page ===== */
.sbanner{position:relative;color:#fff;background:var(--sc)}
.sbanner>.cvr{position:absolute;top:0;right:0;bottom:0;left:0}
.sbanner>.cvr img{object-position:left 30%}
.sb-in{position:relative;min-height:260px;display:flex;align-items:center;padding-top:28px;padding-bottom:28px}
.sb-in .wrap{display:flex;justify-content:flex-end}
.sb-t{width:min(520px,48%);display:flex;flex-direction:column;gap:8px;padding:26px 28px;background:var(--sc)}
.sb-t a,.sb-t button.bk{display:inline-flex;align-items:center;gap:6px;color:#fff;font-weight:600;font-size:14px;align-self:flex-start}
.sb-t .lbl{color:rgba(255,255,255,.78)}
.sb-t h1{font-family:var(--serif);font-weight:500;font-size:56px;line-height:1.05;letter-spacing:-.01em;color:#fff;overflow-wrap:anywhere}
.sb-t .m{font-size:15px;color:rgba(255,255,255,.88)}
.sb-t .acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--sf);border:1px solid var(--ln)}
.kp{padding:16px 22px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:2px;min-width:0}
.kp:first-child{border-left:0}
.kp b{font-family:var(--serif);font-weight:500;font-size:32px;line-height:40px}
.kp span{font-size:14px;color:var(--ink2)}
.smartrow{display:flex;gap:10px;flex-wrap:wrap}
.smartrow .btn .i{color:var(--k,currentColor)}
.tree{background:var(--sf);border:1px solid var(--ln)}
.thead,.trow{display:grid;grid-template-columns:minmax(0,1fr) 80px 200px 70px 100px 40px;gap:12px;align-items:center;padding:0 20px}
.thead{min-height:40px;background:var(--sf2);border-bottom:1px solid var(--ln)}
.thead .lbl:nth-child(2),.trow .tq{text-align:right}
.trow{min-height:64px;border-top:1px solid var(--ln2);position:relative;background:var(--sf)}
.node:first-child>.trow{border-top:0}
.trow.dropin{background:var(--priT);outline:2px dashed var(--pri);outline-offset:-2px;z-index:2}
.trow.dragging{opacity:.45}
.tname{display:flex;align-items:center;gap:6px;min-width:0;padding-left:calc(var(--dp,0)*30px)}
.grip{width:22px;color:var(--mut);cursor:grab;display:flex;flex:none}
.grip .i{width:16px;height:16px}
.tog{width:26px;height:26px;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.tog .i{width:16px;height:16px;transition:transform .15s}
.tog.open .i{transform:rotate(90deg)}
.tog-sp{width:26px;flex:none}
.topen{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;padding:10px 0;color:var(--ink)}
.topen>.i{color:var(--sx)}
.topen>span{display:flex;flex-direction:column;min-width:0}
.topen b{font-size:15px;font-weight:600;overflow-wrap:anywhere}
.topen small{font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.topen small .chip{height:20px;font-size:10px;padding:0 6px}
.trow .tq{font-family:var(--mono);font-size:14px}
.tcov{display:flex;align-items:center;gap:10px}
.tcov .meter{flex:1;height:6px}
.tcov span{font-family:var(--mono);font-size:12px;color:var(--ink2);width:38px;text-align:right}
.trow .tc{font-family:var(--mono);font-size:14px;text-align:right;color:var(--ink2)}
.trow .btn.tplay{width:100%}
.tree.slim .trow{grid-template-columns:minmax(0,1fr) 140px 100px 40px}
.tree.slim .tq,.tree.slim .tc{display:none}
.tree-hint{font-size:13px;color:var(--mut);margin-top:10px}
.drop-root{display:none;margin-top:8px;padding:12px;border:2px dashed var(--ln);text-align:center;font-size:13px;color:var(--mut)}
.drop-root.show{display:block}.drop-root.dropin{border-color:var(--pri);background:var(--priT);color:var(--lnk)}

/* ===== deck page ===== */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.dhead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.dhead .h1{font-size:56px;line-height:1.05;flex:1;min-width:0;overflow-wrap:anywhere}
.dhead .acts{display:flex;gap:8px;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip .sw{width:9px;height:9px}
.desc{font-size:15px;color:var(--ink2);max-width:720px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln)}
.tab{padding:10px 16px 12px;font-size:16px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:8px;align-items:baseline}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.tab .cnt{font-family:var(--mono);font-size:12px;color:var(--mut)}
.banner-amb{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--ambT);border:1px solid var(--ambF);flex-wrap:wrap}
.banner-amb>.i{color:var(--amb)}
.banner-amb .tx{flex:1;min-width:200px;font-size:15px}
.smart{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.smb{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--sf);border:1px solid var(--ln);text-align:left;color:var(--ink);min-width:0}
.smb:hover:not(:disabled){border-color:var(--ink2)}
.smb:disabled{opacity:.55}
.smb>.i{width:22px;height:22px;color:var(--k)}
.smb span{display:flex;flex-direction:column;flex:1;min-width:0}
.smb span b{font-size:15px;font-weight:600}
.smb span small{font-size:12px;color:var(--mut)}
.smb em{font-style:normal;font-family:var(--serif);font-size:30px;line-height:1}
.lvrow{display:grid;grid-template-columns:120px minmax(0,1fr) 34px 52px;gap:12px;align-items:center;padding:8px 0}
.lvrow .n{font-size:15px}
.lvrow .bar{height:10px;background:var(--ln2);position:relative}
.lvrow .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--sx)}
.lvrow .c{font-family:var(--mono);font-size:13px;text-align:right}
.lvrow .a{font-family:var(--mono);font-size:11px;line-height:14px;text-align:right}
.good{color:var(--grn)}.badt{color:var(--red)}.ambt{color:var(--amb)}
.srcs{display:flex;flex-direction:column;gap:10px}
.srcitem{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--ln);background:var(--sf2)}
.srcitem .n{width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:var(--sc,var(--pri));color:#fff;font-family:var(--mono);font-size:12px;font-weight:600;flex:none}
.srcitem b{font-size:14px;font-weight:600;display:block;overflow-wrap:anywhere}
.addsrc{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;border:1px dashed var(--ln);color:var(--lnk);font-weight:600;font-size:14px;width:100%}
.addsrc:hover{border-color:var(--pri)}
.scroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:10px 20px;border-bottom:1px solid var(--ln);background:var(--sf2);white-space:nowrap}
.tbl td{padding:12px 20px;border-bottom:1px solid var(--ln2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl .m{font-family:var(--mono)}
/* practice panel */
.setup{position:sticky;top:84px;background:var(--sf);border:1px solid var(--ln);border-top:3px solid var(--ink);padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.setup .shd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.setup .shd h2{font-family:var(--serif);font-weight:500;font-size:28px;line-height:34px}
.setup fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.setup legend{padding:0;margin-bottom:6px}
.mode{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--ln);cursor:pointer;background:var(--sf)}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode.sel{background:var(--priT);border:2px solid var(--pri);padding:13px 15px}
.mode .i{margin-top:2px}
.mode b{display:block;font-size:15px;font-weight:600}
.mode small{display:block;font-size:13px;line-height:19px;color:var(--ink2)}
.mode:focus-within{outline:2px solid var(--pri);outline-offset:2px}
.trow2{display:flex;align-items:center;gap:10px;margin-top:4px;font-size:14px;color:var(--ink2)}
.setup .sum{font-family:var(--mono);font-size:12px;color:var(--mut);padding-top:14px;border-top:1px solid var(--ln)}
.setup .chk .inp.n{height:36px;min-height:36px;width:64px}
.begin{height:52px;font-size:16px}

/* ===== question browser / search ===== */
.qtools{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.qtools .srch{flex:1 1 260px;height:auto;min-height:40px;background:var(--sf)}
.qtools select.inp{width:auto;min-height:40px;height:40px}
.qtable{background:var(--sf);border:1px solid var(--ln)}
.qhead,.qrow{display:grid;grid-template-columns:44px minmax(0,1fr) 140px 110px 112px;gap:12px;align-items:center;padding:0 16px}
.qhead{min-height:38px;background:var(--sf2);border-bottom:1px solid var(--ln)}
.qrow{padding-top:14px;padding-bottom:14px;border-top:1px solid var(--ln2)}
.qhead+.qrow{border-top:0}
.qrow .qn{font-family:var(--mono);font-size:13px;color:var(--mut)}
.qtx{display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0;color:var(--ink)}
.qtx>span{font-family:var(--serif);font-size:16px;line-height:23px}
.qtx small{font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qtx:hover>span{text-decoration:underline;text-decoration-color:var(--ln)}
.qlast{font-size:13px;display:inline-flex;align-items:center;gap:6px}
.qlast .i{width:16px;height:16px}
.qacts{display:flex;gap:6px;justify-content:flex-end}
.qfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-top:1px solid var(--ln);font-size:14px;color:var(--ink2);flex-wrap:wrap}
.sgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.sside{display:flex;flex-direction:column;gap:14px;position:sticky;top:88px}
.sside .h1{font-size:36px;overflow-wrap:anywhere}
.sfil{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 12px;border:1px solid var(--ln);background:var(--sf);font-size:14px;text-align:left;width:100%}
.sfil .sw{background:var(--sx)}
.sfil b{margin-left:auto;font-family:var(--mono);font-size:12px;font-weight:500;color:var(--mut)}
.sfil.on{background:var(--ink);border-color:var(--ink);color:var(--bg);font-weight:600}
.sfil.on b{color:var(--bg)}
.sres{background:var(--sf);border:1px solid var(--ln)}
.sr-i{padding:18px;border-top:1px solid var(--ln2);display:flex;flex-direction:column;gap:8px}
.sr-i:first-child{border-top:0}
.sr-m{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.sr-m .sw{background:var(--sx)}
.sr-m .chip{height:20px;font-size:10px}
.sr-q{font-family:var(--serif);font-size:17px;line-height:26px;color:var(--ink);text-align:left}
.sr-w{font-size:13px;color:var(--ink2)}
.sr-w .lbl{margin-right:6px}
.sr-a{display:flex;gap:8px;margin-top:4px}

/* ===== test screen ===== */
body.testing{overflow:hidden}
.test{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;background:var(--bg);z-index:10}
.tbar{height:60px;flex:none;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--sf);border-bottom:1px solid var(--ln);padding-top:env(safe-area-inset-top);box-sizing:content-box}
.tbar .vsep{width:1px;height:28px;background:var(--ln);flex:none}
.tbar .where{display:flex;align-items:center;gap:8px;font-size:14px;min-width:0;white-space:nowrap}
.tbar .where .sw{background:var(--sx)}
.tbar .where .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tnums{margin-left:auto;display:flex;align-items:center;gap:24px;padding-right:8px}
.tk{display:flex;flex-direction:column;align-items:center;min-width:50px}
.tk .lbl{font-size:10px;line-height:12px}
.tk b{font-family:var(--mono);font-size:18px;line-height:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tk.warn b{color:var(--red)}.tk.paused b{color:var(--amb)}
.tk.hid b{color:var(--mut)}
.zoom{display:flex;border:1px solid var(--ln);flex:none}
.zoom button{height:32px;padding:0 10px;background:var(--sf);font-size:13px;font-weight:600}
.zoom button+span+button{font-size:16px}
.zoom span{height:32px;min-width:46px;display:flex;align-items:center;justify-content:center;border-left:1px solid var(--ln);border-right:1px solid var(--ln);font-family:var(--mono);font-size:11px;color:var(--mut)}
.btn.flagc{color:var(--amb)}
.btn.flagc b{font-family:var(--mono);font-weight:600}
.btn.pause-on{background:var(--ambT);border-color:var(--ambF);color:var(--amb)}
.tbody{flex:1;min-height:0;display:flex;position:relative}
.rail{width:120px;flex:none;display:flex;flex-direction:column;background:var(--sf);border-right:1px solid var(--ln)}
.rail-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 14px 10px}
.rail-h span:last-child{font-family:var(--mono);font-size:11px;color:var(--mut)}
.rail-l{flex:1;min-height:0;overflow-y:auto;padding:4px 10px 12px 14px;display:grid;grid-template-columns:repeat(2,40px);grid-auto-rows:40px;gap:8px;align-content:start;scrollbar-width:thin}
.rail-k{padding:10px 14px 12px;border-top:1px solid var(--ln);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 4px;font-size:11px;color:var(--ink2)}
.rail-k span{display:flex;align-items:center;gap:5px}
.rail-k i{width:10px;height:10px;display:inline-block;flex:none}
.k-ok{background:var(--grnF)}.k-bad{background:var(--redT);border:1.5px solid var(--redF)}.k-done{background:var(--pri)}.k-flag{width:0!important;height:0!important;border-top:10px solid var(--ambF);border-left:10px solid transparent}
.cell{position:relative;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;background:var(--sf);color:var(--ink2);border:1px solid var(--ln);flex:none}
.cell:hover{border-color:var(--ink2)}
.cell.ok{background:var(--grnF);color:#fff;border-color:var(--grnF)}
.cell.bad{background:var(--redT);color:var(--red);border:1.5px solid var(--redF);font-weight:600}
.cell.done{background:var(--pri);color:#fff;border-color:var(--pri)}
.cell.cur{outline:2px solid var(--ink);outline-offset:2px;font-weight:700}
.cell.flag::after{content:"";position:absolute;top:-1px;right:-1px;width:0;height:0;border-top:12px solid var(--ambF);border-left:12px solid transparent}
.strip{display:none}
.tmain{flex:1;min-width:0;display:flex;min-height:0}
.qmain{flex:1;min-width:0;overflow-y:auto;padding:26px 48px 40px;-webkit-overflow-scrolling:touch}
.qwrap{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qmeta .r{margin-left:auto;display:flex;gap:8px}
.qmeta .chip.flg{color:var(--amb);border-color:var(--ambF);background:var(--ambT)}
.q{font-family:var(--serif);font-size:calc(22px*var(--z));line-height:1.5;color:var(--ink);overflow-wrap:break-word}
.q p{margin:0 0 .6em}.q p:last-child{margin:0}
.q img{max-height:380px;cursor:zoom-in}
.qimgs{display:flex;flex-direction:column;gap:8px}
.qimg{position:relative;display:block;max-width:560px;border:1px solid var(--ln);background:var(--sf);cursor:zoom-in;text-align:left}
.qimg img{display:block;max-height:420px;margin:0 auto}
.qimg .btn{position:absolute;top:8px;right:8px;pointer-events:none}
.opts{display:flex;flex-direction:column;gap:10px}
.optrow{display:flex}
.opt{flex:1;min-width:0;display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 16px;text-align:left;background:var(--sf);border:1px solid var(--ln);color:var(--ink)}
button.opt:not(:disabled):hover{border-color:var(--ink2)}
.opt .lt{width:32px;height:32px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:600;border:1.5px solid var(--ink2);color:var(--ink)}
.opt .ob{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.opt .ot{font-size:calc(16px*var(--z));line-height:1.5;font-weight:500;overflow-wrap:break-word}
.opt .ot img{max-height:200px}
.opt .tg{font-family:var(--mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:5px}
.opt .tg .i{width:13px;height:13px;stroke-width:2.2}
.opt .rt{font-size:calc(14px*var(--z));line-height:1.5;color:var(--ink2)}
.opt .rt p{margin:0}
.opt.struck{background:var(--sf2)}
.opt.struck .lt{border-color:var(--ln);color:var(--mut)}
.opt.struck .ot{color:var(--mut);text-decoration:line-through}
.opt.picked{background:var(--priT);border:2px solid var(--pri);padding:11px 15px}
.opt.picked .lt{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.picked .ot{font-weight:600}
.opt.picked .tg{color:var(--lnk)}
.opt.key,.opt.wrong,.opt.other{align-items:flex-start}
.opt.key{background:var(--grnT);border:2px solid var(--grnF);padding:13px 15px}
.opt.key .lt{background:var(--grnF);border-color:var(--grnF);color:#fff}
.opt.key .tg{color:var(--grn)}
.opt.key .ot,.opt.wrong .ot{font-weight:600}
.opt.wrong{background:var(--redT);border:2px solid var(--redF);padding:13px 15px}
.opt.wrong .lt{background:var(--redF);border-color:var(--redF);color:#fff}
.opt.wrong .tg{color:var(--red)}
.opt.other{padding:14px 16px}
.opt.other .lt{border-color:var(--ln);color:var(--mut)}
.opt.other .ot{color:var(--ink2)}
.opt.other .rt{color:var(--mut)}
.opt:disabled{opacity:1;cursor:default}
.xo{width:52px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--sf);color:var(--mut);border:1px solid var(--ln);border-left:0}
.xo:hover{color:var(--ink)}
.xo.on{background:var(--ink2);color:var(--sf);border-color:var(--ink2)}
.hint{font-size:13px;line-height:20px;color:var(--mut)}
.hint .i{width:16px;height:16px;vertical-align:-3px;margin:0 2px}
.kside{width:360px;flex:none;background:var(--sf);border-left:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.ks-b{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 24px;display:flex;flex-direction:column;gap:18px}
.ks-f{padding:10px 22px;border-top:1px solid var(--ln);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.ks-f .i{width:14px;height:14px}
.verdict{display:flex;align-items:center;gap:10px;padding:11px 14px;font-size:15px;font-weight:600}
.verdict.ok{background:var(--grnT);border:1px solid var(--grnF);color:var(--grn)}
.verdict.bad{background:var(--redT);border:1px solid var(--redF);color:var(--red)}
.exp{display:flex;flex-direction:column;gap:8px}
.exp .tx{font-family:var(--serif);font-size:calc(16px*var(--z));line-height:1.55;color:var(--ink);overflow-wrap:break-word}
.exp .tx p{margin:0 0 .5em}.exp .tx p:last-child{margin:0}
.exp .tx.locked{font-family:var(--sans);font-size:14px;line-height:21px;color:var(--mut)}
.ref{display:flex;gap:12px;padding-top:14px;border-top:1px solid var(--ln)}
.ref>.i{color:var(--ink2)}
.ref .rb{display:flex;flex-direction:column;gap:3px;min-width:0}
.ref .rs{font-size:14px;line-height:20px;font-weight:600;overflow-wrap:anywhere}
.ref .rp{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.ref .rx{font-family:var(--serif);font-style:italic;font-size:14px;line-height:20px;color:var(--ink2)}
.ref .link{font-size:13px;margin-top:4px}
.tipb{background:var(--ambT);border-top:3px solid var(--ambF);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.tipb .lbl{color:var(--amb);display:flex;align-items:center;gap:6px}
.tipb .lbl .i{width:14px;height:14px}
.tipb .tx{font-family:var(--serif);font-size:calc(15px*var(--z));line-height:1.5;color:var(--ink)}
.keys{display:grid;grid-template-columns:64px minmax(0,1fr);gap:6px 10px;font-size:13px;color:var(--ink2)}
.keys b{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--ink)}
.exambox{display:flex;flex-direction:column;gap:10px;padding:14px;background:var(--priT);border:1px solid var(--pri)}
.exambox .lbl{color:var(--lnk)}
.exambox p{font-size:14px;line-height:21px}
.exnums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ln)}
.exnums div{padding:12px;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:2px}
.exnums div:first-child{border-left:0}
.exnums b{font-family:var(--serif);font-weight:400;font-size:26px;line-height:32px}
.notebox{display:flex;flex-direction:column;gap:8px}
.notebox .lbl{display:flex;align-items:center;gap:6px}
.notebox .lbl .i{width:14px;height:14px}
.notebox textarea{width:100%;min-height:96px;resize:vertical;padding:10px 12px;border:1px solid var(--ln);background:var(--sf2);font-size:14px;line-height:20px;border-radius:2px;outline:none}
.notebox textarea:focus{border-color:var(--pri)}
.notebox .saved{font-family:var(--mono);font-size:11px;color:var(--grn)}
.tfoot{height:64px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--sf);border-top:1px solid var(--ln);box-sizing:content-box;padding-bottom:env(safe-area-inset-bottom)}
.tfoot .mid{margin:0 auto;font-family:var(--mono);font-size:12px;color:var(--mut);text-align:center}
.tfoot .nx{min-width:140px}
.btn.flag-on{background:var(--ambT);border-color:var(--ambF);color:var(--amb)}
.pausev{position:absolute;top:0;right:0;bottom:0;left:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px}
.pausec{width:440px;max-width:100%;background:var(--sf);border:1px solid var(--ln);padding:32px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.pausec .pi{width:56px;height:56px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center}
.pausec h2{font-family:var(--serif);font-weight:500;font-size:32px}
.pausec .pt{font-family:var(--mono);font-size:40px;line-height:44px;font-weight:500}
.pausec p{font-size:14px;line-height:21px;color:var(--ink2)}
.pausec .row{display:flex;gap:10px;width:100%}.pausec .row .btn{flex:1}
.tmob{display:none}
@media (max-width:1024px){.tmob{display:flex;gap:8px}.tbar .zoom{display:none}}
/* tablet + phone test layout */
@media (max-width:1024px){
  .test{position:static;min-height:100vh;min-height:100dvh}
  body.testing{overflow:auto}
  .tbar{position:sticky;top:0;z-index:12}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:10px var(--gut);background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:calc(60px + env(safe-area-inset-top));z-index:11;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .strip .cell{width:44px;height:44px}
  .strip .cell.cur{outline-offset:-4px;outline-width:2px;box-shadow:inset 0 0 0 1px var(--sf)}
  .rail{display:none}
  .tbody{display:block;flex:none}
  .tmain{display:block}
  .qmain{overflow:visible;padding:24px var(--gut) 8px}
  .kside{width:auto;border:0;background:transparent;display:block;padding:0 var(--gut) 24px}
  .ks-b{overflow:visible;max-width:800px;margin:0 auto;padding:10px 0 0}
  .ks-b>.exp,.ks-b>.exambox+.exnums{background:var(--sf);border:1px solid var(--ln);padding:16px}
  .ks-b>.exp.lockedbox,.ks-b>.keysbox{display:none}
  .ks-f{max-width:800px;margin:0 auto;padding:12px 0 0;border:0}
  .tfoot{position:sticky;bottom:0;z-index:12;padding:0 var(--gut);padding-bottom:env(safe-area-inset-bottom)}
  .tfoot .mid{display:none}
  .tfoot .nx{flex:1;margin-left:0}
  .tbar .hide-t{display:none!important}
  .tnums{gap:18px}
  .pausev{position:fixed;top:calc(60px + env(safe-area-inset-top));z-index:11}
}
@media (max-width:600px){
  .tbar{gap:8px;padding:0 0 0 4px;height:60px}
  .tbar .bk{width:44px;height:44px;padding:0}
  .tbar .bk span{display:none}
  .tbar .vsep,.tbar .zoom,.tbar .flagc,.tbar .tk.it,.tbar .tk.sc,.tbar .chip{display:none!important}
  .tbar .where{flex-direction:column;align-items:flex-start;gap:0;font-size:12px;line-height:16px}
  .tbar .where .t{font-weight:500;color:var(--ink2);max-width:150px}
  .tbar .where .mt{font-family:var(--mono);font-size:14px;color:var(--ink);font-weight:600}
  .tbar .where .mt small{font-weight:400;color:var(--mut);font-size:13px}
  .tnums{gap:0;padding:0}
  .tk.tm{min-width:0;margin-right:8px}.tk.tm .lbl{display:none}.tk.tm b{font-size:17px}
  .tbar .pz{width:48px;height:60px;border-width:0 0 0 1px}
  .tbar .endb{height:60px;padding:0 14px;font-size:15px}
  .tbar .endb .lng{display:none}
  .qmeta .qlab{display:none}
  .q{font-size:calc(19px*var(--z))}
  .opt{gap:12px;padding:12px 14px}
  .xo{width:48px}
  .tfoot{gap:8px}
  .tfoot .pv,.tfoot .fl{width:58px;padding:0}
  .tfoot .pv span,.tfoot .fl span{display:none}
  .tfoot .btn{height:48px}
}

/* ===== results ===== */
.rhero{display:flex;flex-wrap:wrap;gap:32px;padding:32px;align-items:center}
.rh-l{flex:1 1 520px;min-width:0;display:flex;flex-direction:column;gap:12px}
.rbig{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rbig b{font-family:var(--serif);font-size:112px;line-height:.95;font-weight:500;letter-spacing:-.02em}
.rbig span{font-family:var(--serif);font-size:44px;color:var(--mut)}
.rbig em{font-style:normal;font-family:var(--mono);font-size:22px;font-weight:600;padding:4px 10px;border:2px solid var(--ink);margin-left:6px;align-self:center}
.rh-l h1{font-family:var(--serif);font-size:32px;line-height:1.2;font-weight:500}
.rh-l p{font-size:16px;line-height:25px;color:var(--ink2);max-width:560px}
.rmeta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--ink2)}
.rmeta span{display:flex;align-items:center;gap:6px}
.rmeta .i{width:16px;height:16px}
.stamp{flex:none;width:184px;height:184px;border:2px solid var(--ambF);padding:5px;background:var(--ambT)}
.stamp>div{width:100%;height:100%;border:1px solid var(--ambF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--amb)}
.stamp .i{width:26px;height:26px;fill:var(--ambF);stroke:var(--amb)}
.stamp b{font-family:var(--serif);font-size:40px;line-height:1;color:var(--ink);font-weight:500}
.stamp small{font-family:var(--mono);font-size:11px}
.stamp.plain{border-color:var(--ln);background:var(--sf2)}.stamp.plain>div{border-color:var(--ln);color:var(--mut)}.stamp.plain .i{fill:none;stroke:var(--mut)}
.racts{display:flex;gap:10px;flex-wrap:wrap}
.rgrid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.rgrid>.panel{flex:1 1 400px;min-width:0}
.rgrid>.panel:last-child{flex-basis:500px}
.lvr{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.lvr .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lvr .t span{font-size:15px;font-weight:600}
.lvr .t small{font-family:var(--mono);font-size:13px;color:var(--ink2)}
.lvr .b{display:flex;height:12px;border:1px solid var(--ln)}
.lvr .b i{background:var(--grnF)}.lvr .b em{flex:1;background:var(--redT)}
.weak{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:var(--sf2);border:1px solid var(--ln);font-size:14px;line-height:21px;color:var(--ink2)}
.weak .i{color:var(--red);margin-top:1px}
.weak b{color:var(--ink)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,44px);gap:6px}
.cells .cell{width:44px;height:44px}
.ckey{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12px;color:var(--ink2);margin-top:16px;align-items:center}
.ckey span{display:flex;align-items:center;gap:6px}
.ckey i{width:12px;height:12px;display:inline-block}

/* ===== dialogs ===== */
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:var(--shade);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{width:100%;max-width:520px;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--ink);box-shadow:0 18px 48px rgba(21,23,28,.22);color:var(--ink)}
.dlg.wide{max-width:920px}.dlg.mid{max-width:600px}.dlg.editor{max-width:1000px}
.dh{display:flex;align-items:flex-start;gap:16px;padding:20px 24px;background:var(--sf);border-bottom:1px solid var(--ln);flex:none}
.dh .tt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dh h2{font-family:var(--serif);font-weight:500;font-size:28px;line-height:34px;overflow-wrap:anywhere}
.dh .x{margin:-2px -8px 0 0}
.db{flex:1;min-height:0;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.db.split{display:grid;grid-template-columns:minmax(0,1fr) 310px;padding:0;gap:0}
.db.split>.m{padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0}
.db.split>.s{padding:22px 24px;background:var(--sf2);border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:16px;min-width:0}
.df{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 24px;background:var(--sf);border-top:1px solid var(--ln);flex:none;flex-wrap:wrap}
.df .l{margin-right:auto;display:flex;align-items:center;gap:10px}
.df .btn{min-width:80px}
.df .note{margin-right:auto}
.dsec{display:flex;flex-direction:column;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--ln)}
.dsec:last-child{border-bottom:0;padding-bottom:0}
.dsec>h3{font-family:var(--serif);font-weight:500;font-size:21px;line-height:28px}
.rows{display:flex;flex-direction:column;border:1px solid var(--ln);background:var(--sf)}
.rw{display:flex;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--ln2);font-size:14px}
.rw:first-child{border-top:0}
.rw b{font-family:var(--mono)}
.sheetlist{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln)}
.sheetbtn{display:flex;align-items:center;gap:14px;min-height:52px;padding:8px 16px;text-align:left;border-top:1px solid var(--ln2);font-size:15px}
.sheetbtn:first-child{border-top:0}
.sheetbtn:hover{background:var(--sf2)}
.sheetbtn span{display:flex;flex-direction:column}
.sheetbtn small{font-size:12px;color:var(--mut)}
.sheetbtn.danger{color:var(--red)}
/* subject dialog */
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swb{width:44px;height:44px;background:var(--c);border:2px solid transparent;outline:0}
.swb.on{border-color:var(--sf);box-shadow:0 0 0 2px var(--ink)}
.arts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.artb{display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--ln);text-align:left}
.artb .cvr{height:72px}
.artb span.n{padding:8px 10px;font-size:13px;font-weight:600}
.artb.on{border:2px solid var(--ink);box-shadow:0 0 0 2px var(--sf) inset}
.upbox{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px dashed var(--ln);background:var(--sf2);flex-wrap:wrap}
.upbox b{font-size:14px}
.upbox .note{flex:1;min-width:180px}
.pv-card{background:var(--sf);border:1px solid var(--ln)}
.pv-card .cvr{height:120px}
.pv-card .b{padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.pv-ban{padding:14px 16px;color:#fff;background:var(--sc)}
.pv-ban .lbl{color:rgba(255,255,255,.78)}
.pv-ban b{display:block;font-family:var(--serif);font-weight:500;font-size:26px;line-height:30px}
/* import */
.ftypes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--ln);background:var(--sf)}
.ftypes button{padding:12px 8px;text-align:center;border-left:1px solid var(--ln);display:flex;flex-direction:column;gap:2px}
.ftypes button:first-child{border-left:0}
.ftypes button b{font-size:15px}
.ftypes button small{font-family:var(--mono);font-size:11px;color:var(--mut)}
.ftypes button.on{background:var(--ink);color:var(--bg)}
.ftypes button.on small{color:var(--bg);opacity:.75}
.dropz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;border:1.5px dashed var(--ink2);background:var(--sf);padding:20px;text-align:center}
.dropz.over{background:var(--priT);border-color:var(--pri)}
.dropz .i{width:28px;height:28px;color:var(--ink2)}
.dropz b{font-size:16px}
.fhelp{font-size:13px;line-height:19px;color:var(--ink2);display:flex;flex-direction:column;gap:10px}
.fhelp .lbl{color:var(--ink)}
.fcols{display:grid;grid-template-columns:96px minmax(0,1fr);border-top:1px solid var(--ln)}
.fcols code{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--ink);padding:8px 8px 8px 0;border-bottom:1px solid var(--ln)}
.fcols span{padding:8px 0;border-bottom:1px solid var(--ln)}
.fhelp pre{font-family:var(--mono);font-size:11px;line-height:16px;white-space:pre-wrap;background:var(--sf);border:1px solid var(--ln);padding:10px;margin:0;color:var(--ink)}
.fhelp p{margin:0}
.fhelp code{font-family:var(--mono);font-size:11.5px}
.ifound{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--sf);border:1px solid var(--ln)}
.ifound div{padding:12px 16px;border-left:1px solid var(--ln);display:flex;flex-direction:column}
.ifound div:first-child{border-left:0}
.ifound b{font-family:var(--serif);font-weight:500;font-size:30px;line-height:38px}
.ifile{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px dashed var(--ink2);background:var(--sf);flex-wrap:wrap}
.ifile .ft{width:52px;height:52px;border:1px solid var(--ln);background:var(--sf2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600;color:var(--grn);flex:none}
.ifile .tx{flex:1;min-width:0}
.ifile .tx b{display:block;font-size:15px;overflow-wrap:anywhere}
.ifile .tx small{font-size:13px;color:var(--ink2)}
.skips{background:var(--ambT);border:1px solid var(--ambF);font-size:13px}
.skips summary{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--amb)}
.skips ul{margin:0;padding:0 14px 12px 32px;color:var(--ink2);max-height:160px;overflow-y:auto}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
/* editor */
.rich{min-height:44px;border:1px solid var(--ln);background:var(--sf);padding:10px 12px;font-size:15px;line-height:1.55;outline:none;border-radius:2px;overflow-wrap:break-word}
.rich:focus{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.rich.big{min-height:110px;font-family:var(--serif);font-size:17px}
.rich.sm{font-size:14px;color:var(--ink2);background:var(--sf2)}
.rich.tip{background:var(--ambT);border-color:var(--ambF)}
.rich:empty::before{content:attr(data-ph);color:var(--mut)}
.rich img{max-height:180px}
.eopts{display:flex;flex-direction:column;gap:8px}
.eopt{display:flex;flex-direction:column;gap:8px;padding:10px;background:var(--sf);border:1px solid var(--ln)}
.eopt.key{background:var(--grnT);border:2px solid var(--grnF);padding:9px}
.eopt-h{display:flex;align-items:center;gap:10px}
.eopt-h .lt{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;border:1.5px solid var(--ink2);flex:none}
.eopt.key .lt{background:var(--grnF);border-color:var(--grnF);color:#fff}
.eopt-h .rich{flex:1;min-width:0}
.eopt-h label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--grn);cursor:pointer}
.eopt:not(.key) .eopt-h label span{display:none}
.addopt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;border:1px dashed var(--ln);color:var(--lnk);font-weight:600;font-size:14px;width:100%}
.addopt:hover{border-color:var(--pri)}
.eimgs{display:flex;gap:8px;flex-wrap:wrap}
.eimg{position:relative;border:1px solid var(--ln);background:var(--sf)}
.eimg img{display:block;height:90px;width:auto}
.eimg .btn{position:absolute;top:4px;right:4px}
.addpic{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px;border:1px dashed var(--ln);background:var(--sf);font-size:12px;color:var(--mut);width:100%}
.addpic b{font-size:14px;color:var(--ink)}
.addpic .i{color:var(--ink2)}
.lvlgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--ln);background:var(--sf)}
.lvlgrid button{text-align:center;min-height:44px;font-size:13.5px;border-left:1px solid var(--ln);border-top:1px solid var(--ln)}
.lvlgrid button:nth-child(odd){border-left:0}
.lvlgrid button:nth-child(-n+2){border-top:0}
.lvlgrid button.on{background:var(--ink);color:var(--bg);font-weight:600}
.ehist{font-size:13px;line-height:21px;color:var(--ink2);padding-top:14px;border-top:1px solid var(--ln)}
/* settings */
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.thb{display:flex;flex-direction:column;border:1px solid var(--ln);background:var(--sf);text-align:left}
.thb.on{border:2px solid var(--pri)}
.thb .pv{height:64px;display:grid;grid-template-columns:1fr 1fr;gap:0}
.thb .pv i{display:flex;flex-direction:column;gap:5px;padding:10px 12px}
.thb .pv i::before{content:"";height:5px;width:44px;background:currentColor}
.thb .pv i::after{content:"";height:24px;border:1px solid currentColor;opacity:.35}
.thb .pv .lt{background:#F2F0EB;color:#15171C}.thb .pv .dk{background:#0F1115;color:#ECEAE4}
.thb b{padding:10px 12px;font-size:14px}
.stepper{display:flex;border:1px solid var(--ink);background:var(--sf)}
.stepper button{width:48px;height:48px;font-size:20px;text-align:center}

function artSVG(kind){

  }else if(kind==="pathology"){

    for(i=0;i<14;i++){x=300+(i*37)%120;y=90+(i*53)%110;s+='<circle cx="'+x+'" cy="'+y+'" r="'+(6+i%4*2)+'" stroke-opacity=".45"/>'}

}

var LP="md2:";
var store={
  get:function(path){
    if(DB)return DB.doc(path).get().then(function(s){return s.exists?clone(s.data()):null});
    return Promise.resolve(lsGet(LP+path));
  },
  set:function(path,v){
    var c=clone(v);
    if(DB)return DB.doc(path).set(c).catch(function(e){if(e&&e.code==="unavailable")return new Promise(function(r){setTimeout(r,900)}).then(function(){return DB.doc(path).set(c)});throw e});
    lsSet(LP+path,c);return Promise.resolve();
  },
  del:function(path){if(DB)return DB.doc(path).delete();lsDel(LP+path);return Promise.resolve()},
  list:function(col){
    if(DB)return DB.collection(col).get().then(function(s){return s.docs.map(function(d){var o=clone(d.data());o.__id=d.id;return o})});
    var out=[],pre=LP+col+"/";
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(pre)===0&&k.slice(pre.length).indexOf("/")<0){var o=lsGet(k);if(o){o.__id=k.slice(pre.length);out.push(o)}}}}catch(e){}
    return Promise.resolve(out);
  },
  loadItems:function(meta){
    var ps=[];for(var i=0;i<(meta.chunks||0);i++)ps.push(store.get("decks/"+meta.id+"/chunks/"+i));
    return Promise.all(ps).then(function(cs){var out=[];cs.forEach(function(c){if(c&&c.items)out=out.concat(c.items)});return out});
  },
  saveItems:function(meta,items){
    var chunks=[],cur=[],size=0,old=meta.chunks||0;
    items.forEach(function(it){var n=JSON.stringify(it).length;if(cur.length&&size+n>300000){chunks.push(cur);cur=[];size=0}cur.push(it);size+=n});
    if(cur.length)chunks.push(cur);
    meta.chunks=chunks.length;meta.count=items.length;meta.levels=levelCounts(items);meta.updated=Date.now();
    var ps=chunks.map(function(c,i){return store.set("decks/"+meta.id+"/chunks/"+i,{items:c})});
    for(var j=chunks.length;j<old;j++)ps.push(store.del("decks/"+meta.id+"/chunks/"+j));
    return Promise.all(ps).then(function(){return saveMeta(meta)});
  }
};
function levelCounts(items){var c={};items.forEach(function(it){var l=it.lvl||"Other";c[l]=(c[l]||0)+1});return c}
function deckDoc(meta){var m=clone(meta);delete m.__id;return m}
function saveMeta(meta){return store.set("decks/"+meta.id,deckDoc(meta))}

function deckById(id){for(var i=0;i<S.decks.length;i++)if(S.decks[i].id===id)return S.decks[i];return null}
function children(id,sid){return S.decks.filter(function(d){return(d.parent||null)===(id||null)&&(!sid||d.subject===sid)}).sort(function(a,b){return((a.order||0)-(b.order||0))||a.title.localeCompare(b.title)})}
function descendants(id){var out=[];(function walk(p){S.decks.forEach(function(d){if(d.parent===p){out.push(d);walk(d.id)}})})(id);return out}
function treeIds(id){return[id].concat(descendants(id).map(function(d){return d.id}))}
function deckPath(d){var out=[],x=d,guard=0;while(x&&x.parent&&guard++<20){x=deckById(x.parent);if(x)out.unshift(x)}return out}
function subjDecks(sid){return S.decks.filter(function(d){return d.subject===sid})}
function treeCount(id){var n=0;treeIds(id).forEach(function(x){var d=deckById(x);if(d)n+=d.count||0});return n}
function subjCount(sid){var n=0;subjDecks(sid).forEach(function(d){n+=d.count||0});return n}

/* per-question stats live in progress[deck].qs[index] = {a:attempts,c:correct,w:lastWrong,t:time,s:starred,n:note} */
function qsOf(ref){var p=ref.split(":"),pr=prog(p[0]);pr.qs=pr.qs||{};return pr.qs[p[1]]||null}
function qsSet(ref,patch){var p=ref.split(":"),pr=prog(p[0]);pr.qs=pr.qs||{};var o=pr.qs[p[1]]||(pr.qs[p[1]]={});for(var k in patch){if(patch[k]===null)delete o[k];else o[k]=patch[k]}saveProgress(p[0])}
function refsOfDecks(ids){var out=[];ids.forEach(function(id){var d=deckById(id);if(!d)return;for(var i=0;i<(d.count||0);i++)out.push(id+":"+i)});return out}
function deckStats(ids){
  var seen=0,total=0,best=null,c=0,t=0,secs=0,missed=0,starred=0,last=0,right=0;
  ids.forEach(function(id){var d=deckById(id);if(!d)return;var p=S.progress[id]||{},qs=p.qs||{};total+=d.count||0;
    Object.keys(qs).forEach(function(k){if(+k>=(d.count||0))return;if(qs[k].a){seen++;if(!qs[k].w)right++}if(qs[k].w)missed++;if(qs[k].s)starred++});
    last=Math.max(last,p.last||0)});
  var root=S.progress[ids[0]]||{};
  (root.history||[]).forEach(function(x){var s=pct(x.correct,x.total);if(best===null||s>best)best=s;c+=x.correct;t+=x.total;secs+=x.secs||0});
  var live=root.session&&!root.session.submitted?root.session:null;if(live)secs+=live.acc||0;
  return{seen:seen,total:total,done:pct(seen,total),acc:seen?pct(right,seen):null,best:best,avg:t?Math.round(c/t*100):null,secs:secs,live:live,missed:missed,starred:starred,last:last,
    remaining:live?live.list.length-Object.keys(live.answers||{}).length:0,tests:(root.history||[]).length};
}
function subjStats(sid){var a=0,c=0,last=0,seen=0,total=0;subjDecks(sid).forEach(function(d){var p=S.progress[d.id]||{},qs=p.qs||{};total+=d.count||0;
  Object.keys(qs).forEach(function(k){if(+k<(d.count||0)&&qs[k].a){seen++;a+=1;if(!qs[k].w)c++}});last=Math.max(last,p.last||0)});
  return{acc:a?Math.round(c/a*100):null,last:last,seen:seen,total:total,done:pct(seen,total)}}
function allHistory(){var out=[];Object.keys(S.progress).forEach(function(id){((S.progress[id]||{}).history||[]).forEach(function(h){out.push(h)})});return out}
function avgScore(days){var c=0,t=0,lim=days?Date.now()-days*86400000:0;allHistory().forEach(function(h){if((h.end||h.date)>=lim){c+=h.correct;t+=h.total}});return t?Math.round(c/t*100):null}
function streak(){var d=S.act.days||{},n=0,t=new Date();if(!(d[dayKey(t)]&&d[dayKey(t)].a))t.setDate(t.getDate()-1);while(d[dayKey(t)]&&d[dayKey(t)].a){n++;t.setDate(t.getDate()-1)}return n}
function bestStreak(){var keys=Object.keys(S.act.days||{}).filter(function(k){return S.act.days[k].a}).sort(),best=0,run=0,prev=null;
  keys.forEach(function(k){var d=new Date(k+"T00:00:00");if(prev&&(d-prev)/86400000<1.5)run++;else run=1;best=Math.max(best,run);prev=d});return best}

/* ================= load + migrate ================= */
function ensureItems(ids){
  var need=ids.filter(function(id){return!S.items[id]&&deckById(id)});
  return Promise.all(need.map(function(id){return store.loadItems(deckById(id)).then(function(it){S.items[id]=it})}));
}
function itemOf(ref){var p=ref.split(":"),a=S.items[p[0]];return a?a[+p[1]]:null}
function loadAll(){
  return Promise.all([store.get("meta/library"),store.list("decks"),store.list("progress"),store.get("stats/activity"),store.list("covers")]).then(function(r){
    var lib=r[0],decks=r[1],progs=r[2],act=r[3],covers=r[4],changed=[];
    S.decks=decks.map(function(d){if(!d.id)d.id=d.__id;delete d.__id;return d}).filter(function(d){return d.id});
    S.progress={};progs.forEach(function(p){var id=p.__id;delete p.__id;S.progress[id]=p});
    S.act=act||{};S.act.days=S.act.days||{};S.act.events=S.act.events||[];
    S.covers={};covers.forEach(function(c){S.covers[c.__id]=c.img});
    /* subjects */
    if(!lib||!lib.subjects){lib={v:2,subjects:PRESETS.map(function(p,i){return{id:uid("s"),name:p.name,color:p.color,art:p.art,order:i}})};changed.push("lib")}
    S.lib=lib;
    S.decks.forEach(function(d){
      if(d.subject&&subjById(d.subject))return;
      var name=d.subject||guessSubjectName(d.path||d.title)||"General",s=null;
      S.lib.subjects.forEach(function(x){if(x.name.toLowerCase()===String(name).toLowerCase())s=x});
      if(!s){s={id:uid("s"),name:name,color:PALETTE[S.lib.subjects.length%PALETTE.length].k,art:guessArt(name),order:S.lib.subjects.length};S.lib.subjects.push(s);changed.push("lib")}
      d.subject=s.id;if(d.parent===undefined)d.parent=null;changed.push(d);
    });
    /* progress from the first version: numeric session lists and "seen" maps */
    Object.keys(S.progress).forEach(function(id){var p=S.progress[id],dirty=false;
      if(p.seen){p.qs=p.qs||{};Object.keys(p.seen).forEach(function(k){p.qs[k]=p.qs[k]||{a:1}});delete p.seen;dirty=true}
      var s=p.session;if(s&&s.list&&s.list.length&&typeof s.list[0]==="number"){
        var map=function(o){var n={};Object.keys(o||{}).forEach(function(k){n[id+":"+k]=o[k]});return n};
        s.list=s.list.map(function(i){return id+":"+i});s.answers=map(s.answers);s.orders=map(s.orders);s.flags=map(s.flags);s.itemTime=map(s.itemTime);s.ids=[id];dirty=true}
      if(dirty)changed.push("p:"+id)});
    var ps=[];
    if(changed.indexOf("lib")>-1)ps.push(saveLib());
    changed.forEach(function(c){if(typeof c==="object")ps.push(saveMeta(c));else if(c.indexOf("p:")===0)ps.push(store.set("progress/"+c.slice(2),S.progress[c.slice(2)]))});
    return Promise.all(ps);
  });
}
function guessSubjectName(s){var low=String(s||"").toLowerCase();for(var i=0;i<KNOWN.length;i++)if(low.indexOf(KNOWN[i].toLowerCase())>-1)return KNOWN[i];
  var m={histo:"Histology",anat:"Anatomy",physio:"Physiology",bioch:"Biochemistry",prevent:"Preventive Medicine",pharma:"Pharmacology",patho:"Pathology",micro:"Microbiology"};for(var k in m)if(low.indexOf(k)>-1)return m[k];return""}
function prefetchAll(){var ids=S.decks.map(function(d){return d.id}),i=0;(function next(){if(i>=ids.length)return;var id=ids[i++];ensureItems([id]).then(function(){setTimeout(next,150)},function(){setTimeout(next,1500)})})()}

function shrinkImage(src,maxW,maxBytes){
  return new Promise(function(res,rej){
    var url=typeof src==="string"?src:URL.createObjectURL(src),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,maxW/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      var q=.82,out=c.toDataURL("image/jpeg",q);
      while(out.length*.75>maxBytes&&q>.35){q-=.1;out=c.toDataURL("image/jpeg",q)}
      if(out.length*.75>maxBytes){c.width=Math.round(c.width*.7);c.height=Math.round(c.height*.7);g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",.6)}
      if(typeof src!=="string")URL.revokeObjectURL(url);res(out)};
    img.onerror=function(){if(typeof src!=="string")URL.revokeObjectURL(url);rej(new Error("img"))};
    img.src=url;
  });
}

    });
    jobs.push(Promise.all(ps).then(function(){var v=root.innerHTML;if(sub)it[key][sub]=v;else it[key]=v}));
  }
  items.forEach(function(it){
    fixHTML(it,"q");fixHTML(it,"gen");fixHTML(it,"tip");LET.forEach(function(L){if(it.o[L])fixHTML(it,"o",L);if(it.r&&it.r[L])fixHTML(it,"r",L)});
    if(it.imgs)jobs.push(Promise.all(it.imgs.map(function(u){return shrinkImage(u,1400,220000).catch(function(){return null})})).then(function(a){it.imgs=a.filter(Boolean);if(!it.imgs.length)delete it.imgs}));
  });
  var total=jobs.length,done=0;if(progress&&total)progress(0,total);
  return Promise.all(jobs.map(function(j){return j.then(function(){done++;if(progress)progress(done,total)})})).then(function(){return items});
}

var HELP2={
  xlsx:'<span class="lbl">How to set up your Excel file</span><p>One question per row. Put these headings in the first row; the order doesn’t matter and extra columns are ignored.</p><div class="fcols">'+
    [["Question","The stem. <b>Required.</b>"],["Option A … F","Choices. At least A and B."],["Correct","Letter of the right choice, or its exact text. <b>Required.</b>"],["Rationale A … F","Why each choice is right or wrong."],["Explanation","Longer text shown after answering."],["Study Tip","A memory hook."],["Level","Remembering, Understanding, Applying or Analyzing."],["Page","Book page number."],["Passage","First words of the paragraph it came from."]].map(function(r){return'<code>'+r[0]+'</code><span>'+r[1]+'</span>'}).join("")+
    '</div><p>Optional second sheet named <code>Deck info</code> with rows <code>Deck name</code>, <code>Subject</code>, <code>Source</code>, <code>Description</code>. CSV files with the same headings work too.</p><a class="link" href="templates/meddecks-excel-template.xlsx" download>'+ic("download","s")+'Download Excel template</a>',
  docx:'<span class="lbl">How to set up your Word file</span><p>Type each question as a numbered block. Bold, italics and Word’s automatic numbering are fine. A picture under a question comes in with it.</p>'+
    '<pre>Deck: Bone\nSubject: Histology\nSource: Pawlina, Histology — Ch. 8\n\n1. Which cell secretes osteoid?\nA. Osteoclast\nB. Osteoblast\nC. Osteocyte\nD. Chondrocyte\nAnswer: B\nLevel: Remembering\nRationale A: Osteoclasts resorb bone.\nExplanation: Osteoblasts lay down…\nStudy tip: Blasts build, clasts chew.\nPage: 241\nPassage: Osteoblasts are…</pre>'+

  apkg:'<span class="lbl">Bringing a deck from Anki</span><p>In Anki’s deck list, click the gear beside the deck, choose <b>Export</b>, keep “Anki Deck Package (.apkg)” and save.</p><div class="fcols">'+
    [["Question","The stem."],["OptionA … D","The choices."],["Correct","The right letter."],["RationaleA … D","Optional rationales."],["QuizExamTip","Optional study tip."],["Page · Passage","Optional reference."]].map(function(r){return'<code>'+r[0]+'</code><span>'+r[1]+'</span>'}).join("")+'</div><p>Pictures on the cards come in with their questions.</p>'
};
function parentOptions(sid,sel){return'<option value="">Top level of the subject</option>'+(function list(p,dep){return children(p,sid).map(function(x){return'<option value="'+x.id+'"'+(x.id===sel?" selected":"")+'>'+"  ".repeat(dep+1)+"Inside "+esc(x.title)+'</option>'+list(x.id,dep+1)}).join("")})(null,0)}
function importFile(file,opts){openImport(opts,file)}
function openImport(opts,firstFile){
  opts=opts||{};
  var kind="xlsx",res=null,file=null,busy=false,sid=opts.sid||(S.view==="subject"&&S.ctx)||(S.view==="deck"&&deckById(S.cur)?deckById(S.cur).subject:null)||(subjects()[0]||{}).id||"__new",par=opts.parent||null,msg="",err="";
  dialog(dh(ic("upload")+' Import questions')+'<div class="db split"><div class="m" id="im-m"></div><div class="s fhelp" id="im-h"></div></div>'+
    df('<button type="button" class="btn" id="imp-c">Cancel</button><button type="button" class="btn pri" id="i-save" disabled>Import</button>','<span class="note" id="im-fn"></span>')+
    '<input type="file" id="file2" accept=".xlsx,.xls,.csv,.xlsm,.ods,.docx,.apkg,.colpkg" hidden>',
  function(close,ov){
    function subjOpts(){return subjects().map(function(s){return'<option value="'+s.id+'"'+(s.id===sid?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'<option value="__new"'+(sid==="__new"?" selected":"")+'>+ New subject…</option>'}
    function draw(){
      var h='<div class="g2"><div class="fld"><label for="i-sub">Subject</label><select id="i-sub" class="inp">'+subjOpts()+'</select></div><div class="fld"><label for="i-par">Put it</label><select id="i-par" class="inp">'+(sid==="__new"?'<option value="">Top level of the subject</option>':parentOptions(sid,par))+'</select></div></div>'+
        '<div class="fld" id="i-newsub"'+(sid==="__new"?'':' hidden')+'><label for="i-ns">New subject name</label><input id="i-ns" class="inp" value="'+esc((res&&res.subjectGuess)||"")+'" placeholder="e.g. Pharmacology"></div>'+
        '<div class="fld"><span class="fl">File type</span><div class="ftypes" role="tablist">'+[["xlsx","Excel",".xlsx · .csv"],["docx","Word",".docx"],["apkg","Anki",".apkg"]].map(function(x){return'<button type="button" role="tab" data-kind="'+x[0]+'" class="'+(kind===x[0]?"on":"")+'" aria-selected="'+(kind===x[0])+'"><b>'+x[1]+'</b><small>'+x[2]+'</small></button>'}).join("")+'</div></div>';
      if(!res){h+='<div class="dropz" id="dz">'+ic("upload")+'<b>'+(busy?"Reading “"+esc(file.name)+"”…":"Drop a file here")+'</b><span class="note">'+(busy?esc(msg||"This can take a few seconds the first time."):"or choose one from your device")+'</span>'+(busy?'':'<button type="button" class="btn" id="pickf">Choose file</button>')+(err?'<div class="err" role="alert">'+err+'</div>':'')+'</div>'}
      else{var lv=levelCounts(res.items),npic=res.items.filter(function(x){return(x.imgs&&x.imgs.length)||/<img/.test(x.q)}).length,sk=(res.skipped||[]).length;
        h+='<div class="ifile"><span class="ft">'+({xlsx:"XLSX",docx:"DOCX",apkg:"APKG"}[res.kind]||"FILE")+'</span><div class="tx"><b>'+esc(file.name)+'</b><small>'+plural(res.items.length,"question")+' · '+sortLevels(Object.keys(lv)).map(function(l){return esc(l)+" "+lv[l]}).join(" · ")+(npic?' · '+npic+' with pictures':'')+'</small></div><button type="button" class="btn" id="pickf">Choose another file</button></div>'+
          '<div class="ifound"><div><b class="tn">'+(res.items.length+sk)+'</b><span class="lbl">Questions found</span></div><div><b class="tn good">'+res.items.length+'</b><span class="lbl">Ready</span></div><div><b class="tn'+(sk?" ambt":"")+'">'+sk+'</b><span class="lbl">Skipped</span></div></div>'+skipList(res.skipped)+
          '<div class="fld"><label for="i-title">Deck name</label><input id="i-title" class="inp" value="'+esc(res.title)+'"></div>'+
          '<div class="fld"><label for="i-src">Source material <small>Shown as the reference</small></label><input id="i-src" class="inp" placeholder="e.g. Pawlina, Histology: A Text and Atlas — Ch. 8" value="'+esc(res.sourceGuess||"")+'"></div><div id="i-dup"></div><div class="err" id="i-err" hidden></div>'}
      $("im-m").innerHTML=h;$("im-h").innerHTML=HELP2[kind];
      $("i-save").disabled=!res;$("i-save").textContent=res?"Import "+plural(res.items.length,"question"):"Import";
      $("im-fn").textContent=res&&(res.skipped||[]).length?plural(res.skipped.length,"row")+" will be skipped":"";
      wire();
    }
    function dupCheck(){if(!res)return null;var s=$("i-sub").value,p=$("i-par").value||null,t=($("i-title").value||"").trim().toLowerCase(),ex=S.decks.filter(function(d){return d.subject===s&&(d.parent||null)===p&&d.title.toLowerCase()===t})[0];
      $("i-dup").innerHTML=ex?'<div class="banner-amb"><span class="tx">A deck named “'+esc(ex.title)+'” is already here.</span><label class="chk"><input type="checkbox" id="i-rep" checked>Replace its questions</label></div>':"";return ex}
    function wire(){
      $("i-sub").onchange=function(){sid=this.value;par=null;var ns=$("i-ns")?$("i-ns").value:"";draw();if($("i-ns")&&ns)$("i-ns").value=ns;dupCheck()};
      $("i-par").onchange=function(){par=this.value||null;dupCheck()};
      if($("i-title"))$("i-title").oninput=dupCheck;dupCheck();
      each("[data-kind]",function(b){b.onclick=function(){kind=b.getAttribute("data-kind");draw()}},ov);
      on("pickf",function(){$("file2").click()});
      var dz=$("dz");if(dz){dz.ondragover=function(e){e.preventDefault();dz.classList.add("over")};dz.ondragleave=function(){dz.classList.remove("over")};dz.ondrop=function(e){e.preventDefault();dz.classList.remove("over");var f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)read(f)}}
    }
    $("file2").onchange=function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(f)read(f)};
    on("imp-c",close);
    function read(f){
      var k=fileKind(f.name);file=f;res=null;err="";
      if(!k){err="That file type isn’t supported. Use Excel (.xlsx, .xls, .csv), Word (.docx) or Anki (.apkg). Old .doc files need to be saved as .docx first.";busy=false;draw();return}
      kind=k;busy=true;msg="";draw();
      loadLibs(k).then(function(){return f.arrayBuffer()}).then(function(buf){return k==="apkg"?parseApkg(buf):k==="xlsx"?parseSheet(buf,f.name):parseDocx(buf,f.name)}).then(function(r){
        if(!r.items.length){var why={apkgfields:"This deck’s cards don’t have the question, choice and correct-answer fields MedDecks reads.",sheetcols:"There’s no heading row with Question, Option A, Option B and Correct columns.",docshape:"No numbered questions were found in this document."}[r.reason]||"No questions with a correct answer were found.";
          busy=false;err=why+(r.skipped&&r.skipped.length?" ("+plural(r.skipped.length,"question")+" skipped.)":"")+" See the format on the right.";draw();return null}
        return finalizeImages(r.items,r.media,function(d,t){msg="Preparing pictures… "+d+" of "+t;var n=$("dz");if(n){var m=n.querySelector(".note");if(m)m.textContent=msg}}).then(function(){return r});
      }).then(function(r){if(!r)return;busy=false;r.kind=k;res=r;
        var g=r.subjectGuess||guessSubjectName(r.title+" "+(r.sourceGuess||""));if(!opts.sid&&g)subjects().forEach(function(x){if(x.name.toLowerCase()===g.toLowerCase())sid=x.id});
        draw();
      }).catch(function(e){busy=false;err=e&&e.message==="lib"?"Couldn’t load the file reader. Check your internet connection and try again.":k==="apkg"?"Couldn’t read that file. Make sure it’s a deck exported from Anki as .apkg.":k==="docx"?"Couldn’t read that file. Make sure it’s a Word .docx file and not password-protected.":"Couldn’t read that file. Make sure it’s an Excel or CSV file and not password-protected.";draw()});
    }
    on("i-save",function(){
      if(!res)return;var b=$("i-save"),title=$("i-title").value.trim()||res.title,src=$("i-src").value.trim(),s=$("i-sub").value,p2=$("i-par").value||null,ex=dupCheck(),rep=ex&&$("i-rep")&&$("i-rep").checked;
      if(s==="__new"){var nn=($("i-ns")&&$("i-ns").value.trim())||"New subject",ns={id:uid("s"),name:nn,color:PALETTE[S.lib.subjects.length%PALETTE.length].k,art:guessArt(nn),order:S.lib.subjects.length};S.lib.subjects.push(ns);saveLib();s=ns.id;p2=null}
      b.disabled=true;b.textContent="Saving…";
      var meta=rep?ex:{id:slug(title)+"-"+Date.now().toString(36),added:Date.now(),order:Date.now()};
      meta.title=title;meta.subject=s;meta.parent=p2;meta.path=res.path||meta.path||"";meta.topic=res.topic||meta.topic||"";meta.desc=res.desc||meta.desc||"";meta.sources=src?[src]:(meta.sources||[]);meta.format=res.kind;
      store.saveItems(meta,res.items).then(function(){
        if(!rep)S.decks.push(meta);S.items[meta.id]=res.items;
        if(rep&&S.progress[meta.id]){delete S.progress[meta.id].session;S.progress[meta.id].qs={};saveProgress(meta.id,true)}
        if(p2)S.open[p2]=true;
        logEvent("add","Imported "+title+" — "+plural(res.items.length,"question"),[(subjById(s)||{}).name,"from "+({xlsx:"Excel",docx:"Word",apkg:"Anki"}[res.kind]||"a file")].filter(Boolean).join(" · "));
        close();toast("Added “"+title+"”.");openDeck(meta.id);
      }).catch(function(e){b.disabled=false;b.textContent="Import "+plural(res.items.length,"question");$("i-err").textContent=(e&&e.code==="quota_exceeded")?"Storage is full.":"Couldn’t save the deck. Check your connection and try again.";$("i-err").hidden=false});
    });
    draw();
    if(firstFile)read(firstFile);
  },"wide");
}
function skipList(sk){
  if(!sk||!sk.length)return"";
  return'<details class="skips"><summary>'+plural(sk.length,"question")+' skipped — see why</summary><ul>'+sk.slice(0,30).map(function(s){return'<li>'+esc(s)+'</li>'}).join("")+(sk.length>30?'<li>…and '+(sk.length-30)+' more</li>':'')+'</ul></details>';
}

  loadAll().then(function(){renderHome();setTimeout(prefetchAll,1200)}).catch(function(e){if(window.console)console.warn(e);app.innerHTML='<main class="page gut"><div class="wrap col-s"><h1 class="h1">Couldn’t load your decks</h1><p class="muted">Check your connection, then reload.</p><div><button type="button" class="btn pri" onclick="location.reload()">Reload</button></div></div></main>'})}
