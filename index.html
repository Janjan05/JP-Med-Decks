<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedDecks</title>
<meta name="description" content="Practice tests for medical school.">
<meta name="theme-color" content="#16264A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedDecks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="md-build" content="3c0b5f1d54">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&amp;family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&amp;display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: square-edged study desk. Solid colour blocks per subject (with drawn plates), hairline-ruled white sheets, navy actions; test = number rail · question sheet · key column. */
:root{
  --bg:#EEF0F3; --card:#FFFFFF; --soft:#F5F6F8; --ink:#14171F; --ink2:#363C48; --muted:#5D6472; --faint:#8C93A0;
  --line:#D8DCE2; --line2:#B8BEC9; --track:#E3E6EB;
  --accent:#1F3F7A; --accent2:#2D58A6; --acc-t:#E7EDF8; --onacc:#FFFFFF;
  --ok:#137240; --okbg:#E7F4EC; --okbd:#8FCBA7; --okfg:#0B5230;
  --bad:#B3261E; --badbg:#FCECEA; --badbd:#EBA49D; --badfg:#8E1C16;
  --red:#C62828; --red2:#A61F1F;
  --flag:#C77A0A; --flagbg:#FFF3DB; --tip:#FFF6DC; --tipbd:#EFD58E; --tipfg:#6E4A00;
  --hero:#16264A; --hero2:#1F3F7A;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 0 rgba(20,23,31,.04);
  --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --card:#161A21; --soft:#1C2129; --ink:#ECEEF2; --ink2:#C8CDD6; --muted:#99A1AE; --faint:#6E7684;
  --line:#2A303A; --line2:#3B4250; --track:#262C36;
  --accent:#8FB0EA; --accent2:#B3CBF3; --acc-t:#18233A; --onacc:#0D1524;
  --ok:#5CC48A; --okbg:#11241A; --okbd:#2B6A45; --okfg:#A6E3BF;
  --bad:#F08A7E; --badbg:#2A1513; --badbd:#6E2C25; --badfg:#F7BDB5;
  --red:#E05247; --red2:#F06A60;
  --flag:#F0A845; --flagbg:#3A2A10; --tip:#2A2210; --tipbd:#56441A; --tipfg:#F0CF85;
  --hero:#0B1730; --hero2:#16305E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --card:#161A21; --soft:#1C2129; --ink:#ECEEF2; --ink2:#C8CDD6; --muted:#99A1AE; --faint:#6E7684;
  --line:#2A303A; --line2:#3B4250; --track:#262C36;
  --accent:#8FB0EA; --accent2:#B3CBF3; --acc-t:#18233A; --onacc:#0D1524;
  --ok:#5CC48A; --okbg:#11241A; --okbd:#2B6A45; --okfg:#A6E3BF;
  --bad:#F08A7E; --badbg:#2A1513; --badbd:#6E2C25; --badfg:#F7BDB5;
  --red:#E05247; --red2:#F06A60;
  --flag:#F0A845; --flagbg:#3A2A10; --tip:#2A2210; --tipbd:#56441A; --tipfg:#F0CF85;
  --hero:#0B1730; --hero2:#16305E; color-scheme:dark}

*{border-radius:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
#app{font-size:calc(15px * var(--z));line-height:1.5;min-height:100%;display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
#app *,#app *::before,#app *::after,.ov,.ov *{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;text-align:inherit;line-height:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[contenteditable]:focus-visible,label:focus-within{outline:2px solid var(--accent2);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.muted{color:var(--muted)}.sm{font-size:.86em}.c{text-align:center}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gut{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.cap{font-size:.72em;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.wrap{width:100%;max-width:88em;margin:0 auto}
.col{display:flex;flex-direction:column;gap:1.6em}.col-s{display:flex;flex-direction:column;gap:.9em}
.sp{flex:1}
.h1{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance;font-size:2.7em}
.h1.md{font-size:2.2em}
.h2{margin:0;font-family:var(--serif);font-size:1.55em;font-weight:700;letter-spacing:-.015em}
.note{font-size:.86em;color:var(--muted);line-height:1.5}
.empty{padding:1.2em 0 .4em;color:var(--muted)}
.err{color:var(--bad);font-size:.9em}
.good{color:var(--ok)}.badt{color:var(--bad)}
mark{background:var(--tip);color:inherit;padding:0 .1em}

/* buttons */
.b{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:2.6em;padding:0 1em;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;font-size:.92em;white-space:nowrap}
.b:hover{border-color:var(--ink)}
.b.p{background:var(--accent);border-color:var(--accent);color:var(--onacc)}.b.p:hover{background:var(--accent2);border-color:var(--accent2)}
.b.red{background:var(--red);border-color:var(--red);color:#fff}.b.red:hover{background:var(--red2);border-color:var(--red2)}
.b.red-o{color:var(--red);border-color:var(--badbd)}.b.red-o:hover{border-color:var(--red)}
.b.inv{background:transparent;border-color:rgba(255,255,255,.55);color:#fff}.b.inv:hover{background:rgba(255,255,255,.12);border-color:#fff}
.b.sm{min-height:2.2em;padding:0 .75em;font-size:.84em}
.b.lg{min-height:3.1em;padding:0 1.4em;font-size:1em}
.b.ic{padding:0;width:2.6em}.b.sm.ic{width:2.2em}
.b[disabled]{opacity:.4;cursor:default}
.b.star-on,.star-on{color:var(--flag)}.b.star-on svg.i{fill:currentColor}
.b.flag-on{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}
.link{color:var(--accent);font-weight:600;font-size:.9em;display:inline-flex;align-items:center;gap:.35em}
.link:hover{text-decoration:underline}
.chip{display:inline-flex;align-items:center;gap:.3em;font-size:.78em;font-weight:600;padding:.25em .65em;background:var(--soft);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.sc{background:var(--sc,var(--accent));border-color:var(--sc,var(--accent));color:#fff}
.chip.amber{background:var(--flagbg);border-color:var(--flag);color:var(--flag)}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.7em 1em;padding-block:.65em;min-height:4em}
.brand{display:inline-flex;align-items:center;gap:.5em;font-family:var(--serif);font-size:1.4em;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.brand .mark{width:1.45em;height:1.45em;background:var(--accent);color:var(--onacc);display:inline-flex;align-items:center;justify-content:center;font-size:.85em;border-bottom:3px solid #8FB0EA}
.srch{flex:0 1 26em;display:flex;align-items:center;gap:.5em;border:1px solid var(--line2);background:var(--soft);padding:0 .8em;min-height:2.6em;color:var(--muted)}
.srch input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink);font-size:.92em;padding:.5em 0}
.srch:focus-within{border-color:var(--accent);background:var(--card)}
.srch.big{flex:none;min-height:3.2em;font-size:1.05em;max-width:46em}
.s-only{display:none}
.avatar{width:2.6em;height:2.6em;border-radius:50%;background:var(--acc-t);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line2);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.page{flex:1;padding-block:1.6em 3em}

/* home hero */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--hero);color:#fff;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:0;top:0;bottom:0;width:38%;background:repeating-linear-gradient(135deg,transparent 0 22px,rgba(255,255,255,.04) 22px 23px);pointer-events:none}
.hero-l{padding:2.2em 2.4em;display:flex;flex-direction:column;gap:.7em;position:relative;z-index:1}
.hero .cap{color:#A9BEE6}
.hero p{margin:0 0 .6em;color:#D3DCEE;font-size:1.05em;max-width:32em}
.hero .acts{display:flex;flex-wrap:wrap;gap:.7em}
.hero .b{border-color:rgba(255,255,255,.4);background:transparent;color:#fff}.hero .b:hover{background:rgba(255,255,255,.1);border-color:#fff}
.hero .b.p{background:#fff;color:#16264A;border-color:#fff}.hero .b.p:hover{background:#E7EDF8}
.hero-r{background:var(--hero2);padding:1.8em 2em;display:flex;align-items:center;gap:1.8em;position:relative;z-index:1;flex-wrap:wrap}
.goalring .ring{width:8.5em;height:8.5em}.goalring .ring .in b{color:#fff;font-size:1.5em}.goalring .ring .in span{color:#A9BEE6}
.goalring circle:first-child{stroke:rgba(255,255,255,.16)!important}
.hstats{flex:1;min-width:12em;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1em 1.4em}
.hs{display:flex;gap:.6em;align-items:flex-start;color:#D3DCEE;font-size:.9em;line-height:1.3}
.hs svg.i{width:1.4em;height:1.4em;color:#8FB0EA;margin-top:.1em}
.hs b{font-family:var(--serif);font-size:1.6em;color:#fff;font-weight:600;display:inline-block;margin-right:.1em}
.hs small{display:block;color:#93A6CC;font-size:.88em}
.hs.fire svg.i{color:#FFB547}

/* sections */
.sec-t{display:flex;align-items:baseline;gap:.4em 1em;flex-wrap:wrap}
.sec-t .s{color:var(--muted);font-size:.92em}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(15em,1fr));gap:1em}
.plan-c{display:flex;flex-direction:column;gap:.4em;padding:1.1em 1.2em 1em;background:var(--card);border:1px solid var(--line);border-top:4px solid var(--sc);text-align:left}
.plan-c:hover{border-color:var(--line2);border-top-color:var(--sc);background:var(--soft)}
.plan-k{display:inline-flex;align-items:center;gap:.4em;font-size:.72em;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sc)}
.plan-c b{font-family:var(--serif);font-size:1.2em;line-height:1.25}
.plan-c .muted{font-size:.88em}
.plan-go{margin-top:auto;padding-top:.5em;display:inline-flex;align-items:center;gap:.4em;font-weight:600;font-size:.88em;color:var(--accent)}

/* subject cards */
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5em,1fr));gap:1em}
.subj{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);text-align:left;overflow:hidden}
.subj:hover{border-color:var(--sc)}
.subj:hover .band{filter:brightness(1.06)}
.band{position:relative;height:6.5em;background:var(--sc);color:#fff;overflow:hidden;border-bottom:4px solid var(--sd)}
.band .art{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.band .cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band.big{height:100%;position:absolute;inset:0;border:0}
.subj-b{display:flex;flex-direction:column;gap:.55em;padding:1em 1.1em 1.1em}
.subj-n{display:flex;align-items:center;gap:.5em;font-family:var(--serif);font-size:1.25em;font-weight:700;line-height:1.2}
.subj-n svg.i{color:var(--sc)}
.subj-m{font-size:.86em;color:var(--muted)}
.meter{display:block;height:.42em;background:var(--track);overflow:hidden;flex:1}
.meter i{display:block;height:100%;background:var(--sc,var(--accent))}
.subj-f{display:flex;justify-content:space-between;gap:.6em;font-size:.84em;color:var(--muted)}
.subj-f b{color:var(--ink);font-weight:600}

/* cards */
.card{background:var(--card);border:1px solid var(--line)}
.card-h{display:flex;align-items:center;flex-wrap:wrap;gap:.6em;padding:1.05em 1.3em .3em}
.card-h .t{font-family:var(--serif);font-size:1.22em;font-weight:700;letter-spacing:-.01em}
.card-b{padding:.8em 1.3em 1.2em}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.2em;align-items:stretch}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.2em}
.grid2f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8em}
.grid3{display:grid;grid-template-columns:7em 7em minmax(0,1fr);gap:.8em}

/* heatmap + week */
.heat{display:flex;gap:4px;overflow-x:auto;padding-bottom:.2em}
.hcol{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
.hd{display:block;width:clamp(.9em,1.75vw,1.45em);height:clamp(.9em,1.75vw,1.45em);background:var(--track)}
.hd.l1{background:#B9CDEB}.hd.l2{background:#7FA2DA}.hd.l3{background:#3F6CB8}.hd.l4{background:#1F3F7A}
:root[data-theme="dark"] .hd.l1{background:#1E3155}:root[data-theme="dark"] .hd.l2{background:#2D4D85}:root[data-theme="dark"] .hd.l3{background:#4A72BC}:root[data-theme="dark"] .hd.l4{background:#8FB0EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd.l1{background:#1E3155}:root:not([data-theme="light"]) .hd.l2{background:#2D4D85}:root:not([data-theme="light"]) .hd.l3{background:#4A72BC}:root:not([data-theme="light"]) .hd.l4{background:#8FB0EA}}
.hd.f{background:transparent;outline:1px dashed var(--line)}
.heat-k{display:flex;align-items:center;gap:4px;margin-top:.7em;font-size:.78em;color:var(--muted)}
.heat-k .hd{width:.85em;height:.85em}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.5em;height:11em;align-items:end}
.wk{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.3em}
.wv{font-size:.78em;color:var(--muted);min-height:1.2em}
.wb{display:block;width:100%;max-width:2.6em;background:var(--accent);min-height:0}
.wb.hit{background:var(--ok)}
.wl{font-size:.78em;color:var(--muted)}.wl.now{color:var(--ink);font-weight:700}
.wgoal{position:absolute;left:0;right:0;border-top:1px dashed var(--line2);pointer-events:none}
.wgoal span{position:absolute;right:0;top:-1.4em;font-size:.72em;color:var(--muted);background:var(--card);padding:0 .3em}
.act{display:flex;align-items:center;gap:.9em;padding:.7em 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0}
.ai{width:2.2em;height:2.2em;display:flex;align-items:center;justify-content:center;flex:none;background:var(--soft);color:var(--ink2)}
.ai.done{background:var(--okbg);color:var(--ok)}.ai.score{background:var(--acc-t);color:var(--accent)}.ai.add{background:var(--flagbg);color:var(--flag)}
.act .tx{flex:1;min-width:0;line-height:1.35}.act .tx span{display:block;font-size:.92em;overflow-wrap:anywhere}.act .tx small{font-size:.8em;color:var(--muted)}
.act .tm{font-size:.8em;color:var(--muted);white-space:nowrap}

/* ring */
.ring{position:relative;width:9em;height:9em;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.ring .in b{font-family:var(--serif);font-size:1.7em;font-weight:700}
.ring .in span{font-size:.82em;color:var(--muted)}

/* crumbs */
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:.45em;font-size:.92em;color:var(--muted)}
.crumbs button{display:inline-flex;align-items:center;gap:.35em}.crumbs button:hover{color:var(--ink);text-decoration:underline}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs svg.i{width:.95em;height:.95em}
.crumbs.light{color:rgba(255,255,255,.8)}.crumbs.light button:hover{color:#fff}

/* subject page */
.subjhead{position:relative;background:var(--sc);color:#fff;min-height:13em;display:flex;align-items:flex-end;border-bottom:5px solid var(--sd)}
.subjhead .band.big .art{opacity:.55}
.subjhead .band.big::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--sd) 0%,transparent 75%)}
.sh-in{position:relative;z-index:1;width:100%;padding-block:1.4em 1.6em}
.sh-row{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:1em 2em;margin-top:.6em}
.sh-row .h1{font-size:3em}
.sh-m{color:rgba(255,255,255,.88);margin-top:.35em}
.sh-row .acts{display:flex;flex-wrap:wrap;gap:.6em}

/* deck tree */
.tree{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.trow{display:flex;align-items:center;gap:.6em;padding:.55em .4em .55em calc(.4em + var(--dp,0) * 1.9em);border-bottom:1px solid var(--line);background:var(--card)}
.trow:hover{background:var(--soft)}
.trow.dragging{opacity:.45}
.trow.dropin{background:var(--acc-t);box-shadow:inset 0 0 0 2px var(--accent)}
.grip{color:var(--faint);cursor:grab;display:flex}
.tog{width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.tog svg.i{transition:transform .12s}.tog.open svg.i{transform:rotate(90deg)}
.tog-sp{width:1.8em;flex:none}
.tname{flex:1;min-width:0;display:flex;align-items:center;gap:.6em;text-align:left;padding:.2em 0}
.tname>svg.i{color:var(--sc,var(--accent));width:1.3em;height:1.3em}
.tname b{display:block;font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.tname small{display:block;font-size:.8em;color:var(--muted)}
.tname em{font-style:normal;color:var(--flag);font-weight:600}
.tmeter{display:flex;align-items:center;gap:.5em;width:8em;font-size:.8em;color:var(--muted)}
.drop-root{display:none;margin-top:.6em;padding:.9em;border:2px dashed var(--line2);text-align:center;color:var(--muted);font-size:.88em}
.drop-root.show{display:block}.drop-root.dropin{border-color:var(--accent);background:var(--acc-t);color:var(--accent)}
.tree-hint{margin-top:.7em}

/* deck page */
.deckpage{display:flex;flex-wrap:wrap;align-items:stretch;flex:1}
.dmain{flex:999 1 40em;min-width:0;padding-block:1.4em 3em;display:flex;flex-direction:column;gap:1.3em}
.dside{flex:1 1 21em;max-width:100%;min-width:0;background:var(--card);border-left:1px solid var(--line);padding-block:1.8em 2.4em;display:flex;flex-direction:column;gap:1.15em}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1em 1.3em;align-items:start}
.dh-ico{width:4.2em;height:4.2em;background:var(--sc);color:#fff;display:flex;align-items:center;justify-content:center;border-bottom:4px solid var(--sd)}
.dh-ico svg.i{width:2.1em;height:2.1em;stroke-width:1.5}
.dhead .h1{font-size:2.6em}
.desc{color:var(--ink2);margin-top:.4em;max-width:40em}
.chips{display:flex;flex-wrap:wrap;gap:.4em;margin-top:.8em}

/* test bar */

.cell{width:2.15em;height:2.15em;flex:0 0 2.15em;border-radius:50%;border:1px solid var(--line2);font-size:.78em;font-weight:600;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--muted)}

.dlg h2{margin:0;font-family:var(--serif);font-size:1.5em;font-weight:700;letter-spacing:-.015em}

.ed-body{display:flex;flex-direction:column;gap:1em;padding:1.1em 0}
.sticky-acts{position:sticky;bottom:calc(-1.6em - env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);padding:.9em 0 1.2em;margin-bottom:-1.6em}
.dlg .rows{background:var(--soft);border:1px solid var(--line);padding:.4em 1em}
.rw{display:flex;justify-content:space-between;gap:1em;padding:.5em 0;border-top:1px solid var(--line);font-size:.94em}.rw:first-child{border-top:0}
.fld{display:flex;flex-direction:column;gap:.35em}
.fld>label,.fld .lab{font-size:.84em;font-weight:600;color:var(--ink2)}
.row-in{display:flex;flex-wrap:wrap;align-items:center;gap:.6em}
.acts{display:flex;flex-wrap:wrap;gap:.6em;align-items:center}
.sheetlist{display:flex;flex-direction:column;border:1px solid var(--line)}
.sheetbtn{display:flex;align-items:center;gap:.9em;padding:.85em 1em;border-top:1px solid var(--line);text-align:left}
.sheetbtn:first-child{border-top:0}.sheetbtn:hover{background:var(--soft)}

  get:function(path){

  },
  set:function(path,v){

    lsSet(LP+path,c);return Promise.resolve();
  },
  del:function(path){if(DB)return DB.doc(path).delete();lsDel(LP+path);return Promise.resolve()},
  list:function(col){
    if(DB)return DB.collection(col).get().then(function(s){return s.docs.map(function(d){var o=clone(d.data());o.__id=d.id;return o})});
    var out=[],pre=LP+col+"/";
    try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(pre)===0&&k.slice(pre.length).indexOf("/")<0){var o=lsGet(k);if(o){o.__id=k.slice(pre.length);out.push(o)}}}}catch(e){}
    return Promise.resolve(out);
  },
  loadItems:function(meta){
    var ps=[];for(var i=0;i<(meta.chunks||0);i++)ps.push(store.get("decks/"+meta.id+"/chunks/"+i));
    return Promise.all(ps).then(function(cs){var out=[];cs.forEach(function(c){if(c&&c.items)out=out.concat(c.items)});return out});
  },

    var chunks=[],cur=[],size=0,old=meta.chunks||0;
    items.forEach(function(it){var n=JSON.stringify(it).length;if(cur.length&&size+n>300000){chunks.push(cur);cur=[];size=0}cur.push(it);size+=n});
    if(cur.length)chunks.push(cur);

    var ps=chunks.map(function(c,i){return store.set("decks/"+meta.id+"/chunks/"+i,{items:c})});
    for(var j=chunks.length;j<old;j++)ps.push(store.del("decks/"+meta.id+"/chunks/"+j));

function ensureItems(ids){
  var need=ids.filter(function(id){return!S.items[id]&&deckById(id)});
  return Promise.all(need.map(function(id){return store.loadItems(deckById(id)).then(function(it){S.items[id]=it})}));
}
function itemOf(ref){var p=ref.split(":"),a=S.items[p[0]];return a?a[+p[1]]:null}
function loadAll(){
  return Promise.all([store.get("meta/library"),store.list("decks"),store.list("progress"),store.get("stats/activity"),store.list("covers")]).then(function(r){
    var lib=r[0],decks=r[1],progs=r[2],act=r[3],covers=r[4],changed=[];
    S.decks=decks.map(function(d){if(!d.id)d.id=d.__id;delete d.__id;return d}).filter(function(d){return d.id});
    S.progress={};progs.forEach(function(p){var id=p.__id;delete p.__id;S.progress[id]=p});
    S.act=act||{};S.act.days=S.act.days||{};S.act.events=S.act.events||[];
    S.covers={};covers.forEach(function(c){S.covers[c.__id]=c.img});
    /* subjects */
    if(!lib||!lib.subjects){lib={v:2,subjects:PRESETS.map(function(p,i){return{id:uid("s"),name:p.name,color:p.color,art:p.art,order:i}})};changed.push("lib")}
    S.lib=lib;
    S.decks.forEach(function(d){
      if(d.subject&&subjById(d.subject))return;
      var name=d.subject||guessSubjectName(d.path||d.title)||"General",s=null;
      S.lib.subjects.forEach(function(x){if(x.name.toLowerCase()===String(name).toLowerCase())s=x});
      if(!s){s={id:uid("s"),name:name,color:PALETTE[S.lib.subjects.length%PALETTE.length].k,art:guessArt(name),order:S.lib.subjects.length};S.lib.subjects.push(s);changed.push("lib")}
      d.subject=s.id;if(d.parent===undefined)d.parent=null;changed.push(d);
    });
    /* progress from the first version: numeric session lists and "seen" maps */
    Object.keys(S.progress).forEach(function(id){var p=S.progress[id],dirty=false;
      if(p.seen){p.qs=p.qs||{};Object.keys(p.seen).forEach(function(k){p.qs[k]=p.qs[k]||{a:1}});delete p.seen;dirty=true}
      var s=p.session;if(s&&s.list&&s.list.length&&typeof s.list[0]==="number"){
        var map=function(o){var n={};Object.keys(o||{}).forEach(function(k){n[id+":"+k]=o[k]});return n};
        s.list=s.list.map(function(i){return id+":"+i});s.answers=map(s.answers);s.orders=map(s.orders);s.flags=map(s.flags);s.itemTime=map(s.itemTime);s.ids=[id];dirty=true}
      if(dirty)changed.push("p:"+id)});
    var ps=[];
    if(changed.indexOf("lib")>-1)ps.push(saveLib());
    changed.forEach(function(c){if(typeof c==="object")ps.push(saveMeta(c));else if(c.indexOf("p:")===0)ps.push(store.set("progress/"+c.slice(2),S.progress[c.slice(2)]))});
    return Promise.all(ps);
  });
}
function guessSubjectName(s){var low=String(s||"").toLowerCase();for(var i=0;i<KNOWN.length;i++)if(low.indexOf(KNOWN[i].toLowerCase())>-1)return KNOWN[i];
  var m={histo:"Histology",anat:"Anatomy",physio:"Physiology",bioch:"Biochemistry",prevent:"Preventive Medicine",pharma:"Pharmacology",patho:"Pathology",micro:"Microbiology"};for(var k in m)if(low.indexOf(k)>-1)return m[k];return""}
function prefetchAll(){var ids=S.decks.map(function(d){return d.id}),i=0;(function next(){if(i>=ids.length)return;var id=ids[i++];ensureItems([id]).then(function(){setTimeout(next,150)},function(){setTimeout(next,1500)})})()}

function dialog(inner,wire,cls){
  var ov=document.createElement("div");ov.className="ov";ov.id="ov";
  ov.innerHTML='<div class="dlg'+(cls?" "+cls:"")+'" role="dialog" aria-modal="true" aria-labelledby="dt">'+inner+'</div>';
  document.body.appendChild(ov);
  var close=function(){ov.remove()};
  ov.addEventListener("mousedown",function(e){if(e.target===ov)close()});
  ov.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
  wire&&wire(close,ov);
  var f=ov.querySelector("[autofocus]")||ov.querySelector("input,textarea,[contenteditable],button");if(f)f.focus();
  return close;
}

/* ================= timer ================= */
var tick=null,lastT=0,since=0;
function startTimer(){if(tick)return;lastT=Date.now();tick=setInterval(step,1000)}
function stopTimer(){if(tick){clearInterval(tick);tick=null}}
function step(){
  if(S.view!=="test"||!sess())return;
  var s=sess(),now=Date.now(),d=Math.min(now-lastT,2000)/1000;lastT=now;
  if(!s.submitted&&!s.paused&&!document.hidden){s.acc=(s.acc||0)+d;var r=curRef();if(!(s.settings.mode==="review"&&s.answers[r]))s.itemTime[r]=(s.itemTime[r]||0)+d;today().s+=d;
    if(++since>=10){since=0;saveProgress(S.sk);saveAct()}}
  paintTime();
  if(!s.submitted&&s.settings.timer==="limit"&&s.settings.limit*60-s.acc<=0){var o=$("ov");if(o)o.remove();toast("Time is up. Your test was submitted.");finish()}
}
function paintTime(){var s=sess();if(!s)return;var tv=$("tv");if(!tv)return;
  if(s.settings.timer==="limit"&&!s.submitted){var left=s.settings.limit*60-s.acc;tv.textContent=fmt(left);$("tbox").className="k"+(left<300?" warn":"")}else tv.textContent=fmt(s.acc)}
function sizeRail(){var t=app.querySelector(".tbar"),f=app.querySelector(".tfoot"),r=document.documentElement.style;if(!t)return;r.setProperty("--tbh",t.offsetHeight+"px");r.setProperty("--tfh",(f?f.offsetHeight:0)+"px")}
window.addEventListener("resize",function(){if(S.view==="test")sizeRail()});
document.addEventListener("visibilitychange",function(){lastT=Date.now();if(document.hidden&&S.view==="test"){saveProgress(S.sk,true);saveAct(true)}});
document.addEventListener("keydown",function(e){
  if(S.view!=="test"||$("ov")||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target&&e.target.tagName;if(tg==="INPUT"||tg==="TEXTAREA"||(e.target&&e.target.isContentEditable))return;
  var k=String(e.key).toLowerCase(),i={a:0,b:1,c:2,d:3,e:4,f:5,"1":0,"2":1,"3":2,"4":3,"5":4,"6":5}[k];
  if(i!==undefined){var o=orderOf(curRef())[i];if(o){e.preventDefault();pick(o)}return}
  if(k==="arrowright"||k==="n"){e.preventDefault();go(sess().pos+1)}

function shrinkImage(src,maxW,maxBytes){
  return new Promise(function(res,rej){
    var url=typeof src==="string"?src:URL.createObjectURL(src),img=new Image();
    img.onload=function(){
      var w=img.naturalWidth,h=img.naturalHeight,sc=Math.min(1,maxW/Math.max(w,h));
      var c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*sc));c.height=Math.max(1,Math.round(h*sc));
      var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      var q=.82,out=c.toDataURL("image/jpeg",q);
      while(out.length*.75>maxBytes&&q>.35){q-=.1;out=c.toDataURL("image/jpeg",q)}
      if(out.length*.75>maxBytes){c.width=Math.round(c.width*.7);c.height=Math.round(c.height*.7);g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);out=c.toDataURL("image/jpeg",.6)}
      if(typeof src!=="string")URL.revokeObjectURL(url);res(out)};
    img.onerror=function(){if(typeof src!=="string")URL.revokeObjectURL(url);rej(new Error("img"))};
    img.src=url;
  });
}

    '<p>CSV files with the same headings also work.</p>',
  docx:'<p>Type each question as a block like this. Bold, italics and Word’s automatic numbering are fine. A picture placed under a question comes in with that question.</p>'+

};

/* Anki media: legacy JSON map or the newer compressed list */
function apkgMedia(zip){
  var mf=zip.file("media");if(!mf)return Promise.resolve({});
  return mf.async("uint8array").then(function(b){
    var names={};
    try{var j=JSON.parse(new TextDecoder().decode(b));Object.keys(j).forEach(function(k){names[j[k]]=k});return{names:names,zip:zip}}catch(e){}
    try{
      if(b[0]===0x28&&b[1]===0xb5&&b[2]===0x2f&&b[3]===0xfd)b=fzstd.decompress(b);
      var i=0,idx=0;
      var vint=function(buf,pos){var v=0,s=0,x;do{x=buf[pos.i++];v+=(x&0x7f)*Math.pow(2,s);s+=7}while(x&0x80);return v};
      var P={i:0};
      while(P.i<b.length){var key=vint(b,P),f=key>>>3,w=key&7;
        if(w===2){var len=vint(b,P),end=P.i+len;
          if(f===1){var Q={i:P.i},name="";
            while(Q.i<end){var k2=vint(b,Q),f2=k2>>>3,w2=k2&7;
              if(w2===2){var l2=vint(b,Q);if(f2===1)name=new TextDecoder().decode(b.subarray(Q.i,Q.i+l2));Q.i+=l2}
              else if(w2===0)vint(b,Q);else if(w2===5)Q.i+=4;else if(w2===1)Q.i+=8;else break}
            if(name)names[name]=String(idx);idx++}
          P.i=end}
        else if(w===0)vint(b,P);else if(w===5)P.i+=4;else if(w===1)P.i+=8;else break}
    }catch(e){}
    return{names:names,zip:zip};
  });
}
function mediaBlob(media,name){
  if(!media||!media.names||media.names[name]===undefined)return Promise.resolve(null);
  var f=media.zip.file(media.names[name]);if(!f)return Promise.resolve(null);
  return f.async("uint8array").then(function(b){if(b[0]===0x28&&b[1]===0xb5&&b[2]===0x2f&&b[3]===0xfd)b=fzstd.decompress(b);
    var ext=String(name).split(".").pop().toLowerCase(),type={png:"image/png",gif:"image/gif",webp:"image/webp",svg:"image/svg+xml",jpg:"image/jpeg",jpeg:"image/jpeg"}[ext]||"image/jpeg";
    return new Blob([b],{type:type})});
}
/* shrink pictures and resolve Anki media before saving */
function finalizeImages(items,media,progress){
  var jobs=[];
  function fixHTML(it,key,sub){
    var html=sub?it[key][sub]:it[key];if(!html||html.indexOf("<img")<0)return;
    var doc=new DOMParser().parseFromString("<div>"+html+"</div>","text/html"),root=doc.body.firstChild,imgs=root.querySelectorAll("img");if(!imgs.length)return;
    var ps=Array.prototype.map.call(imgs,function(im){
      var ms=im.getAttribute("data-media"),src=im.getAttribute("src");
      var p=ms?mediaBlob(media,ms).then(function(bl){return bl?shrinkImage(bl,1400,220000):null}):(src&&/^data:image\//.test(src)&&src.length>300000?shrinkImage(src,1400,220000):Promise.resolve(src));
      return p.then(function(u){if(u){im.setAttribute("src",u);im.removeAttribute("data-media")}else{var sp=doc.createElement("span");sp.className="muted";sp.textContent="[Picture not found]";im.replaceWith(sp)}}).catch(function(){im.remove()});
    });
    jobs.push(Promise.all(ps).then(function(){var v=root.innerHTML;if(sub)it[key][sub]=v;else it[key]=v}));
  }
  items.forEach(function(it){
    fixHTML(it,"q");fixHTML(it,"gen");fixHTML(it,"tip");LET.forEach(function(L){if(it.o[L])fixHTML(it,"o",L);if(it.r&&it.r[L])fixHTML(it,"r",L)});
    if(it.imgs)jobs.push(Promise.all(it.imgs.map(function(u){return shrinkImage(u,1400,220000).catch(function(){return null})})).then(function(a){it.imgs=a.filter(Boolean);if(!it.imgs.length)delete it.imgs}));
  });
  var total=jobs.length,done=0;if(progress&&total)progress(0,total);
  return Promise.all(jobs.map(function(j){return j.then(function(){done++;if(progress)progress(done,total)})})).then(function(){return items});
}

function openImport(opts){
  opts=opts||{};
  dialog('<div class="cap">Import</div><h2 id="dt">Add questions from a file</h2>'+
    '<div class="fmts">'+fmtRow("xlsx","bars","Excel","One question per row. .xlsx, .xls or .csv")+fmtRow("docx","file","Word","Numbered questions with A–D choices. .docx")+fmtRow("apkg","layers","Anki","A deck exported from Anki. .apkg")+'</div>'+
    '<div class="fmt-help" id="fmt-help" hidden></div>'+
    '<div class="note">Pictures in Word and Anki files come in with their questions. You can also add pictures to any question later with Edit.</div>'+
    '<div class="acts"><button type="button" class="b p" id="pickf">'+ic("upload")+'Choose file</button><button type="button" class="b" id="imp-c">Cancel</button></div>'+
    '<input type="file" id="file2" accept=".xlsx,.xls,.csv,.docx,.apkg" hidden>',
  function(close,ov){
    on("imp-c",close);on("pickf",function(){$("file2").click()});
    $("file2").onchange=function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(f){close();importFile(f,opts)}};
    each("[data-fmt]",function(b){b.onclick=function(){
      var k=b.getAttribute("data-fmt"),box=$("fmt-help"),open=b.getAttribute("aria-expanded")==="true";
      each("[data-fmt]",function(x){x.setAttribute("aria-expanded","false")},ov);
      if(open){box.hidden=true;return}
      b.setAttribute("aria-expanded","true");box.innerHTML='<div class="cap">'+b.querySelector("b").textContent+' format</div>'+FORMAT_HELP[k];box.hidden=false}},ov);
  });
  function fmtRow(k,icn,t,d){return'<button type="button" class="fmt" data-fmt="'+k+'" aria-expanded="false"><span class="fi">'+ic(icn)+'</span><span class="ft"><b>'+t+'</b><small>'+d+'</small></span><span class="fl2">Format '+ic("chev")+'</span></button>'}
}
function parentOptions(sid,sel){return'<option value="">Top level</option>'+(function list(p,dep){return children(p,sid).map(function(x){return'<option value="'+x.id+'"'+(x.id===sel?" selected":"")+'>'+" ".repeat(dep)+esc(x.title)+'</option>'+list(x.id,dep+1)}).join("")})(null,0)}
function importFile(file,opts){
  opts=opts||{};var kind=fileKind(file.name);
  dialog('<div class="cap">Import</div><h2 id="dt">Reading “'+esc(file.name)+'”…</h2><div class="note" id="imp-msg">This can take a few seconds the first time.</div>',function(close,ov){
    function fail(title,msg){$("dt").textContent=title;$("imp-msg").innerHTML=msg+'<div class="acts" style="margin-top:1em"><button type="button" class="b p" id="imp-h">See file formats</button><button type="button" class="b" id="imp-x">Close</button></div>';on("imp-x",close);on("imp-h",function(){close();openImport(opts)})}
    if(!kind){fail("That file type isn’t supported","Use an Excel file (.xlsx, .xls, .csv), a Word file (.docx) or an Anki deck (.apkg). Older Word files (.doc) need to be saved as .docx first.");return}
    loadLibs(kind).then(function(){return file.arrayBuffer()}).then(function(buf){
      return kind==="apkg"?parseApkg(buf):kind==="xlsx"?parseSheet(buf,file.name):parseDocx(buf,file.name);
    }).then(function(res){
      if(!res.items.length){
        var why={apkgfields:"This deck’s cards don’t have the question, option and correct-answer fields this app reads.",sheetcols:"The app couldn’t find a heading row with Question, Option A, Option B and Correct columns.",docshape:"The app couldn’t find numbered questions in this document."}[res.reason]||"No questions with a correct answer were found.";
        fail("No questions found",why+skipList(res.skipped));return null}
      return finalizeImages(res.items,res.media,function(d,t){var m=$("imp-msg");if(m)m.textContent="Preparing pictures… "+d+" of "+t}).then(function(){return res});
    }).then(function(res){
      if(!res)return;
      var guessName=res.subjectGuess||guessSubjectName(res.title+" "+(res.sourceGuess||"")),sid=opts.sid||null;
      if(!sid&&guessName)subjects().forEach(function(s){if(s.name.toLowerCase()===guessName.toLowerCase())sid=s.id});
      if(!sid&&S.ctx&&subjById(S.ctx))sid=S.ctx;if(!sid&&subjects()[0])sid=subjects()[0].id;
      var lv=levelCounts(res.items),npic=res.items.filter(function(x){return(x.imgs&&x.imgs.length)||/<img/.test(x.q)}).length;
      ov.querySelector(".dlg").innerHTML='<div class="cap">Import</div><h2 id="dt">'+plural(res.items.length,"question")+' found</h2><div class="note">'+sortLevels(Object.keys(lv)).map(function(l){return esc(l)+" "+lv[l]}).join(" · ")+
        (res.items.some(function(x){return x.pg})?' · page numbers included':'')+(npic?' · '+plural(npic,"question")+' with pictures':'')+'</div>'+skipList(res.skipped)+
        '<div class="fld"><label for="i-title">Deck name</label><input id="i-title" class="inp" value="'+esc(res.title)+'"></div>'+
        '<div class="grid2f"><div class="fld"><label for="i-sub">Subject</label><select id="i-sub" class="inp">'+subjects().map(function(s){return'<option value="'+s.id+'"'+(s.id===sid?" selected":"")+'>'+esc(s.name)+'</option>'}).join("")+'<option value="__new">New subject…</option></select></div>'+
        '<div class="fld"><label for="i-par">Put it inside</label><select id="i-par" class="inp">'+parentOptions(sid,opts.parent||null)+'</select></div></div>'+
        '<div class="fld" id="i-newsub" hidden><label for="i-ns">New subject name</label><input id="i-ns" class="inp" value="'+esc(guessName||"")+'"></div>'+
        '<div class="fld"><label for="i-src">Source material</label><input id="i-src" class="inp" placeholder="e.g. Pawlina, Histology: A Text and Atlas — Ch. 8" value="'+esc(res.sourceGuess||"")+'"></div>'+
        '<div id="i-dup"></div><div class="acts"><button type="button" class="b p" id="i-save">'+ic("check")+'Save deck</button><button type="button" class="b" id="i-cancel">Cancel</button></div><div class="err" id="i-err" hidden></div>';
      function dupCheck(){var s=$("i-sub").value,p=$("i-par").value||null,t=$("i-title").value.trim().toLowerCase(),ex=S.decks.filter(function(d){return d.subject===s&&(d.parent||null)===p&&d.title.toLowerCase()===t})[0];
        $("i-dup").innerHTML=ex?'<div class="resume"><span class="tx">A deck named “'+esc(ex.title)+'” is already here.</span><label class="chk"><input type="checkbox" id="i-rep" checked>Replace its questions</label></div>':"";return ex}
      $("i-sub").onchange=function(){$("i-newsub").hidden=this.value!=="__new";$("i-par").innerHTML=this.value==="__new"?'<option value="">Top level</option>':parentOptions(this.value,null);dupCheck()};
      $("i-par").onchange=dupCheck;$("i-title").oninput=dupCheck;dupCheck();
      on("i-cancel",close);
      on("i-save",function(){
        var b=$("i-save"),title=$("i-title").value.trim()||res.title,src=$("i-src").value.trim(),s=$("i-sub").value,par=$("i-par").value||null,ex=dupCheck(),rep=ex&&$("i-rep")&&$("i-rep").checked;
        if(s==="__new"){var nn=$("i-ns").value.trim()||"New subject",ns={id:uid("s"),name:nn,color:PALETTE[S.lib.subjects.length%PALETTE.length].k,art:guessArt(nn),order:S.lib.subjects.length};S.lib.subjects.push(ns);saveLib();s=ns.id}
        b.disabled=true;b.textContent="Saving…";
        var meta=rep?ex:{id:slug(title)+"-"+Date.now().toString(36),added:Date.now(),order:Date.now()};
        meta.title=title;meta.subject=s;meta.parent=par;meta.path=res.path||meta.path||"";meta.topic=res.topic||meta.topic||"";meta.desc=res.desc||meta.desc||"";meta.sources=src?[src]:(meta.sources||[]);meta.format=kind;
        store.saveItems(meta,res.items).then(function(){
          if(!rep)S.decks.push(meta);S.items[meta.id]=res.items;
          if(rep&&S.progress[meta.id]){delete S.progress[meta.id].session;S.progress[meta.id].qs={};saveProgress(meta.id,true)}
          if(par)S.open[par]=true;
          logEvent("add","Added "+plural(res.items.length,"question")+": "+title,(subjById(s)||{}).name);
          close();toast("Added “"+title+"”.");openDeck(meta.id);
        }).catch(function(e){b.disabled=false;b.textContent="Save deck";$("i-err").textContent=(e&&e.code==="quota_exceeded")?"Storage is full.":"Couldn’t save the deck. Check your connection and try again.";$("i-err").hidden=false});
      });
    }).catch(function(e){
      if(e&&e.message==="lib")fail("Couldn’t load the file reader","Check your internet connection and try again.");
      else fail("Couldn’t read that file",kind==="apkg"?"Make sure it’s a deck exported from Anki as .apkg.":kind==="docx"?"Make sure it’s a Word .docx file and not password-protected.":"Make sure it’s an Excel or CSV file and not password-protected.");
    });
  },"wide");
}
function skipList(sk){
  if(!sk||!sk.length)return"";
  return'<details class="skips"><summary>'+plural(sk.length,"question")+' skipped</summary><ul>'+sk.slice(0,30).map(function(s){return'<li>'+esc(s)+'</li>'}).join("")+(sk.length>30?'<li>…and '+(sk.length-30)+' more</li>':'')+'</ul></details>';
}

/* ================= boot ================= */
var booted=false;
function boot(){if(booted)return;booted=true;
  loadAll().then(function(){renderHome();setTimeout(prefetchAll,1200)}).catch(function(e){if(window.console)console.warn(e);app.innerHTML='<main class="page gut"><div class="wrap col"><h1 class="h1 md">Couldn’t load your decks</h1><p class="muted">Check your connection, then reload.</p><button type="button" class="b p" onclick="location.reload()">Reload</button></div></main>'})}
window.MD_START=function(db){if(db){DB=db;mode="cloud"}boot()};
if(window.MD_BOOT)window.MD_BOOT();else boot();
})();
</script>
