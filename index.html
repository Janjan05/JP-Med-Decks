up I = communicable, maternal, neonatal, nutritional · Group II = noncommunicable diseases · Group III = injuries."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 13, "o": {"A": "Stage 1: high mortality with dominant infectious diseases", "B": "Stage 3: increasing relative burden of noncommunicable diseases", "C": "Stage 2: declining mortality from infectious disease", "D": "Stage 4: complex and overlapping disease patterns"}, "q": "A middle-income country has reduced infectious-disease deaths through better sanitation, nutrition, and immunization. Now cardiovascular disease, cancer, diabetes, and an aging population account for a growing share of illness and death. Which stage of the epidemiological transition does this best describe?", "r": {"A": "Stage 1 features infections, malnutrition, and high infant mortality, which is the opposite of this country's situation.", "B": "Correct. Stage 3 is marked by a growing relative burden of NCDs such as cardiovascular disease, cancer, and diabetes, together with population aging. The model is simplified, and countries do not necessarily follow the same stages in a fixed order.", "C": "Stage 2 is the phase in which better sanitation, nutrition, immunization, and healthcare reduce infectious mortality. This country has moved beyond it, since NCDs now make up a growing share of the burden.", "D": "Stage 4 involves chronic diseases, emerging infections, and persistent inequalities occurring together. The scenario describes the rising share of NCDs without that overlapping complexity."}, "tip": "Stage 1: infections and high infant mortality · Stage 2: declining infectious mortality · Stage 3: rising share of NCDs · Stage 4: complex, overlapping patterns."}, {"k": "D", "lvl": "Understanding", "mn": "", "n": 14, "o": {"A": "Stage 1 of the epidemiological transition", "B": "Triple burden of disease", "C": "Health inequality", "D": "Double burden of disease"}, "q": "A community still struggles with tuberculosis, dengue, and childhood malnutrition while diabetes, hypertension, and obesity are rising. What is this situation called?", "r": {"A": "Stage 1 is dominated by infections, malnutrition, and high infant mortality. It does not include a rising NCD burden alongside them.", "B": "A triple burden adds injuries as a major additional source of ill health. The scenario describes only communicable and noncommunicable diseases.", "C": "Health inequality is a measurable difference in health status or outcomes between groups. It does not describe communicable and noncommunicable burdens coexisting in one population.", "D": "Correct. A double burden occurs when a population carries substantial burdens of both communicable diseases (here tuberculosis, dengue, and malnutrition) and noncommunicable diseases (diabetes, hypertension, and obesity) at the same time."}, "tip": "Double burden = communicable + noncommunicable. Triple burden = those two plus injuries."}, {"k": "A", "lvl": "Remembering", "mn": "", "n": 15, "o": {"A": "Health inequity", "B": "Health inequality", "C": "Health disparity", "D": "Health equity"}, "q": "Which term refers to a systematic, avoidable, and unfair difference in health?", "r": {"A": "Correct. A health inequity is a systematic, avoidable, and unfair difference in health.", "B": "A health inequality is a measurable difference in health status or outcomes, without necessarily making a judgment about fairness.", "C": "A health disparity is an observed difference in health outcomes or healthcare access between population groups. The term alone does not state that the difference is unfair.", "D": "Health equity is the goal: everyone has a fair opportunity to reach their highest attainable level of health, with resources distributed according to need."}, "tip": "Disparity = observed difference · Inequality = measurable difference, no fairness judgment · Inequity = systematic, avoidable, and unfair."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 16, "o": {"A": "It raises national averages and makes results easier to report", "B": "It removes the need to strengthen primary healthcare", "C": "It helps identify underserved populations whose needs can be hidden by national averages", "D": "It shows that health differences come from inherent weaknesses of certain populations"}, "q": "Why is collecting disaggregated health data (for example, by region, income group, or sex) recommended as a strategy to reduce health inequities?", "r": {"A": "The purpose is to reveal differences between groups, not to improve how national averages look.", "B": "Data collection complements other strategies, such as strengthening primary healthcare and expanding universal health coverage. It does not replace them.", "C": "Correct. Breaking data down by group reveals which populations are underserved, so services and resources can be directed to them.", "D": "These differences are not inherent weaknesses. They usually reflect unequal living conditions, opportunities, and access to resources."}, "tip": "Strategies to reduce inequities include strengthening primary healthcare, expanding UHC, improving safe water and sanitation, culturally appropriate care, and collecting disaggregated data."}, {"k": "B", "lvl": "Remembering", "mn": "", "n": 17, "o": {"A": "New York, United States; 7 April", "B": "Geneva, Switzerland; 7 April", "C": "Geneva, Switzerland; 1 December", "D": "Washington, D.C., United States; 22 April"}, "q": "Where is the World Health Organization headquartered, and on what date is World Health Day observed each year?", "r": {"A": "The date is right, but WHO's headquarters is in Geneva. New York is the seat of the United Nations, of which WHO is a specialized agency.", "B": "Correct. WHO was established on 7 April 1948 as a specialized agency of the United Nations. It is headquartered in Geneva, and World Health Day is observed every 7 April.", "C": "Geneva is right, but World Health Day is observed on 7 April. 1 December is World AIDS Day.", "D": "Neither detail is right. WHO is headquartered in Geneva, and 22 April is Earth Day, not World Health Day."}, "tip": "WHO: established 7 April 1948 · specialized UN agency · Geneva · World Health Day on 7 April."}, {"k": "D", "lvl": "Understanding", "mn": "", "n": 18, "o": {"A": "It directly manages and finances the national health systems of all its member countries", "B": "It is a nongovernmental organization that operates independently of the United Nations", "C": "Its only function is to provide emergency medical humanitarian assistance during conflicts and disasters", "D": "It provides leadership and technical coordination but does not directly control national health systems"}, "q": "Which statement about the role of the World Health Organization is accurate?", "r": {"A": "WHO does not directly control national health systems. Financing health systems and development programs is a main role of the World Bank.", "B": "WHO is a specialized agency of the United Nations.", "C": "Emergency humanitarian medical assistance is the main role of Médecins Sans Frontières. WHO has broad functions, including standards, surveillance, technical assistance, research support, and promotion of universal health coverage.", "D": "Correct. WHO sets standards and guidelines, monitors global health trends, coordinates emergency responses, and provides technical assistance. National health systems remain under national control."}, "tip": "WHO = leadership, technical guidelines, surveillance, and emergency coordination."}, {"k": "C", "lvl": "Remembering", "mn": "", "n": 19, "o": {"A": "UNAIDS", "B": "Gavi, the Vaccine Alliance", "C": "The Global Fund", "D": "UNFPA"}, "q": "Which organization mainly finances programs against HIV/AIDS, tuberculosis, and malaria?", "r": {"A": "UNAIDS coordinates the global response to HIV/AIDS. It is not mainly a financing body, and it does not cover tuberculosis and malaria.", "B": "Gavi works to improve equitable access to vaccines.", "C": "Correct. The Global Fund finances programs against HIV/AIDS, tuberculosis, and malaria.", "D": "UNFPA focuses on sexual and reproductive health, maternal health, and family planning."}, "tip": "UNICEF = child survival · UNFPA = reproductive and maternal health · World Bank = financing health systems · UNAIDS = HIV/AIDS coordination · Gavi = vaccines · Global Fund = HIV/TB/malaria financing · MSF = emergency humanitarian care · CDC = surveillance and outbreak investigation."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 20, "o": {"A": "Re-emerging infectious disease", "B": "Emerging infectious disease", "C": "Endemic disease", "D": "Sporadic disease"}, "q": "Measles outbreaks are occurring again in an under-vaccinated population after years of control. How should this be classified?", "r": {"A": "Correct. A re-emerging infectious disease is a previously recognized infection that increases again after a period of decline or control. Measles outbreaks in under-vaccinated populations, resurgent tuberculosis, and cholera outbreaks are examples.", "B": "Emerging infections have newly appeared in a population or are rapidly increasing in incidence or geographical distribution, such as COVID-19 or Nipah virus disease in newly affected populations. Measles is a previously recognized infection returning after control, so re-emerging fits better.", "C": "Endemic means a disease is regularly present in a geographical area, like malaria in some tropical regions. It does not describe a return after control.", "D": "Sporadic disease occurs irregularly or infrequently as isolated cases. It does not describe a resurgence of outbreaks."}, "tip": "Emerging = newly appearing or increasing. Re-emerging = returning after decline. Causes include low vaccination coverage, travel and trade, climate change, antimicrobial resistance, and weak surveillance."}, {"k": "D", "lvl": "Remembering", "mn": "", "n": 21, "o": {"A": "Endemic", "B": "Epidemic", "C": "Pandemic", "D": "Outbreak"}, "q": "Which term describes a localized increase in cases, often over a short period, such as a foodborne illness at a school?", "r": {"A": "Endemic describes a disease that is regularly present in a geographical area, such as malaria in some tropical regions.", "B": "An epidemic is when cases exceed the normally expected occurrence in a population, such as a major regional dengue epidemic. It is a broader excess than a localized, short-lived cluster.", "C": "A pandemic is an epidemic spreading across multiple countries or continents and affecting many people, such as COVID-19.", "D": "Correct. An outbreak is a localized increase in cases, often over a short period."}, "tip": "Endemic = regularly present · Epidemic = above expected · Pandemic = multi-country spread · Outbreak = localized, short period · Sporadic = irregular, infrequent."}, {"k": "B", "lvl": "Remembering", "mn": "A Rare Pest Makes People Sick = Agent, Reservoir, Portal of exit, Mode of transmission, Portal of entry, Susceptible host.", "n": 22, "o": {"A": "Infectious agent → portal of exit → reservoir → mode of transmission → portal of entry → susceptible host", "B": "Infectious agent → reservoir → portal of exit → mode of transmission → portal of entry → susceptible host", "C": "Reservoir → infectious agent → mode of transmission → portal of exit → susceptible host → portal of entry", "D": "Infectious agent → reservoir → mode of transmission → portal of exit → susceptible host → portal of entry"}, "q": "Which sequence correctly lists the links in the chain of infection?", "r": {"A": "The portal of exit cannot come before the reservoir. The agent lives in a reservoir (humans, animals, water, environment) and then leaves it through a portal of exit.", "B": "Correct. The chain runs from the infectious agent to its reservoir, out through a portal of exit, across a mode of transmission, in through a portal of entry, and into a susceptible host. Prevention works by breaking one or more links.", "C": "Several links are out of order. The chain begins with the infectious agent, the portal of exit comes before the mode of transmission, and the portal of entry comes before the susceptible host.", "D": "The portal of exit must come before the mode of transmission, and the portal of entry must come before the susceptible host."}, "tip": "Links can be broken by vaccination, hand hygiene, sterilization, isolation, vector control, ventilation, and appropriate personal protective equipment."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 23, "o": {"A": "Transmission tends to increase, because each case infects more than one other person on average", "B": "Transmission is approximately stable, because each case infects about one other person", "C": "Transmission tends to decline, because each case infects fewer than one other person", "D": "The basic reproduction number R0 has dropped to 0.8 in a fully susceptible population"}, "q": "After a mass vaccination campaign and the introduction of control measures, a city's effective reproduction number (Rt) falls to 0.8. What does this indicate?", "r": {"A": "That describes an Rt above 1, not 0.8.", "B": "Stable transmission corresponds to an Rt equal to 1.", "C": "Correct. When Rt is below 1, transmission tends to decline. Rt is an average at a particular time that accounts for existing immunity and control measures.", "D": "R0 applies to a completely susceptible population under specified conditions. Existing immunity and control measures are accounted for by Rt, the effective reproduction number."}, "tip": "Rt above 1 = transmission increases · Rt equal to 1 = stable · Rt below 1 = declines. These are averages and do not fully describe individual variation."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 24, "o": {"A": "Begin control measures promptly while the investigation continues", "B": "Delay all control measures until the analytical studies are finished", "C": "Skip the case definition because the likely source is already known", "D": "Stop surveillance because a likely source has been identified"}, "q": "During a suspected cholera outbreak, investigators have identified a likely contaminated water source but have not yet completed the studies that test their hypothesis. What is the most appropriate action?", "r": {"A": "Correct. Control measures should begin promptly when indicated. Investigators should not wait for every step of the investigation to be completed.", "B": "Waiting risks further cases. Control measures should be implemented and refined as the investigation proceeds.", "C": "A case definition is needed to identify cases and to describe them by time, place, and person. Knowing a likely source does not replace it.", "D": "Communicating findings and continuing surveillance is the final step of the investigation, so surveillance does not stop."}, "tip": "Investigation steps: prepare and verify diagnosis → establish that an outbreak exists → case definition and find cases → describe by time, place, person → hypotheses → test hypotheses → control measures → communicate and continue surveillance."}, {"k": "D", "lvl": "Remembering", "mn": "", "n": 25, "o": {"A": "A global funding mechanism that pays for national vaccination programs in poorer countries", "B": "A binding treaty that lets WHO override national authorities and close borders to travelers during any outbreak it declares", "C": "A clinical practice guideline for treating infections that are resistant to antimicrobials", "D": "An international legal framework for detecting, assessing, reporting, and responding to cross-border public health risks"}, "q": "Which statement best describes the International Health Regulations (2005)?", "r": {"A": "Improving access to vaccines is associated with Gavi. The IHR are a legal framework, not a funding mechanism.", "B": "WHO provides leadership and technical coordination but does not directly control national health systems. One IHR objective is to avoid unnecessary interference with international travel and trade.", "C": "The IHR concern detecting and responding to public health risks that cross borders, not clinical treatment of resistant infections.", "D": "Correct. The IHR (2005) aim to strengthen surveillance and response capacities, promote timely notification of significant events, coordinate international responses, and protect human rights while avoiding unnecessary interference with international travel and trade."}, "tip": "The 2024 IHR amendments entered into force for most States Parties on 19 September 2025 and introduced a new pandemic emergency alert category."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 26, "o": {"A": "A cluster of food poisoning cases among students, confined to a single school cafeteria over two days, managed by the school clinic", "B": "An extraordinary event with international spread that poses a risk to other countries and may require a coordinated response", "C": "A few isolated, irregular cases of a disease appearing from time to time in one rural district", "D": "A stable, long-standing presence of malaria in a tropical region, with similar case numbers each year"}, "q": "Which situation best fits a Public Health Emergency of International Concern (PHEIC)?", "r": {"A": "This is a localized outbreak with no international spread, so it is not a PHEIC.", "B": "Correct. This is the definition of a PHEIC. Events that have been declared PHEICs include COVID-19, Ebola outbreaks, and mpox.", "C": "This describes sporadic occurrence of a disease, not an extraordinary event spreading across borders.", "D": "This describes endemic disease. It is regularly present rather than an extraordinary event requiring coordinated international response."}, "tip": "PHEIC examples from the notes: COVID-19, Ebola outbreaks, and mpox. The WHO Pandemic Agreement was adopted by the World Health Assembly on 20 May 2025, but adoption alone does not mean it has entered into force."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 27, "o": {"A": "Cultural humility", "B": "Universal health coverage", "C": "One Health", "D": "Health equity"}, "q": "Controlling rabies requires human post-exposure prophylaxis, dog vaccination, animal surveillance, and community education. Which approach does this coordinated strategy best illustrate?", "r": {"A": "Cultural humility is an ongoing process of self-reflection, recognizing one's limitations, addressing power imbalances, and learning from patients and communities in clinical care.", "B": "UHC concerns access to quality health services without financial hardship. It is not about linking human, animal, and environmental health.", "C": "Correct. One Health is an integrated approach recognizing that human, animal, plant, and ecosystem health are closely interconnected. Rabies control combines human prophylaxis with dog vaccination, animal surveillance, and community education.", "D": "Health equity concerns fair opportunity to reach the highest attainable level of health, with resources distributed according to need. It does not describe linking human and animal health."}, "tip": "One Health applications: zoonotic disease surveillance, rabies prevention, avian influenza monitoring, antimicrobial resistance control, food safety, and environmental protection."}, {"k": "A", "lvl": "Remembering", "mn": "", "n": 28, "o": {"A": "Achieving universal health coverage", "B": "Reducing maternal mortality", "C": "Reducing road traffic deaths and injuries", "D": "Strengthening substance-use prevention and treatment"}, "q": "Target 3.8 of Sustainable Development Goal 3 (ensure healthy lives and promote well-being for all at all ages) focuses on which of the following?", "r": {"A": "Correct. Target 3.8 is about achieving universal health coverage.", "B": "This is Target 3.1.", "C": "This is Target 3.6.", "D": "This is Target 3.5."}, "tip": "The UN adopted 17 SDGs in 2015 with a target year of 2030. SDG 3 targets: 3.1 maternal mortality · 3.2 newborn and under-five deaths · 3.3 AIDS, TB, malaria, NTDs · 3.4 NCDs and mental health · 3.5 substance use · 3.6 road traffic · 3.7 sexual and reproductive health · 3.8 UHC · 3.9 hazardous chemicals and pollution."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 29, "o": {"A": "They are the same thing, since UHC means that every health service is delivered without any charge", "B": "UHC is financially protected access to needed, quality services; free healthcare means no direct charge for specified services", "C": "UHC covers only the treatment of disease, while free healthcare also covers prevention, promotion, and rehabilitation at no cost", "D": "UHC is limited to hospital-based care, while free healthcare includes primary healthcare services"}, "q": "Which statement correctly distinguishes universal health coverage (UHC) from “free healthcare”?", "r": {"A": "They are not identical. Free healthcare means no direct charge for specified services, whereas UHC concerns financially protected access to the services people need.", "B": "Correct. UHC is defined by financially protected access to needed, quality services across health promotion, prevention, treatment, rehabilitation, and palliative care. Its three dimensions are population coverage, service coverage, and financial protection.", "C": "UHC covers the full spectrum: health promotion, prevention, treatment, rehabilitation, and palliative care.", "D": "UHC is not limited to hospitals. It spans promotion, prevention, treatment, rehabilitation, and palliative care."}, "tip": "Primary healthcare is broader than primary care: PHC is a whole-of-society approach, while primary care mainly means first-contact, continuous, comprehensive clinical care."}, {"k": "D", "lvl": "Remembering", "mn": "", "n": 30, "o": {"A": "Autonomy", "B": "Beneficence", "C": "Nonmaleficence", "D": "Justice"}, "q": "Which of the four fundamental medical ethics principles refers to the fair distribution of benefits and burdens?", "r": {"A": "Autonomy means respecting individuals' informed decisions, for example obtaining informed consent for vaccination.", "B": "Beneficence means acting in the patient's best interests, for example providing effective treatment.", "C": "Nonmaleficence means avoiding unnecessary harm, for example evaluating the risks of an intervention.", "D": "Correct. Justice means fair distribution of benefits and burdens, for example equitable access to scarce medicines."}, "tip": "Autonomy · Beneficence · Nonmaleficence · Justice."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 31, "o": {"A": "Prioritizing people at greatest risk of severe disease, with transparent and consistent criteria", "B": "Distributing available doses solely according to each person's ability to pay for them", "C": "Giving doses first to the most politically influential groups, regardless of their level of risk", "D": "Withholding all doses until there is enough for the entire population, so that nobody is treated unequally"}, "q": "During a shortage of a vaccine, which approach to allocation is most ethically justified?", "r": {"A": "Correct. Common considerations for allocating scarce resources include clinical need, expected benefit, fairness, non-discrimination, transparency, consistency, and public accountability. Prioritizing people at greatest risk of severe disease may be ethically justified.", "B": "Allocation by ability to pay ignores clinical need and fairness and conflicts with non-discrimination.", "C": "Allocation should be fair, non-discriminatory, transparent, and publicly accountable. Influence is not an acceptable criterion.", "D": "This ignores clinical need and expected benefit. Doses given now to people at greatest risk can prevent severe disease."}, "tip": "Allocation criteria: clinical need, expected benefit, fairness, non-discrimination, transparency, consistency, public accountability."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 32, "o": {"A": "Dismiss the remedies as unscientific and insist that the patient use prescription medicines only", "B": "Accept the herbal remedies as the sole treatment without asking about their contents or safety", "C": "Ask which remedies are used, check for toxicity and drug interactions, and plan safe treatment together", "D": "Assume the patient's preferences from their ethnicity and choose the treatment on their behalf without discussion"}, "q": "A patient says they prefer traditional herbal remedies. Which response best reflects cultural humility?", "r": {"A": "Dismissal ignores the patient's beliefs and the power imbalance. Cultural humility involves learning from patients and respecting culturally significant practices where clinically safe.", "B": "Respect does not mean skipping safety checks. Possible toxicity and drug interactions still need to be evaluated.", "C": "Correct. Rather than dismissing the patient, the physician asks about the remedies, checks for toxicity and interactions, and builds a safe plan collaboratively through shared decision-making.", "D": "Assumptions based on ethnicity, religion, or nationality should be avoided, and treatment decisions should be shared with the patient."}, "tip": "Cultural competence = effective care that responds to patients' beliefs, practices, languages, and backgrounds. Cultural humility = ongoing self-reflection and learning from patients and communities."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 33, "o": {"A": "Health educator", "B": "Public health partner", "C": "Researcher", "D": "Advocate"}, "q": "A physician reports a notifiable disease to the health authorities and takes part in outbreak control activities. Which physician role does this best illustrate?", "r": {"A": "A health educator explains vaccination, nutrition, sanitation, and disease prevention to patients and communities.", "B": "Correct. As a public health partner, a physician reports notifiable diseases and participates in outbreak control.", "C": "A researcher investigates disease patterns and health inequalities.", "D": "An advocate promotes access to essential healthcare and supports policies, services, and actions that improve health and reduce inequities."}, "tip": "Physician roles: clinician, health educator, advocate, researcher, public health partner, ethical professional, community collaborator, environmental advocate."}, {"k": "D", "lvl": "Remembering", "mn": "", "n": 34, "o": {"A": "Sufficient diagnostic capacity to guide the choice of antibiotics", "B": "Strong infection prevention programs in healthcare facilities", "C": "High vaccination coverage against infections in the community", "D": "Inappropriate use of antimicrobials, including their use in animals"}, "q": "Which of the following is a major driver of antimicrobial resistance (AMR)?", "r": {"A": "Insufficient diagnostic capacity, not sufficient capacity, is a driver of AMR. Good diagnostics support appropriate prescribing.", "B": "Poor infection prevention is a driver of AMR. Strong prevention limits the spread of resistant organisms.", "C": "Vaccination prevents infections and so reduces the need for antimicrobials. It is not a driver of AMR.", "D": "Correct. Major drivers of AMR include inappropriate antimicrobial use, poor infection prevention, inadequate sanitation, antimicrobial use in animals, and insufficient diagnostic capacity."}, "tip": "AMR consequences: prolonged illness, higher treatment costs, increased mortality, and difficulty performing procedures that depend on effective infection prevention."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 35, "o": {"A": "Surveillance, breeding-site removal, community education, targeted vector control, and early case recognition and management", "B": "Mass antibiotic prophylaxis for all residents, followed by a review of hospital bed capacity", "C": "Treating severe cases in hospital only, while leaving the water containers and breeding sites untouched", "D": "Confining every household indoors until the rains stop, with no vector control or breeding-site removal, since dengue spreads from person to person"}, "q": "A densely populated community has rising dengue cases after heavy rainfall, and many homes have uncovered water containers. Which set of interventions is most appropriate?", "r": {"A": "Correct. This combination addresses both the mosquito source of transmission and the people who are already ill: surveillance, removal of breeding sites, community education, targeted vector control, early clinical recognition, and case management.", "B": "Dengue is a viral disease spread by mosquitoes, so antibiotics do not prevent it, and unnecessary antimicrobial use contributes to antimicrobial resistance.", "C": "Case management alone does not remove the mosquito breeding sites that sustain the outbreak.", "D": "Dengue spreads through mosquito vectors rather than ordinary person-to-person contact, so confinement without vector control does not break the chain of transmission."}, "tip": "Model answer from the notes: contributing factors are breeding sites, environmental and housing conditions, and limits in vector control."}]}], "progress": {"preventive-medicine-global-health-35-mcq-mvm74pgn": {"history": [{"correct": 1, "date": 1792834928250, "mode": "review", "secs": 99.01000000000002, "total": 35}, {"correct": 0, "date": 1792834157429, "mode": "review", "secs": 119.00200000000004, "total": 35}], "session": {"acc": 99.01000000000002, "answers": {"26": "C"}, "endedAt": 1792835027744, "flags": {}, "itemTime": {"26": 34.006}, "list": [26, 8, 4, 28, 10, 25, 16, 1, 27, 21, 31, 15, 22, 6, 2, 34, 13, 0, 33, 20, 18, 3, 30, 19, 32, 23, 9, 17, 7, 29, 14, 5, 24, 12, 11], "orders": {"26": ["D", "C", "A", "B"]}, "phase": "results", "pos": 0, "settings": {"levels": ["Remembering", "Understanding"], "limit": 53, "mode": "review", "shufC": true, "shufQ": true, "timer": "none"}, "started": 1792834928250, "submitted": true}}}};

var SUBJ_ICONS=[["histo","micro"],["cyto","micro"],["anat","bone"],["osteo","bone"],["physio","heart"],["cardio","heart"],["bioch","atom"],["chem","atom"],["prevent","steth"],["community","steth"],["family","steth"],["pharma","pill"],["patho","scope"],["micro","germ"],["parasit","germ"],["immun","shield"],["neuro","brain"],["psych","brain"],["embry","baby"],["pedia","baby"],["genet","dna"],["molec","dna"]];

function guessSubject(path){
  var segs=String(path||"").split(/\s*(?:·|::)\s*/).filter(Boolean),low=segs.join(" ").toLowerCase();
  for(var i=0;i<KNOWN.length;i++)if(low.indexOf(KNOWN[i].toLowerCase())>-1)return KNOWN[i];
  for(var j=segs.length-1;j>=0;j--){var s=segs[j].replace(/\(.*?\)/g,"").replace(/_/g," ").replace(/\b(written|practical|lecture|lab)\b/ig,"").trim();if(s&&!/year|bi-?monthly|semester|exam|^\d/i.test(s))return s.toLowerCase().replace(/\b\w/g,function(c){return c.toUpperCase()})}
  return"General";
}

function dur(sec){sec=Math.round(sec||0);var h=Math.floor(sec/3600),m=Math.round(sec%3600/60);if(m===60){h++;m=0}return h?h+"h "+m+"m":(m||(sec?1:0))+"m"}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function sortLevels(n){return n.slice().sort(function(a,b){var x=LEVEL_ORDER.indexOf(a),y=LEVEL_ORDER.indexOf(b);return((x<0?99:x)-(y<0?99:y))||(a<b?-1:1)})}

var store={
  listDecks:function(){
    if(DB)return DB.collection("decks").get().then(function(s){return s.docs.map(function(d){return JSON.parse(JSON.stringify(d.data()))})});
    return Promise.resolve((lsGet("qb:decks")||[]).map(function(id){return lsGet("qb:deck:"+id)}).filter(Boolean));
  },
  getItems:function(meta){
    if(DB){var ps=[];for(var i=0;i<(meta.chunks||1);i++)ps.push(DB.doc("decks/"+meta.id+"/chunks/"+i).get());
      return Promise.all(ps).then(function(ss){var out=[];ss.forEach(function(s){if(s.exists)out=out.concat(s.data().items||[])});return JSON.parse(JSON.stringify(out))})}
    return Promise.resolve(lsGet("qb:items:"+meta.id)||[]);
  },
  saveMeta:function(meta){var m=JSON.parse(JSON.stringify(meta));if(DB)return DB.doc("decks/"+m.id).set(m);lsSet("qb:deck:"+m.id,m);return Promise.resolve()},
  saveDeck:function(meta,items){
    var chunks=[],cur=[],size=0;
    items.forEach(function(it){var n=JSON.stringify(it).length;if(cur.length&&size+n>180000){chunks.push(cur);cur=[];size=0}cur.push(it);size+=n});
    if(cur.length)chunks.push(cur);
    meta.chunks=chunks.length;
    if(DB)return Promise.all(chunks.map(function(c,i){return DB.doc("decks/"+meta.id+"/chunks/"+i).set({items:c})})).then(function(){return store.saveMeta(meta)});
    var ids=lsGet("qb:decks")||[];if(ids.indexOf(meta.id)<0)ids.push(meta.id);
    lsSet("qb:items:"+meta.id,items);lsSet("qb:decks",ids);return store.saveMeta(meta);
  },
  deleteDeck:function(meta){
    if(DB){var ps=[DB.doc("decks/"+meta.id).delete(),DB.doc("progress/"+meta.id).delete()];for(var i=0;i<(meta.chunks||1);i++)ps.push(DB.doc("decks/"+meta.id+"/chunks/"+i).delete());return Promise.all(ps)}
    lsSet("qb:decks",(lsGet("qb:decks")||[]).filter(function(x){return x!==meta.id}));lsDel("qb:items:"+meta.id);lsDel("qb:deck:"+meta.id);lsDel("qb:prog:"+meta.id);return Promise.resolve();
  },
  getDoc:function(path,lk){
    if(DB)return DB.doc(path).get().then(function(s){return s.exists?JSON.parse(JSON.stringify(s.data())):{}});
    return Promise.resolve(lsGet(lk)||{});
  },
  setDoc:function(path,lk,v){
    lsSet(lk,v);
    if(DB)return DB.doc(path).set(v).catch(function(e){if(e&&e.code==="unavailable")setTimeout(function(){DB.doc(path).set(v).catch(function(){})},800+Math.random()*800)});
    return Promise.resolve();
  }
};

var LIBSETS={

var libsReady={};

  libsReady[kind]=p;p.catch(function(){delete libsReady[kind]});return p;

function norm(s){return String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"")}
var FIELD_MAP={q:["question","stem","questiontext","questionstem","front"],topic:["topictitle","topic","chapter"],k:["correct","correctanswer","answer","key","answerkey","correctoption","correctletter"],
  lvl:["questiontype","level","bloom","bloomslevel","bloomlevel","cognitivelevel","type","difficulty"],tip:["quizexamtip","examtip","studytip","tip","quiztip","nmattip","pearl","highyieldtip"],mn:["mnemonic","mnemonics"],
  n:["itemnumber","item","itemno","number","no","questionnumber","qno"],pg:["page","pagenumber","pageno","sourcepage","pages","bookpage"],
  ex:["passage","paragraph","paragraphstart","paragraphstarter","excerpt","sourceexcerpt","sourcetext","quote","sourcequote","firstwords"],
  gen:["explanation","generalrationale","corerationale","overallrationale","rationale","discussion"]};
function mapFields(names){
  var m={o:{},r:{}},nn=names.map(norm);
  Object.keys(FIELD_MAP).forEach(function(key){for(var i=0;i<FIELD_MAP[key].length;i++){var j=nn.indexOf(FIELD_MAP[key][i]);if(j>-1){m[key]=j;break}}});
  LET.forEach(function(L){var l=L.toLowerCase();
    ["option"+l,"choice"+l,l,"opt"+l,"answer"+l].some(function(c){var j=nn.indexOf(c);if(j>-1){m.o[L]=j;return true}});
    ["rationale"+l,"explanation"+l,"rationaleoption"+l,"rationalefor"+l,"why"+l,"rat"+l].some(function(c){var j=nn.indexOf(c);if(j>-1){m.r[L]=j;return true}})});
  return m;
}
function okMap(m){return m.q!==undefined&&m.k!==undefined&&Object.keys(m.o).length>=2}
function clean(html){
  html=String(html||"");if(!/[<&]/.test(html))return html.trim();
  var doc=new DOMParser().parseFromString("<div>"+html+"</div>","text/html"),root=doc.body.firstChild;
  Array.prototype.forEach.call(root.querySelectorAll("script,style,iframe,object,embed,link,meta,form"),function(n){n.remove()});
  Array.prototype.forEach.call(root.querySelectorAll("img"),function(n){var src=n.getAttribute("src")||"";if(!/^data:image\//.test(src)){var sp=doc.createElement("span");sp.className="muted";sp.textContent="[Image: "+(src||"not included")+"]";n.replaceWith(sp)}});
  Array.prototype.forEach.call(root.querySelectorAll("*"),function(n){Array.prototype.slice.call(n.attributes).forEach(function(a){var nm=a.name.toLowerCase();if(nm.indexOf("on")===0||nm==="style"&&/url\(|expression/i.test(a.value)||(nm==="href"||nm==="src")&&/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)})});
  return root.innerHTML.trim();
}
function plain(html){var d=document.createElement("div");d.innerHTML=String(html||"");return(d.textContent||"").replace(/\s+/g," ").trim()}
function txt(v){return esc(String(v==null?"":v).replace(/\r\n?/g,"\n").trim()).replace(/\n+/g,"<br>")}
function titleCase1(s){s=String(s||"").trim();return s?s.charAt(0).toUpperCase()+s.slice(1).toLowerCase():""}

/* one question from any source; get(field[,letter]) returns the raw value, conv turns it into safe HTML */
function buildItem(get,conv,label,skipped){
  var it={q:conv(get("q")),o:{},r:{},k:""};
  LET.forEach(function(L){var v=conv(get("o",L));if(plain(v)||/<img/i.test(v))it.o[L]=v;var r=conv(get("r",L));if(plain(r))it.r[L]=r});
  if(!plain(it.q)&&!/<img/i.test(it.q)){skipped.push(label+": no question text");return null}
  if(Object.keys(it.o).length<2){skipped.push(label+": fewer than 2 answer choices");return null}
  var key=plain(conv(get("k"))),mm=key.toUpperCase().match(/^(?:OPTION\s*|CHOICE\s*)?\(?([A-F])\)?(?:[.):\s-]|$)/);
  if(mm&&it.o[mm[1]])it.k=mm[1];
  else Object.keys(it.o).some(function(L){if(plain(it.o[L]).toLowerCase()===key.toLowerCase()){it.k=L;return true}});
  if(!it.k){skipped.push(label+": "+(key?"the correct answer “"+key+"” doesn’t match a choice":"no correct answer given"));return null}
  var n=parseInt(plain(conv(get("n"))),10);if(n)it.n=n;
  var lvl=titleCase1(plain(conv(get("lvl"))));if(lvl)it.lvl=lvl;
  var tip=conv(get("tip"));if(plain(tip))it.tip=tip;
  var mn=conv(get("mn"));if(plain(mn))it.mn=mn;
  var gen=conv(get("gen"));if(plain(gen))it.gen=gen;
  var pg=plain(conv(get("pg")));if(/^[(\[].*[)\]]$/.test(pg))pg="";if(pg)it.pg=pg.replace(/^p(?:age|g|p)?\.?\s*/i,"");
  var ex=plain(conv(get("ex")));if(/^[(\[].*[)\]]$/.test(ex))ex="";if(ex)it.ex=ex.replace(/^["“']+|["”']+$/g,"").replace(/[\s.…]+$/,"").slice(0,220);
  return it;
}
function finishItems(items){var hasN=items.some(function(x){return x.n});if(hasN)items.sort(function(a,b){return(a.n||1e9)-(b.n||1e9)});items.forEach(function(x,i){if(!x.n)x.n=i+1});return items}
function baseName(f){return String(f||"Imported deck").replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim()}
function readMeta(info,res){
  Object.keys(info).forEach(function(k){var v=String(info[k]).trim();if(!v)return;
    if(/^(deck|deckname|title|name|topic)$/.test(k))res.title=v;
    else if(/^subject$/.test(k))res.subjectGuess=v;
    else if(/^(source|sources|sourcematerial|reference|book|textbook)$/.test(k))res.sourceGuess=v;
    else if(/^(description|about|covers)$/.test(k))res.desc=v});
}

/* Anki */
function parseApkg(buf){

    if(!f){f=zip.file("collection.anki21");z=false}
    if(!f){f=zip.file("collection.anki2");z=false}
    if(!f)throw new Error("bad");
    return f.async("uint8array").then(function(bytes){if(z)bytes=fzstd.decompress(bytes);return initSqlJs().then(function(SQL){return readCollection(new SQL.Database(bytes))})});
  });
}
function q1(db,sql){var st=db.prepare(sql),out=[];while(st.step())out.push(st.get());st.free();return out}
function readCollection(db){
  var tables=q1(db,"select name from sqlite_master where type='table'").map(function(r){return r[0]}),types={},deckNames={};
  if(tables.indexOf("fields")>-1){
    q1(db,"select ntid,ord,name from fields order by ntid,ord").forEach(function(r){(types[r[0]]=types[r[0]]||[])[r[1]]=r[2]});
    q1(db,"select id,name from decks").forEach(function(r){deckNames[r[0]]=String(r[1]).split("\x1f").join("::")});
  }else{
    var col=q1(db,"select models,decks from col")[0],models=JSON.parse(col[0]||"{}"),dks=JSON.parse(col[1]||"{}");
    Object.keys(models).forEach(function(id){types[id]=(models[id].flds||[]).sort(function(a,b){return a.ord-b.ord}).map(function(x){return x.name})});
    Object.keys(dks).forEach(function(id){deckNames[id]=dks[id].name});
  }
  var maps={};Object.keys(types).forEach(function(id){var m=mapFields(types[id]);if(okMap(m))maps[id]=m});
  if(!Object.keys(maps).length)return{items:[],skipped:[],reason:"apkgfields"};
  var rows=q1(db,"select n.id,n.mid,n.flds,n.tags,min(c.did) from notes n join cards c on c.nid=n.id group by n.id order by n.id");
  var items=[],skipped=[],deckCount={},tagCount={},topic="",cnt=0;
  rows.forEach(function(r){
    var m=maps[r[1]];if(!m)return;cnt++;
    var f=String(r[2]).split("\x1f"),get=function(k,L){var i=k==="o"?m.o[L]:k==="r"?m.r[L]:m[k];return i===undefined?"":(f[i]||"")};
    var it=buildItem(get,clean,"Card "+cnt,skipped);if(!it)return;
    if(!it.gen){var sp=splitCore(it.r[it.k]);if(sp.core){it.gen=sp.core;it.r[it.k]=sp.short}}
    if(!topic&&m.topic!==undefined)topic=plain(f[m.topic]||"");
    items.push(it);deckCount[r[4]]=(deckCount[r[4]]||0)+1;
    String(r[3]).trim().split(/\s+/).forEach(function(t){if(t)tagCount[t]=(tagCount[t]||0)+1});
  });
  var did=Object.keys(deckCount).sort(function(a,b){return deckCount[b]-deckCount[a]})[0],full=deckNames[did]||"Imported deck",parts=full.split("::");
  var src="";["Pawlina","Ross","Junqueira","Moore","Netter","Gray","Snell","Harper","Lippincott","Lehninger","Guyton","Costanzo","Ganong","Robbins","Katzung","Mescher","Sadler","Langman","Boron","Marks"].some(function(b){if(Object.keys(tagCount).some(function(t){return t.toLowerCase().indexOf(b.toLowerCase())>-1})){src=b;return true}});
  return{items:finishItems(items),skipped:skipped,title:parts[parts.length-1],path:parts.slice(0,-1).join(" · "),topic:topic,sourceGuess:src,subjectGuess:guessSubject(full)};
}

/* Excel / CSV */
function parseSheet(buf,fname){
  var wb=XLSX.read(buf,{type:"array"}),res={items:[],skipped:[],title:baseName(fname),path:"",topic:""},info={},found=false;
  wb.SheetNames.forEach(function(sn){
    var rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:false,blankrows:false});
    if(/deck|info|about/i.test(sn)){rows.forEach(function(r){if(r[0]!==""&&r[1]!==undefined)info[norm(r[0])]=r[1]});return}
    if(found)return;
    for(var h=0;h<Math.min(rows.length,12);h++){
      var m=mapFields(rows[h].map(String));if(!okMap(m))continue;
      found=true;var items=[];
      for(var i=h+1;i<rows.length;i++){var row=rows[i];
        if(!row.some(function(c){return String(c).trim()}))continue;
        var get=function(k,L){var j=k==="o"?m.o[L]:k==="r"?m.r[L]:m[k];return j===undefined?"":row[j]};
        if(/^example$/i.test(String(get("n")).trim()))continue;
        var it=buildItem(get,txt,"Row "+(i+1)+(wb.SheetNames.length>1?" ("+sn+")":""),res.skipped);if(it)items.push(it)}
      res.items=finishItems(items);break;
    }
  });
  if(!found)res.reason="sheetcols";
  readMeta(info,res);
  return res;
}

/* Word */
var DOC_LABELS=[
  [/^(?:correct\s+answer|answer\s+key|answer|correct|key)\s*[:\-–]\s*(.*)$/i,"k"],
  [/^(?:rationale|explanation|why)\s*(?:for\s*)?(?:option\s*|choice\s*)?\(?([A-F])\)?\s*[:\-–]\s*(.*)$/i,"r"],
  [/^(?:explanation|general\s+rationale|core\s+rationale|overall\s+rationale|rationale|discussion)\s*[:\-–]\s*(.*)$/i,"gen"],
  [/^(?:study\s+tip|exam\s+tip|quiz\s*\/\s*exam\s+tip|high[-\s]?yield\s+tip|tip|pearl)\s*[:\-–]\s*(.*)$/i,"tip"],
  [/^(?:level|question\s+type|bloom['’]?s?\s+level|cognitive\s+level|type)\s*[:\-–]\s*(.*)$/i,"lvl"],
  [/^(?:page\s+number|page|pages|pg|p)\.?\s*[:\-–]\s*(.*)$/i,"pg"],
  [/^(?:passage|paragraph(?:\s+starter|\s+start)?|excerpt|source\s+text|first\s+words)\s*[:\-–]\s*(.*)$/i,"ex"],
  [/^(?:mnemonic)\s*[:\-–]\s*(.*)$/i,"mn"]
];
var DOC_META=/^(deck(?:\s+name)?|title|subject|source(?:\s+material)?|reference|book|description)\s*[:\-–]\s*(.+)$/i;
var DOC_Q=/^(?:q(?:uestion)?\s*)?(\d{1,4})\s*[.):\-–]\s*(.*)$/i;
var DOC_Q2=/^(?:q(?:uestion)?)\s*[:\-–]\s*(.+)$/i;
var DOC_OPT=/^\(?([A-Fa-f])\s*[.)\]:]\s*(.+)$/;
function parseDocLines(lines,fname){
  var res={items:[],skipped:[],title:baseName(fname),path:"",topic:""},info={},raws=[],cur=null,last=null;
  function start(n,text){cur={n:n||"",q:text||"",o:{},r:{},labels:false,optList:0};raws.push(cur);last="q"}
  function add(field,val,L){
    if(field==="o"){cur.o[L]=(cur.o[L]?cur.o[L]+"\n":"")+val;last="o:"+L;return}
    if(field==="r"){cur.r[L]=(cur.r[L]?cur.r[L]+"\n":"")+val;last="r:"+L;return}
    cur[field]=(cur[field]?cur[field]+"\n":"")+val;last=field;
  }
  lines.forEach(function(ln){
    var t=ln.text.replace(/ /g," ").trim();if(!t)return;
    var mm;
    if(!cur&&(mm=DOC_META.exec(t))){info[norm(mm[1])]=mm[2];return}
    if((mm=DOC_Q.exec(t))){
      if(!cur||cur.labels||Object.keys(cur.o).length>=2||!cur.q){start(mm[1],mm[2]);return}
    }
    if((mm=DOC_Q2.exec(t))){start("",mm[1]);return}
    if(cur){
      for(var i=0;i<DOC_LABELS.length;i++){var re=DOC_LABELS[i][0],f=DOC_LABELS[i][1],x=re.exec(t);
        if(x){cur.labels=true;if(f==="r")add("r",x[2],x[1].toUpperCase());else add(f,x[1]);return}}
      if(!cur.labels&&(mm=DOC_OPT.exec(t))){add("o",mm[2],mm[1].toUpperCase());return}
    }
    if(ln.li){
      if(cur&&!cur.labels&&cur.q&&Object.keys(cur.o).length<LET.length){var L=LET[Object.keys(cur.o).length];add("o",t,L);return}
      start("",t);return;
    }
    if(!cur)return;
    if(last==="q")cur.q+="\n"+t;
    else if(last.indexOf("o:")===0)cur.o[last.slice(2)]+="\n"+t;
    else if(last.indexOf("r:")===0)cur.r[last.slice(2)]+="\n"+t;
    else cur[last]=(cur[last]||"")+"\n"+t;
  });
  raws.forEach(function(r,i){
    var get=function(k,L){if(k==="o")return r.o[L]||"";if(k==="r")return r.r[L]||"";return r[k]||""};
    var it=buildItem(get,txt,"Question "+(r.n||i+1),res.skipped);if(it)res.items.push(it);
  });
  finishItems(res.items);
  if(!raws.length)res.reason="docshape";
  readMeta(info,res);
  return res;
}
function parseDocx(buf,fname){
  return mammoth.convertToHtml({arrayBuffer:buf}).then(function(out){
    var doc=new DOMParser().parseFromString("<div>"+out.value+"</div>","text/html"),lines=[];
    Array.prototype.forEach.call(doc.body.querySelectorAll("p,li,h1,h2,h3,h4,h5,h6"),function(el){
      if(el.tagName==="P"&&el.closest("li"))return;
      var c=el.cloneNode(true);Array.prototype.forEach.call(c.querySelectorAll("ol,ul"),function(x){x.remove()});
      var hasImg=c.querySelector("img");
      Array.prototype.forEach.call(c.querySelectorAll("br"),function(b){b.replaceWith("\n")});
      var t=(c.textContent||"").trim();
      if(hasImg)t=(t?t+" ":"")+"[Image not included]";
      t.split("\n").forEach(function(part,ix){lines.push({text:part,li:el.tagName==="LI"&&ix===0})});
    });
    return parseDocLines(lines,fname);
  });
}

function slug(s){return(String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)||"deck")}
function fileKind(name){var e=String(name).toLowerCase().split(".").pop();return e==="apkg"||e==="colpkg"?"apkg":(e==="xlsx"||e==="xls"||e==="csv"||e==="xlsm"||e==="ods")?"xlsx":e==="docx"?"docx":null}

var FORMAT_HELP={
  xlsx:'<p>One question per row. Put these column headings in the first row (the order doesn’t matter):</p>'+
    '<div class="fmt-cols"><code>Item</code><code>Question</code><code>Option A</code><code>Option B</code><code>Option C</code><code>Option D</code><code>Correct</code><code>Rationale A</code><code>Rationale B</code><code>Rationale C</code><code>Rationale D</code><code>Explanation</code><code>Study Tip</code><code>Level</code><code>Page</code><code>Passage</code></div>'+
    '<p><b>Required:</b> Question, at least two options, and Correct (a letter like <code>C</code>, or the exact option text). Everything else is optional. Option E and F work too.</p>'+
    '<p><b>Deck details (optional):</b> add a second sheet named <code>Deck info</code> with two columns: <code>Deck name</code>, <code>Subject</code>, <code>Source</code>, <code>Description</code> in the first column and their values in the second.</p>'+
    '<p>CSV files with the same headings also work.</p>',
  docx:'<p>Type each question as a block like this. Bold, italics and Word’s automatic numbering are fine.</p>'+
    '<pre class="fmt-pre">Deck: Bone\nSubject: Histology\nSource: Pawlina, Histology: A Text and Atlas — Ch. 8\n\n1. Which cell secretes osteoid?\nA. Osteoclast\nB. Osteoblast\nC. Osteocyte\nD. Chondrocyte\nAnswer: B\nLevel: Remembering\nRationale A: Osteoclasts resorb bone.\nRationale B: Correct. Osteoblasts secrete osteoid.\nRationale C: Osteocytes maintain matrix.\nRationale D: Chondrocytes make cartilage.\nExplanation: Osteoblasts lay down unmineralized matrix…\nStudy tip: Blast builds, clast cuts.\nPage: (book page)\nPassage: (first words of the paragraph)</pre>'+
    '<p><b>Required:</b> the numbered question, at least two lettered options, and an <code>Answer:</code> line. The lines at the top (Deck, Subject, Source) and the labelled lines under each question are optional.</p>',
  apkg:'<p>In Anki’s deck list, click the gear beside the deck, choose <b>Export</b>, keep “Anki Deck Package (.apkg)”, and save. The cards need fields named like <code>Question</code>, <code>OptionA</code>–<code>OptionD</code> and <code>Correct</code>. Optional fields: <code>RationaleA</code>–<code>D</code>, <code>QuestionType</code>, <code>QuizExamTip</code>, <code>Page</code>, <code>Passage</code>.</p>'
};
function openImport(){
  dialog('<div class="cap">Import deck</div><h2 id="dt">Add questions from a file</h2>'+
    '<div class="fmts">'+
      fmtRow("xlsx","bars","Excel","One question per row. .xlsx, .xls or .csv")+
      fmtRow("docx","file","Word","Numbered questions with A–D choices. .docx")+
      fmtRow("apkg","layers","Anki","A deck exported from Anki. .apkg")+
    '</div><div class="fmt-help" id="fmt-help" hidden></div>'+
    '<div class="note">Pictures inside questions aren’t imported yet. They show as “[Image]”.</div>'+
    '<div class="acts"><button type="button" class="b p" id="pickf">'+ic("upload")+'Choose file</button><button type="button" class="b" id="imp-c">Cancel</button></div>'+
    '<input type="file" id="file2" accept=".xlsx,.xls,.csv,.docx,.apkg" hidden>',
  function(close){
    on("imp-c",close);
    on("pickf",function(){$("file2").click()});
    $("file2").onchange=function(e){var f=e.target.files&&e.target.files[0];e.target.value="";if(f){close();importFile(f)}};
    Array.prototype.forEach.call(document.querySelectorAll("[data-fmt]"),function(b){b.onclick=function(){
      var k=b.getAttribute("data-fmt"),box=$("fmt-help"),open=b.getAttribute("aria-expanded")==="true";
      Array.prototype.forEach.call(document.querySelectorAll("[data-fmt]"),function(x){x.setAttribute("aria-expanded","false")});
      if(open){box.hidden=true;return}
      b.setAttribute("aria-expanded","true");box.innerHTML='<div class="cap">'+b.querySelector("b").textContent+' format</div>'+FORMAT_HELP[k];box.hidden=false}});
  });
  function fmtRow(k,icn,t,d){return'<button type="button" class="fmt" data-fmt="'+k+'" aria-expanded="false"><span class="fi">'+ic(icn)+'</span><span class="ft"><b>'+t+'</b><small>'+d+'</small></span><span class="fl2">Format '+ic("chev")+'</span></button>'}
}
function importFile(file){
  var kind=fileKind(file.name);
  dialog('<div class="cap">Import deck</div><h2 id="dt">Reading “'+esc(file.name)+'”…</h2><div class="note" id="imp-msg">This can take a few seconds the first time.</div>',function(close,ov){
    function fail(title,msg){$("dt").textContent=title;$("imp-msg").innerHTML=msg+'<div class="acts" style="margin-top:1em"><button type="button" class="b p" id="imp-h">See file formats</button><button type="button" class="b" id="imp-x">Close</button></div>';on("imp-x",close);on("imp-h",function(){close();openImport()})}
    if(!kind){fail("That file type isn’t supported","Use an Excel file (.xlsx, .xls, .csv), a Word file (.docx) or an Anki deck (.apkg). Older Word files (.doc) need to be saved as .docx first.");return}
    loadLibs(kind).then(function(){return file.arrayBuffer()}).then(function(buf){
      return kind==="apkg"?parseApkg(buf):kind==="xlsx"?parseSheet(buf,file.name):parseDocx(buf,file.name);
    }).then(function(res){
      if(!res.items.length){
        var why={apkgfields:"This deck’s cards don’t have the question, option and correct-answer fields this app reads.",
          sheetcols:"The app couldn’t find a heading row with Question, Option A, Option B and Correct columns.",
          docshape:"The app couldn’t find numbered questions in this document."}[res.reason]||"No questions with a correct answer were found.";
        fail("No questions found",why+skipList(res.skipped));return}
      var lv={};res.items.forEach(function(it){var l=it.lvl||"Other";lv[l]=(lv[l]||0)+1});
      var existing=S.decks.filter(function(d){return d.title===res.title&&(d.path||"")===(res.path||"")})[0];
      ov.querySelector(".dlg").innerHTML='<div class="cap">Import deck</div><h2 id="dt">'+res.items.length+' question'+(res.items.length===1?"":"s")+' found</h2><div class="note">'+sortLevels(Object.keys(lv)).map(function(l){return esc(l)+" "+lv[l]}).join(" · ")+
        (res.items.some(function(x){return x.pg})?' · page numbers included':'')+'</div>'+skipList(res.skipped)+
        (existing?'<div class="resume"><span class="tx">A deck with this name is already here. Saving replaces its questions and keeps your past scores.</span></div>':'')+
        '<div class="fld"><label for="i-title">Deck name</label><input id="i-title" value="'+esc(res.title)+'"></div>'+subjectField("i-sub",existing?subjOf(existing):(res.subjectGuess||knownSubject(res.title+" "+(res.sourceGuess||""))||""))+
        '<div class="fld"><label for="i-src">Source material</label><input id="i-src" placeholder="e.g. Pawlina, Histology: A Text and Atlas — Ch. 8" value="'+esc(existing&&(existing.sources||[])[0]||res.sourceGuess||"")+'"></div>'+
        '<div class="acts"><button type="button" class="b p" id="i-save">Save deck</button><button type="button" class="b" id="i-cancel">Cancel</button></div><div class="err" id="i-err" hidden></div>';
      on("i-cancel",close);
      on("i-save",function(){
        var b=$("i-save");b.disabled=true;b.textContent="Saving…";
        var title=$("i-title").value.trim()||res.title,src=$("i-src").value.trim(),sub=$("i-sub").value.trim()||knownSubject(title)||"General";
        var meta={id:existing?existing.id:slug(sub+"-"+title)+"-"+Date.now().toString(36),title:title,subject:sub,path:res.path||"",topic:res.topic||"",desc:res.desc||(existing?existing.desc||"":""),sources:src?[src]:[],count:res.items.length,levels:lv,added:existing?existing.added:Date.now(),updated:Date.now(),format:kind};
        store.saveDeck(meta,res.items).then(function(){
          S.decks=S.decks.filter(function(d){return d.id!==meta.id}).concat([meta]);
          if(existing&&S.progress[meta.id]){delete S.progress[meta.id].session;delete S.progress[meta.id].seen;store.setDoc("progress/"+meta.id,"qb:prog:"+meta.id,S.progress[meta.id])}
          logEvent("add","Added a new deck: "+title,meta);
          close();toast("Added “"+title+"”.");openDeck(meta.id);
        }).catch(function(e){b.disabled=false;b.textContent="Save deck";$("i-err").textContent=(e&&e.code==="quota_exceeded")?"Storage is full. Delete a deck you no longer use, then try again.":"Couldn’t save the deck. Check your connection and try again.";$("i-err").hidden=false});
      });
    }).catch(function(e){
      if(e&&e.message==="lib")fail("Couldn’t load the file reader","Check your internet connection and try again.");
      else fail("Couldn’t read that file",kind==="apkg"?"Make sure it’s a deck exported from Anki as .apkg.":kind==="docx"?"Make sure it’s a Word .docx file and not password-protected.":"Make sure it’s an Excel or CSV file and not password-protected.");
    });
  });
}
function skipList(sk){
  if(!sk||!sk.length)return"";
  return'<details class="skips"><summary>'+sk.length+' question'+(sk.length===1?" was":"s were")+' skipped</summary><ul>'+sk.slice(0,30).map(function(s){return'<li>'+esc(s)+'</li>'}).join("")+(sk.length>30?'<li>…and '+(sk.length-30)+' more</li>':'')+'</ul></details>';
}

/* ---------- boot ---------- */
function loadAll(){
  return Promise.all([store.listDecks(),store.getDoc("stats/activity","qb:act")]).then(function(r){
    S.decks=r[0].filter(function(d){return d&&d.id});S.act=r[1]||{};S.act.days=S.act.days||{};S.act.events=S.act.events||[];
    return Promise.all(S.decks.map(function(d){return store.getDoc("progress/"+d.id,"qb:prog:"+d.id).then(function(p){S.progress[d.id]=p})}));
  });
}
var booted=false;
function maybeSeed(){
  var sd=window.MD_SEED;if(!sd||S.decks.length||lsGet("qb:seeded:"+(window.MD_ACCOUNT?window.MD_ACCOUNT.uid:"local")))return Promise.resolve();
  lsSet("qb:seeded:"+(window.MD_ACCOUNT?window.MD_ACCOUNT.uid:"local"),1);
  return Promise.all((sd.decks||[]).map(function(d){var m=JSON.parse(JSON.stringify(d.meta));return store.saveDeck(m,d.items).then(function(){
      var p=(sd.progress||{})[m.id];return p?store.setDoc("progress/"+m.id,"qb:prog:"+m.id,p):null})}))
    .then(function(){return sd.activity?store.setDoc("stats/activity","qb:act",sd.activity):null}).then(loadAll);
}
function boot(){if(booted)return;booted=true;loadAll().then(maybeSeed).then(renderHome).catch(function(e){if(window.console)console.warn(e);mode="local";DB=null;loadAll().then(renderHome)})}
window.MD_START=function(db){if(db){DB=db;mode="cloud"}boot()};
if(window.MD_BOOT){window.MD_BOOT()}
else if(window.claude&&window.claude.use){
  var fallback=setTimeout(boot,11000);
  window.claude.use("db").then(function(db){clearTimeout(fallback);if(db&&!booted){DB=db;mode="db"}boot()}).catch(function(){clearTimeout(fallback);boot()});
}else boot();
})();
</script>
