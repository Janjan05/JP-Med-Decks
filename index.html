<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MedDecks</title>
<meta name="description" content="Practice tests for medical school.">
<meta name="theme-color" content="#1B2F55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedDecks">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: study dashboard — white cards on a cool ground, serif headings, navy actions; test view = question rail · sheet · key panel. */
:root{
  --bg:#F6F7F9; --card:#FFFFFF; --soft:#F1F3F6; --ink:#101828; --ink2:#344054; --muted:#667085; --faint:#98A2B3;
  --line:#E4E7EC; --line2:#D0D5DD;
  --navy:#1B2F55; --navy2:#26406F; --onnavy:#FFFFFF; --blue:#2F5DA8; --bluebg:#EEF3FB; --bluebd:#D5E1F3;
  --ok:#157347; --okbg:#ECF7F0; --okbd:#A6D9BA; --okfg:#0E5532;
  --bad:#B42318; --badbg:#FEF1EF; --badbd:#F4B3AA; --badfg:#912018;
  --tip:#FFF8E7; --tipbd:#F3E1B0; --tipfg:#7A5300; --flagc:#C4320A; --amber:#B54708; --track:#EAECF0;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --sans:"Inter",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --sh2:0 4px 12px rgba(16,24,40,.08);
  --z:1;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1217; --card:#161A21; --soft:#1C212A; --ink:#ECEEF2; --ink2:#C9CED8; --muted:#98A1B0; --faint:#6E7787;
  --line:#262C36; --line2:#343B47;
  --navy:#C8D6F2; --navy2:#E0E8F8; --onnavy:#0E1626; --blue:#8FB0EA; --bluebg:#18223A; --bluebd:#24345A;
  --ok:#5CC48A; --okbg:#122219; --okbd:#24573A; --okfg:#A6E3BF;
  --bad:#F08A7E; --badbg:#2A1614; --badbd:#6A2D26; --badfg:#F7BDB5;
  --tip:#2A2210; --tipbd:#4A3B15; --tipfg:#F0CF85; --flagc:#F2845F; --amber:#F0A35E; --track:#262C36;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 4px 12px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1217; --card:#161A21; --soft:#1C212A; --ink:#ECEEF2; --ink2:#C9CED8; --muted:#98A1B0; --faint:#6E7787;
  --line:#262C36; --line2:#343B47;
  --navy:#C8D6F2; --navy2:#E0E8F8; --onnavy:#0E1626; --blue:#8FB0EA; --bluebg:#18223A; --bluebd:#24345A;
  --ok:#5CC48A; --okbg:#122219; --okbd:#24573A; --okfg:#A6E3BF;
  --bad:#F08A7E; --badbg:#2A1614; --badbd:#6A2D26; --badfg:#F7BDB5;
  --tip:#2A2210; --tipbd:#4A3B15; --tipfg:#F0CF85; --flagc:#F2845F; --amber:#F0A35E; --track:#262C36;
  --sh:0 1px 2px rgba(0,0,0,.3); --sh2:0 4px 12px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
#app{font-size:calc(15px * var(--z));line-height:1.5;min-height:100%;display:flex;flex-direction:column}
#app *,#app *::before,#app *::after,.ov *{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none;text-align:inherit;line-height:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,label:focus-within{outline:2px solid var(--blue);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){.gut{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}}
.serif{font-family:var(--serif)}
.cap{font-size:.74em;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* top nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.8em 1.2em;flex-wrap:wrap;padding-block:.75em;min-height:4.2em}
.brand{font-family:var(--serif);font-size:1.55em;font-weight:700;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.nav .sp{flex:1}
.b{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:2.7em;padding:0 1em;border-radius:8px;border:1px solid var(--line2);background:var(--card);color:var(--ink);font-weight:600;font-size:.94em;white-space:nowrap;box-shadow:var(--sh)}
.b:hover{background:var(--soft)}
.b.p{background:var(--navy);border-color:var(--navy);color:var(--onnavy)}
.b.p:hover{background:var(--navy2)}
.b.q{border-color:transparent;background:transparent;box-shadow:none}
.b.q:hover{background:var(--soft)}
.b.sm{min-height:2.3em;padding:0 .8em;font-size:.86em}
.b.ic{padding:0;width:2.7em}
.b[disabled]{opacity:.4;cursor:default;box-shadow:none}
.b.danger{color:var(--bad);border-color:var(--badbd)}
.b.on{background:var(--badbg);border-color:var(--badbd);color:var(--flagc)}
.link{color:var(--blue);font-weight:600;font-size:.9em;display:inline-flex;align-items:center;gap:.35em}
.link:hover{text-decoration:underline}

.wrap{width:100%;max-width:90em;margin:0 auto}
.page{flex:1;padding-block:1.6em 3em;display:flex;flex-direction:column;gap:1.4em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh)}
.card-h{display:flex;align-items:flex-start;gap:.8em;padding:1.2em 1.4em .2em}
.card-h .t{font-family:var(--serif);font-size:1.25em;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.card-h .s{font-size:.88em;color:var(--muted)}
.card-h .sp{flex:1}
.card-h>svg.i{width:1.5em;height:1.5em;color:var(--navy);margin-top:.05em}
.card-b{padding:1em 1.4em 1.3em}
.h1{margin:0;font-family:var(--serif);font-weight:700;letter-spacing:-.025em;line-height:1.08;text-wrap:balance}
.h2{margin:0;font-family:var(--serif);font-size:1.6em;font-weight:700;letter-spacing:-.02em}
.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:.5em;font-size:.92em;color:var(--muted)}
.crumbs button:hover{color:var(--ink)}
.crumbs b{color:var(--ink);font-weight:600}
.crumbs svg.i{width:.95em;height:.95em}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1.6fr);gap:1.5em 2.5em;padding:2em 2.2em;align-items:center}
.hero .h1{font-size:2.6em}
.hero p{margin:.7em 0 1.4em;color:var(--ink2);font-size:1.05em;max-width:30em}
.hero-acts{display:flex;flex-wrap:wrap;gap:.7em}
.hero-acts .b{min-height:3.1em;padding:0 1.4em;font-size:1em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:.2em 1.2em;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:.15em;min-width:0}
.kpi:first-child{border-left:0;padding-left:0}
.kpi svg.i{width:1.45em;height:1.45em;color:var(--navy);margin-bottom:.4em}
.kpi .v{font-family:var(--serif);font-size:2.1em;font-weight:600;line-height:1.05;font-variant-numeric:lining-nums tabular-nums}
.kpi .l{font-weight:600;font-size:.92em}
.kpi .d{font-size:.84em;color:var(--muted)}
.kpi.fire svg.i{color:var(--amber)}.kpi.fire .l{color:var(--amber)}
.goal{grid-column:2;background:var(--bluebg);border:1px solid var(--bluebd);border-radius:12px;padding:1em 1.2em;display:flex;flex-direction:column;gap:.6em;width:100%;text-align:left}
.goal:hover{border-color:var(--blue)}
.goal .g{font-family:var(--serif);font-size:1.3em;font-weight:600}
.goal-row{display:flex;align-items:center;gap:1em}
.bar{flex:1;height:.5em;border-radius:999px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--navy)}
.bar.ok i{background:var(--ok)}
.sec-t{display:flex;align-items:baseline;gap:.4em 1em;flex-wrap:wrap}
.sec-t .s{color:var(--muted);font-size:.92em}
.sec-t .sp{flex:1}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5em,1fr));gap:1em}
.subj{display:flex;flex-direction:column;gap:1em;padding:1.2em 1.25em;text-align:left;width:100%}
.subj:hover{border-color:var(--line2);box-shadow:var(--sh2)}
.subj.sel{border-color:var(--bluebd);background:var(--bluebg)}
.subj-top{display:flex;align-items:center;gap:.9em}
.ico{width:3.2em;height:3.2em;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bluebg);color:var(--navy)}
.ico svg.i{width:1.6em;height:1.6em;stroke-width:1.6}
.ico.lg{width:5em;height:5em;border-radius:16px}
.ico.lg svg.i{width:2.4em;height:2.4em;stroke-width:1.4}
.subj .n{font-family:var(--serif);font-size:1.15em;font-weight:600;line-height:1.2}
.subj .c{font-size:.88em;color:var(--muted)}
.subj-f{display:flex;justify-content:space-between;align-items:flex-end;gap:.6em}
.subj-f b{font-size:1.05em;font-variant-numeric:tabular-nums}
.subj-f small{display:block;font-size:.8em;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.4em;align-items:start}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(6em,12em) 3em auto;align-items:center;gap:1em;padding:.8em 0;border-top:1px solid var(--line)}
.li .fi{width:2.4em;height:2.4em;border-radius:8px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.li .nm{font-weight:600;overflow-wrap:anywhere;line-height:1.3}
.li .pt{font-size:.82em;color:var(--muted);overflow-wrap:anywhere}
.li .it{font-size:.88em;color:var(--muted);white-space:nowrap}
.li .pc{font-size:.88em;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.li .b{min-height:2.4em}
.act{display:flex;align-items:center;gap:.9em;padding:.7em 0;border-top:1px solid var(--line)}
.act .ai{width:2.3em;height:2.3em;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.act .ai.ok{background:var(--okbg);color:var(--ok)}
.act .ai.blue{background:var(--bluebg);color:var(--navy)}
.act .tx{flex:1;min-width:0;line-height:1.35}
.act .tx div{font-size:.92em;overflow-wrap:anywhere}
.act .tx small{font-size:.8em;color:var(--muted)}
.act .tm{font-size:.8em;color:var(--muted);white-space:nowrap}
.empty{padding:1.5em 0 .3em;color:var(--muted);font-size:.94em}
.how{font-size:.9em;color:var(--ink2);display:flex;flex-direction:column;gap:.35em}
.how ol{margin:0;padding-left:1.25em;display:flex;flex-direction:column;gap:.2em}

/* deck page */
.deckpage{display:flex;flex-wrap:wrap;align-items:stretch;flex:1}
.dmain{flex:999 1 40em;min-width:0;padding-block:1.4em 3em;display:flex;flex-direction:column;gap:1.4em}
.dside{flex:1 1 22em;max-width:100%;min-width:0;background:var(--card);border-left:1px solid var(--line);padding-block:2em 2.4em;display:flex;flex-direction:column;gap:1.3em}
.dhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.2em 1.5em;align-items:start}
.dhead .h1{font-size:3.1em}
.dhead .desc{color:var(--ink2);margin-top:.5em;max-width:38em}
.dacts{display:flex;gap:.6em;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;flex-wrap:wrap;gap:.5em;margin-top:.9em}
.chip{font-size:.84em;font-weight:500;padding:.3em .8em;border-radius:999px;background:var(--bluebg);color:var(--navy)}
.chip.amber{background:var(--tip);color:var(--tipfg)}
.facts{display:flex;flex-wrap:wrap;border-left:1px solid var(--line)}
.fact{padding:.2em 1.4em;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:.2em;min-width:8em;max-width:15em}
.fact:last-child{border-right:0}
.fact svg.i{width:1.4em;height:1.4em;color:var(--navy);margin-bottom:.4em}
.fact .v{font-family:var(--serif);font-size:1.5em;font-weight:600;line-height:1.1}
.fact .v.sm{font-family:var(--sans);font-size:.95em;font-weight:500}
.fact .l{font-size:.84em;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4em}
.grid2b{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:1.4em}
.lv{display:grid;grid-template-columns:8.5em minmax(0,1fr) 2.2em 3.6em;gap:1em;align-items:center;padding:.85em 0;border-top:1px solid var(--line)}
.lv b{text-align:right;font-variant-numeric:tabular-nums}
.lv small{color:var(--muted);font-size:.88em;font-variant-numeric:tabular-nums}
.prog{display:grid;grid-template-columns:auto minmax(0,1fr);gap:1.2em 1.8em;align-items:center}
.ring{position:relative;width:10.5em;height:10.5em}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.2}
.ring .in b{font-family:var(--serif);font-size:1.9em;font-weight:600}
.ring .in span{font-size:.86em;color:var(--muted)}
.pstats{display:flex;flex-direction:column;gap:.9em;border-left:1px solid var(--line);padding-left:1.5em}
.ps{display:flex;gap:.8em;align-items:flex-start}
.ps svg.i{width:1.4em;height:1.4em;margin-top:.15em}
.ps b{display:block;font-family:var(--serif);font-size:1.25em;font-weight:600;line-height:1.15}
.ps span{font-size:.85em;color:var(--muted)}
.srcitem{display:flex;gap:.9em;align-items:flex-start;padding:.9em 1em;border:1px solid var(--line);border-radius:10px}
.srcitem .n{width:1.9em;height:1.9em;border-radius:6px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.88em;flex:none}
.srcitem div{line-height:1.35;overflow-wrap:anywhere}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:.5em .8em .6em 0;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.65em .8em .65em 0;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .md{display:inline-flex;align-items:center;gap:.45em}
.tbl .md svg.i{color:var(--navy)}
.tbl .cmp{display:flex;align-items:center;gap:.7em;min-width:9em}
.scroll{overflow-x:auto}
.setup h2{margin:0;font-family:var(--serif);font-size:1.75em;font-weight:700;letter-spacing:-.02em}
.setup .s{color:var(--muted);margin-top:-.9em}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:.45em;min-width:0}
legend{padding:0;margin-bottom:.55em}
.mode{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:.9em;align-items:start;padding:1em 1.1em;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer}
.mode svg.i{width:1.5em;height:1.5em;color:var(--navy)}
.mode.sel{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--bluebg)}
.mode b{display:block;font-weight:600}.mode small{display:block;font-size:.86em;color:var(--muted);line-height:1.4;margin-top:.1em}
.chk{display:flex;gap:.75em;align-items:center;cursor:pointer;min-height:2.05em}
#app input[type=radio],#app input[type=checkbox],.ov input[type=checkbox]{width:1.15em;height:1.15em;margin:0;accent-color:var(--navy);flex:none}
.inp{border:1px solid var(--line2);border-radius:8px;background:var(--card);padding:.5em .7em;font-variant-numeric:tabular-nums}
.inp.n{width:4.6em}
.divider{height:1px;background:var(--line)}
.begin{min-height:3.6em;border-radius:10px;background:var(--navy);color:var(--onnavy);display:flex;align-items:center;justify-content:center;gap:.6em;padding:0 1.3em;width:100%;font-weight:600;font-size:1.08em;box-shadow:var(--sh2)}
.begin:hover{background:var(--navy2)}
.begin span{font-size:.86em;font-weight:500;opacity:.85}
.err{color:var(--bad);font-size:.9em}
.note{font-size:.86em;color:var(--muted);line-height:1.5}
.resume{display:flex;flex-wrap:wrap;align-items:center;gap:.8em 1.2em;padding:1em 1.3em;border-radius:12px;background:var(--tip);border:1px solid var(--tipbd);color:var(--tipfg)}
.resume .tx{flex:1 1 16em;color:var(--ink)}

/* test */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;flex-wrap:wrap;gap:.7em 2em;padding-block:.85em;min-height:4.8em}
.tbar .crumbs{flex:1 1 14em;min-width:0;font-size:1.02em}
.tbar .crumbs b{font-family:var(--serif);font-size:1.15em;font-weight:600}
.tbar .vsep{width:1px;height:2.2em;background:var(--line)}
.k{display:flex;flex-direction:column;align-items:center;line-height:1.15}
.k span{font-size:.72em;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.k b{font-size:1.4em;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums}
.k.warn b{color:var(--bad)}
.flags{display:inline-flex;align-items:center;gap:.45em;font-weight:600;font-size:1.12em;font-variant-numeric:tabular-nums}
.zoom{display:flex;align-items:stretch;height:2.85em;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.zoom button{width:2.9em;font-size:1.05em;font-weight:600;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.zoom button:hover{background:var(--soft)}
.zoom span{font-size:.78em;color:var(--muted);padding:0 .5em;border-left:1px solid var(--line);border-right:1px solid var(--line);display:flex;align-items:center;font-variant-numeric:tabular-nums}
.tbody{flex:1;display:flex;align-items:stretch}
.rail{width:10.8em;flex:none;align-self:flex-start;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--tbh,4.8em));height:calc(100vh - var(--tbh,4.8em) - var(--tfh,4.6em) - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;overflow:hidden}
.rail-h{flex:none;display:flex;justify-content:space-between;align-items:baseline;gap:.5em;padding:1.2em 1.3em .8em;font-family:var(--serif);font-weight:600;font-size:1.05em}

window.MD_SEED={"decks": [{"meta": {"added": 1792833979374, "chunks": 1, "count": 40, "id": "bone-histology", "levels": {"Analyzing": 14, "Applying": 13, "Understanding": 13}, "path": "1ST YEAR - FIRST BI-MONTHLY · HISTOLOGY (1st Bi-monthly) · HISTOLOGY_WRITTEN", "ref": "REF [1] Pawlina", "sources": ["Pawlina, Histology: A Text and Atlas — Chapter 8, Bone"], "title": "Bone", "topic": "Bone — Chapter 8", "subject": "Histology"}, "items": [{"k": "C", "lvl": "Understanding", "mn": "", "n": 1, "o": {"A": "Type II collagen — calcium carbonate", "B": "Type III collagen — calcium oxalate", "C": "Type I collagen — hydroxyapatite", "D": "Type IV collagen — magnesium phosphate"}, "q": "A decalcified bone specimen has lost the mineral that normally gives bone much of its hardness. Which pairing correctly identifies the major organic structural protein and the major mineral crystal of normal bone?", "r": {"A": "Type II collagen is characteristic of cartilage rather than the major collagen of bone.", "B": "Type III collagen occurs only in trace amounts in bone and calcium oxalate is not the principal mineral.", "C": "Correct. Type I collagen plus hydroxyapatite is the classic bone matrix combination.<br><br><strong>Core rationale:<\/strong> Bone matrix is dominated by type I collagen as its organic structural protein and calcium phosphate in the form of hydroxyapatite as its mineral component.", "D": "Type IV collagen is a basal lamina collagen and magnesium phosphate is not the principal bone mineral."}, "tip": "Bone matrix = type I collagen + hydroxyapatite."}, {"k": "A", "lvl": "Applying", "mn": "", "n": 2, "o": {"A": "Internal lining = endosteum; external sheath = periosteum", "B": "Internal lining = periosteum; external sheath = endosteum", "C": "Both surfaces are covered by perichondrium", "D": "Both surfaces are formed by articular cartilage"}, "q": "A histologic section shows a thin cellular lining on trabeculae facing marrow spaces, while the external bone surface is covered by a denser fibrous sheath. Which identification is correct?", "r": {"A": "Correct. Endosteum is internal; periosteum is external.<br><br><strong>Core rationale:<\/strong> Endosteum lines internal bone surfaces, including marrow cavities and spongy trabeculae. Periosteum is the fibrous connective tissue covering external bone surfaces except at articular cartilage.", "B": "This reverses the normal locations of the two coverings.", "C": "Perichondrium surrounds cartilage, not ordinary bone surfaces.", "D": "Articular cartilage covers joint surfaces only, not all internal and external bone surfaces."}, "tip": "Periosteum outside; endosteum inside."}, {"k": "D", "lvl": "Understanding", "mn": "", "n": 3, "o": {"A": "Only into Haversian canals", "B": "Only into marrow spaces", "C": "Through the entire osteon to its central canal", "D": "Into circumferential and interstitial lamellae"}, "q": "At the attachment of a tendon to bone, collagen fibers penetrate the outer bone matrix and help anchor the periosteum and tendon. Where do these Sharpey fibers usually extend?", "r": {"A": "Sharpey fibers are matrix-anchoring collagen fibers, not structures confined to Haversian canals.", "B": "They do not simply terminate in marrow spaces.", "C": "The chapter specifically notes that they usually do not enter osteons.", "D": "Correct. Their usual penetration is into circumferential and interstitial lamellae.<br><br><strong>Core rationale:<\/strong> Perforating or Sharpey fibers extend from tendons, ligaments, or periosteum into the bone matrix. They commonly enter outer circumferential and interstitial lamellae but usually do not penetrate osteons."}, "tip": "Sharpey fibers anchor periosteum/tendon to bone but usually avoid osteons."}, {"k": "B", "lvl": "Analyzing", "mn": "", "n": 4, "o": {"A": "Both are Haversian canals", "B": "The first is Haversian; the second is Volkmann", "C": "The first is Volkmann; the second is Haversian", "D": "Both are Volkmann canals"}, "q": "A student compares two vascular channels in compact bone. One is surrounded by concentric lamellae, while the other cuts across lamellae and connects neighboring channels. Which statement is correct?", "r": {"A": "Only the channel surrounded by concentric lamellae is Haversian.", "B": "Correct. This is the key histologic distinction.<br><br><strong>Core rationale:<\/strong> Haversian canals occupy the center of osteons and are surrounded by concentric lamellae. Volkmann canals run across the lamellar pattern, connect Haversian canals, and lack their own concentric lamellae.", "C": "This reverses the defining features of the two canal systems.", "D": "Volkmann canals are not surrounded by concentric osteonal lamellae."}, "tip": "Haversian = concentric; Volkmann = perforating/cross-connecting."}, {"k": "C", "lvl": "Applying", "mn": "", "n": 5, "o": {"A": "Mature lamellar bone", "B": "Compact osteonal bone", "C": "Immature woven bone", "D": "Calcified cartilage"}, "q": "A fracture callus initially contains rapidly formed bone with randomly arranged collagen fibers and relatively many cells. How should this newly formed bone be classified?", "r": {"A": "Mature lamellar bone has organized lamellae and fewer randomly arranged cells.", "B": "Compact osteonal bone is a mature organized form rather than the initial rapidly deposited tissue.", "C": "Correct. Woven bone is expected early in development and repair.<br><br><strong>Core rationale:<\/strong> Immature or woven bone forms rapidly and has an interlacing, nonlamellar collagen arrangement with relatively more cells and ground substance. It is later remodeled into mature lamellar bone.", "D": "Calcified cartilage may serve as a scaffold in endochondral ossification but is not newly formed bone itself."}, "tip": "Fast formation = woven first, lamellar later."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 6, "o": {"A": "RUNX2 (CBFA1)", "B": "SOX-9", "C": "RANK", "D": "Calcitonin"}, "q": "An osteoprogenitor cell is stimulated to enter the osteoblast lineage. Which transcription factor is most directly associated with this differentiation step?", "r": {"A": "Correct. RUNX2 is the major osteogenic transcription factor emphasized in the chapter.<br><br><strong>Core rationale:<\/strong> RUNX2, also called CBFA1, is the key transcription factor that promotes expression of the osteoblast phenotype in osteoprogenitor cells.", "B": "SOX-9 is central to chondroblast differentiation.", "C": "RANK is a receptor on osteoclast precursors rather than an osteoblast-lineage transcription factor.", "D": "Calcitonin is a hormone that suppresses osteoclastic activity, not a transcription factor driving osteoblast differentiation."}, "tip": "RUNX2 → osteoblast; SOX-9 → chondroblast."}, {"k": "D", "lvl": "Applying", "mn": "", "n": 7, "o": {"A": "Inactive osteocytes surrounding a Haversian canal", "B": "Osteoclasts lining a resorption bay", "C": "Bone-lining cells covering quiescent bone", "D": "Active osteoblasts depositing osteoid"}, "q": "A row of cuboidal cells lines a newly forming bone surface. Their cytoplasm is strongly basophilic, and a pale band separates them from mineralized bone. Which interpretation is most appropriate?", "r": {"A": "Osteocytes reside within lacunae, not as a surface row of cuboidal cells.", "B": "Osteoclasts are large multinucleated acidophilic cells in resorption bays.", "C": "Bone-lining cells are flattened and relatively inactive.", "D": "Correct. These are classic features of active osteoblasts and osteoid deposition.<br><br><strong>Core rationale:<\/strong> Active osteoblasts are cuboidal or polygonal, basophilic because of abundant rER, and line forming bone. The pale band between them and mineralized bone is osteoid, the newly secreted unmineralized matrix."}, "tip": "Cuboidal basophilic surface cell + osteoid seam = osteoblast."}, {"k": "B", "lvl": "Analyzing", "mn": "", "n": 8, "o": {"A": "Reduced loading directly converts osteocytes into osteoclasts", "B": "Reduced mechanical signaling decreases bone-forming responses", "C": "Reduced loading causes immediate hydroxyapatite precipitation", "D": "Reduced loading increases periosteal blood flow enough to resorb bone"}, "q": "After prolonged immobilization, a patient loses bone mass despite adequate dietary calcium. Which osteocyte-related mechanism best explains how reduced loading contributes to this change?", "r": {"A": "Osteocytes do not simply transform into osteoclasts.", "B": "Correct. Loss of mechanotransduction signals is central to disuse bone loss.<br><br><strong>Core rationale:<\/strong> Osteocytes are mechanosensors. Mechanical loading drives fluid flow through lacunae and canaliculi and activates signaling pathways that promote bone formation; reduced loading diminishes these signals and favors bone loss.", "C": "Reduced loading does not directly trigger mineral precipitation as the main mechanism.", "D": "Changes in blood flow are not the primary osteocyte-mediated explanation emphasized in the chapter."}, "tip": "Osteocytes convert mechanical load into biochemical signals."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 9, "o": {"A": "Periosteal chondroblast", "B": "Resorptive osteocyte", "C": "Endosteal bone-lining cell", "D": "Activated osteoclast"}, "q": "A flattened cell covers a quiescent internal bone surface where active remodeling is not occurring. Which term best describes this cell?", "r": {"A": "Chondroblasts produce cartilage rather than line quiescent bone.", "B": "Osteocytes reside in lacunae and are not the flattened surface cells described.", "C": "Correct. Internal bone-lining cells are endosteal cells.<br><br><strong>Core rationale:<\/strong> Bone-lining cells are osteoblast-derived flattened cells that cover nonremodeling bone. On internal surfaces they are commonly called endosteal cells; on external surfaces they are periosteal cells.", "D": "Osteoclasts are large multinucleated cells active at resorption sites."}, "tip": "Bone-lining cell names depend on surface: periosteal outside, endosteal inside."}, {"k": "A", "lvl": "Applying", "mn": "", "n": 10, "o": {"A": "Osteoclast", "B": "Osteoblast", "C": "Osteocyte", "D": "Osteoprogenitor cell"}, "q": "A large multinucleated acidophilic cell occupies a shallow depression on a bone surface and stains strongly for tartrate-resistant acid phosphatase. Which cell is being observed?", "r": {"A": "Correct. The morphology, location, and TRAP positivity are diagnostic of an osteoclast.<br><br><strong>Core rationale:<\/strong> Osteoclasts are large multinucleated bone-resorbing cells that lie in Howship lacunae or resorption bays. TRAP is a classic marker of osteoclast activity and differentiation.", "B": "Osteoblasts are usually mononuclear cuboidal surface cells and are associated with bone deposition.", "C": "Osteocytes are smaller mononuclear cells embedded within lacunae.", "D": "Osteoprogenitor cells are flattened precursor cells and are not multinucleated resorptive cells."}, "tip": "Osteoclast = multinucleated + Howship lacuna + TRAP."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 11, "o": {"A": "More RANKL available to bind RANK", "B": "Increased osteoclast precursor fusion", "C": "Direct activation of the osteoclast proton pump", "D": "Reduced RANK–RANKL signaling and osteoclast formation"}, "q": "A drug increases osteoprotegerin production by osteoblast-lineage cells. Which downstream effect would be expected in bone marrow?", "r": {"A": "OPG decreases rather than increases free RANKL available for RANK binding.", "B": "Reduced RANK signaling suppresses, not promotes, osteoclast maturation and fusion.", "C": "OPG acts mainly at the differentiation/signaling level rather than directly turning on proton pumps.", "D": "Correct. More OPG means less RANK–RANKL signaling and fewer active osteoclasts.<br><br><strong>Core rationale:<\/strong> Osteoprotegerin is a soluble decoy receptor for RANKL. By binding RANKL, it prevents RANK activation on osteoclast precursors and inhibits osteoclast differentiation and activation."}, "tip": "RANKL = go; OPG = decoy/stop."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 12, "o": {"A": "Basolateral region", "B": "Clear (sealing) zone", "C": "Haversian canal", "D": "Osteoid seam"}, "q": "An activated osteoclast is polarized against a bone surface. Which region forms a tight actin-rich seal around the area being resorbed?", "r": {"A": "The basolateral region participates in exocytosis of degraded material rather than sealing the resorption compartment.", "B": "Correct. The clear zone creates the sealed resorption compartment.<br><br><strong>Core rationale:<\/strong> The clear or sealing zone is an actin-rich ring that tightly attaches the osteoclast to mineralized bone and isolates the resorption microenvironment.", "C": "A Haversian canal is a vascular channel within an osteon, not an osteoclast region.", "D": "An osteoid seam is unmineralized bone matrix produced by osteoblasts."}, "tip": "Clear zone seals; ruffled border resorbs; basolateral side exports debris."}, {"k": "C", "lvl": "Analyzing", "mn": "", "n": 13, "o": {"A": "Synthesis of type I collagen by osteoblasts", "B": "Fusion of osteoclast precursor cells", "C": "Dissolution of hydroxyapatite mineral", "D": "Formation of osteocyte gap junctions"}, "q": "An osteoclast has normal lysosomal enzymes but cannot acidify the space beneath its ruffled border. Which step in bone resorption would be impaired first?", "r": {"A": "Osteoblast collagen synthesis is a bone-forming process and is not the first consequence of failed osteoclast acidification.", "B": "Precursor fusion occurs before the mature osteoclast begins acid resorption.", "C": "Correct. Mineral must be dissolved by acidification before the organic matrix is efficiently degraded.<br><br><strong>Core rationale:<\/strong> Osteoclasts use carbonic anhydrase II and ATP-dependent proton pumps to create an acidic resorption compartment, around pH 4–5. This acidity dissolves hydroxyapatite before proteolytic enzymes digest the organic matrix.", "D": "Osteocyte gap junctions are unrelated to osteoclast acidification."}, "tip": "Osteoclast resorption: acid dissolves mineral first, enzymes digest matrix next."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 14, "o": {"A": "PTH acts on other bone cells to increase RANKL signaling", "B": "PTH enters osteoclast nuclei through gap junctions", "C": "PTH is converted to calcitonin at the bone surface", "D": "PTH activates TRAP directly in the resorption bay"}, "q": "Parathyroid hormone increases osteoclastic bone resorption during sustained exposure, yet osteoclasts themselves lack PTH receptors. How is this effect produced?", "r": {"A": "Correct. The osteoclast response to PTH is indirect through RANKL-producing cells.<br><br><strong>Core rationale:<\/strong> PTH acts on PTH-receptor-bearing cells such as osteoblasts, osteocytes, and T lymphocytes. These cells increase RANKL signaling, which then stimulates osteoclast differentiation and activity.", "B": "Gap junction transfer of PTH into osteoclast nuclei is not the mechanism described.", "C": "PTH is not converted into calcitonin.", "D": "TRAP activity is a marker of osteoclasts but is not directly activated by PTH in this manner."}, "tip": "No PTH receptor on osteoclasts: PTH works indirectly through RANKL."}, {"k": "D", "lvl": "Applying", "mn": "", "n": 15, "o": {"A": "Persistent suppression of osteoblasts", "B": "Complete blockade of osteocyte signaling", "C": "Immediate calcitonin release from bone", "D": "Net anabolic stimulation of bone formation"}, "q": "A patient with osteoporosis receives brief intermittent doses of recombinant PTH rather than continuous exposure. What bone response is expected from this dosing pattern?", "r": {"A": "Intermittent PTH stimulates rather than persistently suppresses osteoblast-lineage activity.", "B": "PTH does not work by completely blocking osteocyte signaling.", "C": "Calcitonin is produced by thyroid parafollicular cells, not released from bone.", "D": "Correct. Intermittent PTH is used therapeutically for its anabolic effect.<br><br><strong>Core rationale:<\/strong> Brief intermittent PTH exposure is anabolic, promoting bone formation through signaling in osteocytes and osteoblasts, including cAMP/IGF-1 pathways. Prolonged continuous exposure is more catabolic because it increases RANKL-driven osteoclast activity."}, "tip": "Intermittent PTH builds; continuous PTH resorbs."}, {"k": "B", "lvl": "Applying", "mn": "", "n": 16, "o": {"A": "Endochondral ossification", "B": "Intramembranous ossification", "C": "Osteonal remodeling", "D": "Epiphyseal closure"}, "q": "A developing flat bone of the skull is forming directly within condensed mesenchyme without a preexisting cartilage model. Which process is occurring?", "r": {"A": "Endochondral ossification requires a cartilage model.", "B": "Correct. Direct bone formation from mesenchyme is intramembranous ossification.<br><br><strong>Core rationale:<\/strong> Intramembranous ossification forms bone directly from mesenchymal condensations. It is characteristic of flat bones of the skull and also contributes to the mandible and clavicle.", "C": "Osteonal remodeling replaces preexisting compact bone and is not the initial developmental process described.", "D": "Epiphyseal closure is the loss of a growth plate at the end of longitudinal growth."}, "tip": "No cartilage model = intramembranous ossification."}, {"k": "C", "lvl": "Analyzing", "mn": "", "n": 17, "o": {"A": "By calcification of cartilage only", "B": "By fusion of hypertrophic chondrocytes", "C": "By intramembranous bone formation from periosteal cells", "D": "By osteoclast deposition of mineralized matrix"}, "q": "During development of a long bone, a bony collar appears around the diaphysis of the cartilage model before the primary marrow cavity is established. How is this collar formed?", "r": {"A": "Calcified cartilage is a scaffold and is not itself the bony collar.", "B": "Hypertrophic chondrocytes do not form the collar by fusion.", "C": "Correct. The bony collar is an intramembranous component within endochondral bone development.<br><br><strong>Core rationale:<\/strong> Although the long bone develops mainly by endochondral ossification, the periosteal bony collar itself is produced by osteoblasts derived from surrounding mesenchyme/periosteum through an intramembranous mechanism.", "D": "Osteoclasts resorb matrix rather than deposit new bone."}, "tip": "Classic trick: the bony collar of an endochondral bone forms intramembranously."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 18, "o": {"A": "Primary in diaphysis; secondary in epiphyses", "B": "Primary in epiphyses; secondary in diaphysis", "C": "Both primary and secondary in metaphysis", "D": "Both primary and secondary in periosteum"}, "q": "Which relationship correctly describes the usual locations of the primary and secondary ossification centers in a developing long bone?", "r": {"A": "Correct. Diaphysis first, epiphyses later.<br><br><strong>Core rationale:<\/strong> The primary ossification center develops first in the diaphysis. Secondary ossification centers later form in the epiphyses, leaving the epiphyseal growth plate between these regions during growth.", "B": "This reverses the normal sequence and locations.", "C": "The metaphysis is adjacent to the growth plate but is not where both centers originate.", "D": "The periosteum contributes osteogenic cells but does not contain both ossification centers."}, "tip": "Primary = shaft; secondary = ends."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 19, "o": {"A": "Hypertrophy → reserve → proliferation → resorption → calcification", "B": "Proliferation → reserve → calcification → hypertrophy → resorption", "C": "Reserve → hypertrophy → proliferation → resorption → calcification", "D": "Reserve → proliferation → hypertrophy → calcification → resorption"}, "q": "Moving from the epiphyseal side of a growth plate toward the diaphysis, which sequence correctly follows the progressive changes in chondrocytes and matrix?", "r": {"A": "Reserve cartilage precedes hypertrophy, and calcification precedes resorption.", "B": "Reserve cartilage comes before proliferation, and hypertrophy comes before calcification.", "C": "Proliferation must precede hypertrophy, not follow it.", "D": "Correct. This is the standard functional sequence of the epiphyseal plate.<br><br><strong>Core rationale:<\/strong> The growth plate sequence from epiphysis toward diaphysis is reserve cartilage, proliferation, hypertrophy, calcified cartilage, and resorption/ossification. This sequence reflects chondrocyte division, enlargement, matrix calcification, then vascular invasion and bone deposition."}, "tip": "R-P-H-C-R: reserve, proliferate, hypertrophy, calcify, resorb."}, {"k": "B", "lvl": "Applying", "mn": "", "n": 20, "o": {"A": "Interstitial cartilage growth and periosteal resorption", "B": "Periosteal appositional bone deposition and endosteal resorption", "C": "Endosteal deposition and epiphyseal cartilage calcification", "D": "Osteonal closure and articular cartilage proliferation"}, "q": "A long bone continues to increase in diameter during growth while its marrow cavity also enlarges. Which paired processes best explain these simultaneous changes?", "r": {"A": "Interstitial cartilage growth contributes to cartilage expansion and long-bone length, not cortical diameter in this way.", "B": "Correct. Periosteal addition plus endosteal removal widens the bone while enlarging the cavity.<br><br><strong>Core rationale:<\/strong> Increase in bone width occurs by appositional deposition beneath the periosteum. At the same time, osteoclastic resorption on the endosteal surface enlarges the marrow cavity and helps preserve appropriate cortical thickness.", "C": "Endosteal deposition would narrow rather than enlarge the marrow cavity.", "D": "Osteonal closure and articular cartilage proliferation do not explain the coordinated diameter/cavity change."}, "tip": "Width: add outside, remove inside."}, {"k": "C", "lvl": "Analyzing", "mn": "", "n": 21, "o": {"A": "Bone deposition equals periosteal resorption", "B": "Osteoblast apoptosis equals osteoclast apoptosis", "C": "New cartilage production equals cartilage removal", "D": "Articular cartilage growth equals marrow expansion"}, "q": "During normal longitudinal growth, the epiphyseal plate remains approximately the same thickness even though the bone is lengthening. Which relationship best explains this observation?", "r": {"A": "Periosteal events mainly affect cortical width rather than maintenance of growth plate thickness.", "B": "Cell death rates in bone-forming and bone-resorbing cells do not define growth plate thickness.", "C": "Correct. Balanced cartilage production and resorption maintain plate thickness.<br><br><strong>Core rationale:<\/strong> The proliferative zone continuously produces new cartilage while cartilage is removed and replaced by bone on the diaphyseal side. When production and removal are balanced, plate thickness stays relatively constant while the bone lengthens.", "D": "Articular cartilage is not the tissue maintaining the epiphyseal growth plate."}, "tip": "Growth plate can stay the same thickness while moving the epiphysis away from the diaphysis."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 22, "o": {"A": "Cutting cone—osteoclast resorption; closing cone—osteoblast deposition", "B": "Cutting cone—osteoblast deposition; closing cone—osteoclast resorption", "C": "Cutting cone—chondrocyte proliferation; closing cone—calcification", "D": "Cutting cone—osteocyte apoptosis; closing cone—marrow formation"}, "q": "During internal remodeling of compact bone, which pairing correctly identifies the major cellular activity of the cutting cone and the closing cone?", "r": {"A": "Correct. Resorb first, then refill with concentric lamellae.<br><br><strong>Core rationale:<\/strong> The cutting cone is led by osteoclasts that create a resorption tunnel. Osteoblasts then line the closing cone and deposit successive lamellae, generating a new osteon around a central canal.", "B": "This reverses the two phases of the remodeling unit.", "C": "Chondrocytes are not the primary cells of osteonal remodeling.", "D": "Osteocyte apoptosis can signal remodeling but does not define the cutting and closing cones."}, "tip": "Cutting cone cuts; closing cone closes."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 23, "o": {"A": "Type I collagen is enzymatically removed", "B": "Osteoclasts acidify the vesicle lumen", "C": "Mature osteons are formed immediately", "D": "Calcium and phosphate accumulate and nucleate mineral"}, "q": "Osteoblasts release matrix vesicles at the osteoblast–osteoid interface. Which event occurs earliest within these vesicles during mineralization?", "r": {"A": "Collagen provides a scaffold for mineralization and is not simply removed at the start.", "B": "Acidification is an osteoclast resorption mechanism, not the initiating step of osteoblast-controlled mineralization.", "C": "Osteon formation is a much later tissue-level remodeling process.", "D": "Correct. Local Ca²⁺ and phosphate accumulation precedes crystal growth and spread.<br><br><strong>Core rationale:<\/strong> Matrix vesicles concentrate calcium and phosphate using channels, transporters, and enzymes such as annexin A5 and TNAP. Mineral begins to nucleate inside the vesicles before hydroxyapatite crystals extend into the surrounding extracellular matrix."}, "tip": "Mineralization starts in matrix vesicles, then spreads through osteoid."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 24, "o": {"A": "From the Haversian canal outward", "B": "From the periphery inward toward the canal", "C": "Randomly throughout the resorption cavity", "D": "Only along Volkmann canals"}, "q": "As a new osteon is formed during a closing cone, in which direction are successive lamellae deposited?", "r": {"A": "Deposition does not begin at the central canal and expand outward.", "B": "Correct. New osteonal bone is deposited centripetally.<br><br><strong>Core rationale:<\/strong> Osteoblasts deposit successive lamellae on the walls of the resorption cavity from the periphery inward. This centripetal process progressively narrows the cavity until a small Haversian canal remains.", "C": "The lamellae are organized sequentially rather than randomly.", "D": "Volkmann canals connect vascular channels but are not the exclusive site of osteon lamellar deposition."}, "tip": "New osteon formation is centripetal."}, {"k": "C", "lvl": "Applying", "mn": "", "n": 25, "o": {"A": "Osteopetrosis", "B": "Rickets", "C": "Osteoporosis", "D": "Osteomalacia"}, "q": "A vertebral biopsy from an elderly patient shows normal-looking lamellar bone organization but markedly reduced trabecular mass and increased fracture susceptibility. Which condition best fits this pattern?", "r": {"A": "Osteopetrosis produces abnormally dense but fragile bone because of defective osteoclast function.", "B": "Rickets is defective mineralization in growing children and produces abnormal mineralization rather than simply reduced normal bone mass.", "C": "Correct. Less otherwise normally organized bone is characteristic of osteoporosis.<br><br><strong>Core rationale:<\/strong> Osteoporosis is characterized by reduced bone mass and deterioration of microarchitecture, while the remaining bone retains fundamentally normal histologic structure. The reduced quantity of bone increases fragility.", "D": "Osteomalacia is defective mineralization of adult bone matrix rather than primary loss of bone mass with normal structure."}, "tip": "Osteoporosis = too little bone; osteomalacia/rickets = poorly mineralized bone."}, {"k": "A", "lvl": "Applying", "mn": "", "n": 26, "o": {"A": "Hematoma → soft callus → hard callus → remodeling", "B": "Osteon formation → hematoma → cartilage → necrosis", "C": "Hard callus → granulation tissue → hematoma → remodeling", "D": "Soft callus → primary osteon → hematoma → articular cartilage"}, "q": "A closed fracture is treated without rigid compression fixation. Which sequence best represents the typical indirect healing response?", "r": {"A": "Correct. This is the standard sequence of secondary bone healing.<br><br><strong>Core rationale:<\/strong> Indirect fracture healing begins with hematoma and inflammation, followed by granulation tissue and a fibrocartilaginous soft callus. This becomes a bony hard callus, which is then remodeled into mature lamellar bone and restored architecture.", "B": "A hematoma forms first, not after osteon formation.", "C": "The hard callus develops after, not before, granulation tissue and soft callus.", "D": "The sequence is disordered and articular cartilage formation is not the endpoint of fracture repair."}, "tip": "Fracture repair: hematoma → soft callus → hard callus → remodeling."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 27, "o": {"A": "Both heal only by cartilage formation", "B": "Rigid fixation requires a larger soft callus", "C": "Cast-treated fractures bypass inflammation", "D": "Rigid fixation can heal directly through osteonal remodeling"}, "q": "Two fractures are compared. One is held in complete compression with rigid fixation; the other has limited motion within a cast. Which statement best distinguishes their healing mechanisms?", "r": {"A": "Bone healing includes intramembranous and/or endochondral processes, not cartilage formation alone.", "B": "Rigid fixation tends to minimize rather than require a large callus.", "C": "Inflammation is an important response to fracture injury and is not simply bypassed in cast-treated fractures.", "D": "Correct. Rigid compression permits direct osteonal remodeling across the fracture.<br><br><strong>Core rationale:<\/strong> Direct or primary bone healing occurs when fracture fragments are rigidly stabilized with minimal movement. Cutting and closing cones can cross the fracture line and restore Haversian systems without the prominent callus sequence typical of indirect healing."}, "tip": "Rigid fixation → direct healing; relative motion → callus-based indirect healing."}, {"k": "B", "lvl": "Applying", "mn": "", "n": 28, "o": {"A": "Child: osteoporosis; adult: osteopetrosis", "B": "Child: rickets; adult: osteomalacia", "C": "Child: osteomalacia; adult: rickets", "D": "Child: scurvy; adult: osteoporosis"}, "q": "A child with vitamin D deficiency has poorly mineralized growing bone, whereas an adult with the same type of deficiency develops defective mineralization without a growing skeleton. Which diagnoses match these two patients?", "r": {"A": "Osteoporosis and osteopetrosis are different disorders of bone mass/resorption rather than the age-paired mineralization defects described.", "B": "Correct. Rickets is the pediatric counterpart of adult osteomalacia.<br><br><strong>Core rationale:<\/strong> Defective mineralization from calcium/vitamin D deficiency in a growing child produces rickets. The corresponding mineralization defect in adults is osteomalacia.", "C": "This reverses the age-specific terminology.", "D": "Scurvy is due to vitamin C deficiency and impaired collagen synthesis, not the classic vitamin D deficiency pair."}, "tip": "Rickets = child; osteomalacia = adult."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 29, "o": {"A": "Calcitonin — osteoclast", "B": "PTH — osteoblast", "C": "FGF-23 — osteocyte", "D": "RANKL — thyroid parafollicular cell"}, "q": "Bone functions as an endocrine organ as well as a target of hormones. Which pairing of bone-derived hormone and principal source cell is correct?", "r": {"A": "Calcitonin is secreted by thyroid parafollicular cells, not osteoclasts.", "B": "PTH is secreted by parathyroid chief cells, not osteoblasts.", "C": "Correct. Osteocytes are a major source of FGF-23.<br><br><strong>Core rationale:<\/strong> FGF-23 is produced by osteocytes and helps regulate phosphate balance and vitamin D-related renal handling. Osteocalcin, another endocrine-related bone product, is produced by osteoblasts.", "D": "RANKL is produced by several bone/stromal and immune cells, not by thyroid parafollicular cells."}, "tip": "Osteocyte → FGF-23; osteoblast → osteocalcin."}, {"k": "A", "lvl": "Analyzing", "mn": "", "n": 30, "o": {"A": "Bone tissue lacks lymphatic vessels; periosteum provides lymphatic drainage", "B": "Bone tissue is supplied mainly by lymphatics from the marrow", "C": "Blood normally flows centripetally from periosteum to marrow only", "D": "Volkmann canals contain no vessels or nerves"}, "q": "A vascular study of adult compact bone tracks flow from the marrow cavity outward through bone tissue toward periosteal veins. Which additional statement is consistent with this pattern?", "r": {"A": "Correct. This combines the described centrifugal blood flow with the absence of lymphatics in bone tissue proper.<br><br><strong>Core rationale:<\/strong> The chapter describes bone tissue blood flow as essentially centrifugal, from marrow outward through compact bone toward periosteal veins. Bone tissue itself lacks lymphatic vessels; lymphatic drainage occurs from the periosteum.", "B": "Lymphatics do not provide the main vascular supply of bone.", "C": "The principal direction described for nourishment is centrifugal rather than exclusively centripetal.", "D": "Volkmann canals are important routes for vessels and nerves connecting surfaces with osteonal canals."}, "tip": "Bone blood flow is largely centrifugal; lymphatics are confined to periosteal drainage."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 31, "o": {"A": "Osteocalcin", "B": "Osteonectin", "C": "Sclerostin", "D": "Protein S"}, "q": "A mutation reduces a bone matrix glycoprotein that normally helps link collagen fibrils to hydroxyapatite crystals. Which protein is most directly affected by this defect?", "r": {"A": "Osteocalcin is a vitamin K–dependent protein that binds calcium and participates in remodeling rather than serving as the principal collagen–hydroxyapatite linker.", "B": "Correct. Osteonectin directly links collagen with hydroxyapatite in the mineralized matrix.<br><br><strong>Core rationale:<\/strong> Osteonectin is a multiadhesive glycoprotein that acts as a link, or “glue,” between collagen and hydroxyapatite in bone matrix. This makes it important for organizing the organic and mineral components of bone.", "C": "Sclerostin is a regulatory protein produced by osteocytes that inhibits bone formation pathways rather than linking collagen to mineral.", "D": "Protein S is a vitamin K–dependent protein involved in removal of apoptotic cells, not collagen–mineral adhesion."}, "tip": "Osteonectin = collagen–hydroxyapatite “glue.”"}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 32, "o": {"A": "Newly formed circumferential lamellae", "B": "Unmineralized osteoid seams", "C": "Trabeculae extending from marrow", "D": "Remnants of previously remodeled osteons"}, "q": "In a ground section of compact bone, irregular fragments of lamellae lie between complete osteons and do not surround their own central canals. What do these structures most likely represent?", "r": {"A": "Circumferential lamellae form broad layers around the inner or outer circumference of the shaft rather than irregular fragments between osteons.", "B": "Osteoid is newly deposited, unmineralized matrix and is not identified as old lamellar fragments in a ground section.", "C": "Trabeculae are the structural units of spongy bone, not irregular remnants between osteons in compact bone.", "D": "Correct. Interstitial lamellae are leftover portions of old osteons after remodeling.<br><br><strong>Core rationale:<\/strong> Interstitial lamellae are remnants of older osteons that were partially removed during remodeling. They occupy the spaces between newer, complete Haversian systems and lack a central canal of their own."}, "tip": "Interstitial lamellae = remnants of old osteons."}, {"k": "A", "lvl": "Applying", "mn": "", "n": 33, "o": {"A": "Outer circumferential lamellae", "B": "Concentric osteonal lamellae", "C": "Interstitial lamellae", "D": "Calcified cartilage lamellae"}, "q": "A histology specimen shows broad lamellar sheets extending around nearly the entire outer circumference of a long-bone shaft just deep to the periosteum. Which lamellae are being observed?", "r": {"A": "Correct. These lamellae encircle the shaft beneath the periosteum.<br><br><strong>Core rationale:<\/strong> Outer circumferential lamellae run around the external circumference of the diaphysis beneath the periosteum. Their broad distribution distinguishes them from the concentric lamellae of individual osteons.", "B": "Concentric lamellae surround individual Haversian canals rather than the entire outer circumference of the shaft.", "C": "Interstitial lamellae are irregular remnants located between osteons.", "D": "Calcified cartilage is not organized into circumferential lamellae of mature compact bone."}, "tip": "Circumferential lamellae wrap the shaft; concentric lamellae wrap an osteon."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 34, "o": {"A": "Periosteal Sharpey fibers", "B": "Volkmann canals entering each lacuna", "C": "Canaliculi containing processes joined by gap junctions", "D": "Elastic fibers connecting adjacent osteocytes"}, "q": "An osteocyte remains viable despite being completely surrounded by mineralized matrix. Which structural arrangement most directly permits exchange and communication with neighboring bone cells?", "r": {"A": "Sharpey fibers anchor periosteum, tendons, or ligaments to bone and do not connect individual osteocytes.", "B": "Volkmann canals carry vessels and nerves through compact bone but do not enter every lacuna as a direct cell-to-cell connection.", "C": "Correct. Canaliculi plus gap junctions create the osteocyte communication network.<br><br><strong>Core rationale:<\/strong> Osteocytes send cytoplasmic processes through canaliculi, and neighboring processes communicate through gap junctions. This lacunar–canalicular network permits cell-to-cell communication and movement of small solutes through mineralized bone.", "D": "Elastic fibers are not the specialized communication pathway between osteocytes."}, "tip": "Osteocyte survival depends on the lacunar–canalicular network."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 35, "o": {"A": "Clear zone", "B": "Ruffled border", "C": "Sealing ring", "D": "Basolateral region"}, "q": "An osteoclast can acidify its resorption compartment and digest collagen normally, but degradation products accumulate inside the cell instead of being released toward nearby vessels. Which region is most likely dysfunctional?", "r": {"A": "The clear zone helps attach and seal the osteoclast to bone but is not the main site where transported degradation products are released.", "B": "The ruffled border is the major site of acid and enzyme secretion and endocytosis, which are stated to be intact in this scenario.", "C": "The sealing ring isolates the resorption compartment; failure there would impair compartment formation rather than final export.", "D": "Correct. The basolateral region is the exit site for transcytosed bone degradation products.<br><br><strong>Core rationale:<\/strong> After mineral and organic matrix are degraded at the ruffled border, resorption products are endocytosed and transported across the osteoclast. They are then released by exocytosis at the basolateral region, often near blood vessels."}, "tip": "Osteoclast: ruffled border resorbs; basolateral surface releases."}, {"k": "B", "lvl": "Applying", "mn": "", "n": 36, "o": {"A": "Increased RANKL production by osteoblasts", "B": "Suppressed osteoclast-mediated bone resorption", "C": "Enhanced osteoid secretion by chondrocytes", "D": "Increased PTH release from parathyroid cells"}, "q": "A hormone released from thyroid parafollicular cells rises after an increase in serum calcium. Which direct effect on bone best matches the action of this hormone?", "r": {"A": "Increasing RANKL would favor osteoclast formation and bone resorption, which is opposite the expected effect of calcitonin.", "B": "Correct. Calcitonin decreases osteoclast activity and bone resorption.<br><br><strong>Core rationale:<\/strong> Calcitonin is secreted by thyroid parafollicular cells and inhibits osteoclast activity, thereby reducing bone resorption. Its action opposes the calcium-mobilizing effect of PTH on bone.", "C": "Chondrocytes produce cartilage matrix, not osteoid, and this is not calcitonin’s principal action.", "D": "Calcitonin does not raise PTH secretion as its main physiologic action."}, "tip": "Calcitonin restrains osteoclasts; PTH mobilizes calcium through bone-resorptive pathways."}, {"k": "A", "lvl": "Analyzing", "mn": "", "n": 37, "o": {"A": "It is mesenchymal and is not a true epithelium", "B": "It is a stratified epithelium overlying cartilage", "C": "It is derived from articular chondrocytes", "D": "It is a perichondrial layer surrounding the joint cavity"}, "q": "A biopsy of synovial membrane from an inflamed joint shows one population of macrophage-like lining cells and another population of fibroblast-like cells. Which statement best describes this lining?", "r": {"A": "Correct. The synovial lining is mesenchymal, not epithelial, despite lining a cavity.<br><br><strong>Core rationale:<\/strong> The synovial membrane lines the joint cavity but is not an epithelium. Its lining cells are mesenchymally derived synoviocytes: type A cells are macrophage-like and type B cells are fibroblast-like.", "B": "The synovium does not form a stratified epithelial sheet.", "C": "Synoviocytes are not produced by articular chondrocytes.", "D": "Articular cartilage lacks a perichondrium at its joint surface, and synovium is a distinct tissue."}, "tip": "Synovial membrane lines a cavity but is not epithelium."}, {"k": "C", "lvl": "Applying", "mn": "", "n": 38, "o": {"A": "Hydroxyapatite crystals", "B": "Type II collagen fibrils", "C": "Type I collagen fibrils", "D": "Elastic lamellae"}, "q": "A child with severe vitamin C deficiency develops defective bone formation because osteoblasts cannot produce a normal collagenous osteoid framework. Which matrix component is most directly compromised?", "r": {"A": "Hydroxyapatite is the mineral phase; the primary defect in vitamin C deficiency is collagen synthesis rather than direct mineral production.", "B": "Type II collagen is characteristic of cartilage rather than the dominant collagen of bone osteoid.", "C": "Correct. Bone osteoid is rich in type I collagen, whose synthesis is impaired in vitamin C deficiency.<br><br><strong>Core rationale:<\/strong> Vitamin C is required for normal collagen synthesis. Because type I collagen is the principal collagen of bone osteoid, severe vitamin C deficiency impairs formation of the organic matrix required before normal mineralization can occur.", "D": "Elastic lamellae are not a major structural component of bone matrix."}, "tip": "Vitamin C deficiency weakens bone by impairing type I collagen-rich osteoid."}, {"k": "B", "lvl": "Understanding", "mn": "", "n": 39, "o": {"A": "Increased osteoclast fusion through RANKL", "B": "Reduced IGF-1 stimulation of chondrocyte growth", "C": "Accelerated calcification of articular cartilage", "D": "Increased periosteal appositional growth"}, "q": "A child with growth hormone deficiency has reduced longitudinal growth of long bones. Which downstream change at the epiphyseal growth plate most directly contributes to this finding?", "r": {"A": "RANKL-mediated osteoclast formation is important in bone remodeling but does not explain the principal growth-plate effect of GH deficiency.", "B": "Correct. GH–IGF-1 signaling supports growth-plate chondrocyte proliferation and longitudinal bone growth.<br><br><strong>Core rationale:<\/strong> Growth hormone promotes skeletal growth largely through IGF-1, which stimulates chondrocyte proliferation and activity in the epiphyseal growth plate. Reduced GH therefore lowers IGF-1–mediated longitudinal growth.", "C": "Articular cartilage calcification is not the normal mechanism responsible for GH-dependent lengthening.", "D": "Periosteal appositional growth increases bone width rather than primarily controlling longitudinal growth."}, "tip": "GH → IGF-1 → growth-plate chondrocytes → longitudinal growth."}, {"k": "D", "lvl": "Analyzing", "mn": "", "n": 40, "o": {"A": "Vascular invasion of cartilage", "B": "Osteoblast deposition of new bone", "C": "Replacement of calcified cartilage", "D": "Formation of a periosteal bony collar"}, "q": "A developing epiphysis has just formed a secondary ossification center. Compared with the earlier primary ossification center in the diaphysis, which feature is characteristically absent from this epiphyseal process?", "r": {"A": "Blood vessels invade cartilage during secondary ossification.", "B": "Osteoblasts deposit new bone in the secondary ossification center.", "C": "Calcified cartilage is replaced by bone during the process.", "D": "Correct. A periosteal bony collar is characteristic of the diaphyseal primary ossification process, not the epiphyseal secondary center.<br><br><strong>Core rationale:<\/strong> Secondary ossification in the epiphysis follows many of the same endochondral steps as the primary center, including vascular invasion and bone deposition on calcified cartilage. However, the epiphysis does not form the periosteal bony collar that develops around the diaphysis."}, "tip": "Secondary ossification resembles primary ossification—but without a periosteal bony collar."}]}, {"meta": {"added": 1792834095335, "chunks": 1, "count": 35, "id": "preventive-medicine-global-health-35-mcq-mvm74pgn", "levels": {"Remembering": 15, "Understanding": 20}, "path": "", "ref": "", "sources": [], "title": "Preventive Medicine — Global Health (35 MCQs)", "topic": "Preventive Medicine — Global Health", "subject": "Preventive Medicine"}, "items": [{"k": "B", "lvl": "Remembering", "mn": "", "n": 1, "o": {"A": "The study and control of disease within a single country, carried out by its national health authorities", "B": "A field of study, research, and practice that prioritizes health improvement and health equity for all people worldwide", "C": "The one-way delivery of medical aid and expertise from wealthy countries to poorer countries", "D": "The branch of medicine concerned only with tropical and infectious diseases that occur in the developing regions of the world"}, "q": "Which statement best defines global health?", "r": {"A": "This describes a national or local public-health focus. Global health addresses problems that extend beyond national borders and depends on cooperation among countries.", "B": "Correct. Global health prioritizes health improvement and health equity worldwide. It focuses on problems that cross national boundaries or are shaped by global political, economic, social, environmental, and cultural factors.", "C": "This resembles the older international-health emphasis on assistance to lower-income countries. Global health rests on shared responsibility, equity, and partnership rather than one-way aid.", "D": "Global health is not limited to tropical or infectious diseases. It also deals with noncommunicable diseases, injuries, and the wider forces that shape health."}, "tip": "Six key characteristics: equity, transnational perspective, interdisciplinary approach, collaboration, prevention, and sustainability."}, {"k": "D", "lvl": "Understanding", "mn": "", "n": 2, "o": {"A": "The claim is true because global health programs target developing countries exclusively", "B": "The claim is true because high-income countries no longer face cross-border health threats", "C": "The claim is false only for infectious diseases, because noncommunicable diseases and injuries fall outside the scope of global health", "D": "The claim is false because global health covers health challenges that affect all nations, including high-income countries"}, "q": "A classmate claims that global health only concerns diseases in low-income countries. Which response is most accurate?", "r": {"A": "Global health is not defined by a country's income level. It addresses problems in every country and encourages shared responsibility.", "B": "High-income countries are exposed to cross-border threats too. COVID-19 spread internationally and affected healthcare systems, economies, and education everywhere.", "C": "Global health is not limited to infectious diseases. The global burden of disease covers communicable conditions, noncommunicable diseases, and injuries.", "D": "Correct. Global health is not limited to developing countries. It includes health challenges affecting all nations, and its scope runs from local to global."}, "tip": "Exam point: global health is not limited to developing countries."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 3, "o": {"A": "Equality; equity would add clinics, transport assistance, and outreach services for the remote community", "B": "Equity, because every community receives the same number of clinics and so the same resources", "C": "Health equity, because resources are distributed according to the needs of each community", "D": "Community participation, because residents of both communities receive services"}, "q": "A health department gives two communities the same number of clinics, although one of them is remote and underserved. How should this approach be classified?", "r": {"A": "Correct. Giving everyone the same resources regardless of need is equality. Equity gives support according to need, so the remote, underserved community would receive additional clinics, transport assistance, and outreach.", "B": "Identical resources define equality, not equity. Equity adjusts support to need in order to achieve fairer opportunities and outcomes.", "C": "Here resources are distributed by an identical number of clinics, not by need, so the approach does not meet the definition of equity.", "D": "Community participation means involving local people in identifying health problems and designing culturally appropriate solutions. That is not what is being described."}, "tip": "Equality = the same resources for everyone. Equity = support according to need."}, {"k": "C", "lvl": "Remembering", "mn": "", "n": 4, "o": {"A": "Neonatal mortality rate (NMR)", "B": "Under-five mortality rate (U5MR)", "C": "Infant mortality rate (IMR)", "D": "Crude death rate (CDR)"}, "q": "Which mortality indicator is defined as deaths of infants under 1 year of age per 1,000 live births?", "r": {"A": "NMR counts only deaths during the first 28 days (0–27 days) per 1,000 live births, a shorter window than IMR. It reflects newborn health.", "B": "U5MR covers deaths in children before age 5 and is a measure of child survival. That is a wider age span than infants under 1 year.", "C": "Correct. IMR is deaths of infants under 1 year of age per 1,000 live births. It reflects child health and healthcare conditions.", "D": "CDR is total deaths in a year per 1,000 midyear population. It measures overall mortality rather than infant deaths."}, "tip": "IMR = under 1 year · NMR = under 28 days · U5MR = under 5 years. All three use live births as the denominator and a multiplier of 1,000."}, {"k": "B", "lvl": "Remembering", "mn": "", "n": 5, "o": {"A": "Maternal deaths ÷ midyear population × 1,000", "B": "Maternal deaths ÷ total live births × 100,000", "C": "Maternal deaths ÷ total live births × 1,000", "D": "Maternal deaths ÷ number of pregnant women × 100"}, "q": "Which expression correctly represents the maternal mortality ratio (MMR)?", "r": {"A": "This borrows the crude death rate's denominator and multiplier. MMR uses live births as the denominator and 100,000 as the multiplier.", "B": "Correct. MMR is maternal deaths divided by total live births, multiplied by 100,000. It reflects the quality of and access to maternal healthcare.", "C": "The denominator is right but the multiplier is not. A multiplier of 1,000 is used for CDR, IMR, NMR, and U5MR, while MMR uses 100,000.", "D": "MMR does not use the number of pregnant women as its denominator and is not expressed per 100. It uses live births and a multiplier of 100,000."}, "tip": "Quick reviewer: MMR = maternal deaths ÷ live births × 100,000. Maternal deaths are comparatively rare events, so a larger multiplier keeps the number readable."}, {"k": "D", "lvl": "Understanding", "mn": "", "n": 6, "o": {"A": "It is expressed per 100,000, which is too large a multiplier for a rate", "B": "It counts only deaths that occur after delivery", "C": "Its numerator includes accidental and incidental causes of death", "D": "Its denominator is live births rather than the total time women are at risk"}, "q": "Why is the maternal mortality ratio called a “ratio” rather than a true rate?", "r": {"A": "The size of the multiplier does not decide ratio versus rate. The distinction comes from the choice of denominator.", "B": "Maternal death generally refers to death during pregnancy or within 42 days after pregnancy ends, so it is not limited to post-delivery deaths. This is also not why MMR is called a ratio.", "C": "Accidental and incidental causes are excluded from the definition of maternal death. The content of the numerator is also not what makes MMR a ratio.", "D": "Correct. A true rate relates events to the population or time at risk. MMR uses live births as its denominator instead of the time women are at risk, which is why it is called a ratio."}, "tip": "Exam tip: MMR is called a ratio, not a true rate, because its denominator is live births."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 7, "o": {"A": "Prevalence", "B": "Incidence", "C": "Crude death rate", "D": "Maternal mortality ratio"}, "q": "A provincial health officer needs to estimate how many people currently living with diabetes will need ongoing clinic services and medicines. Which measure is most useful?", "r": {"A": "Correct. Prevalence counts existing cases and shows how widespread a disease is, which makes it useful for healthcare planning, such as for people currently living with diabetes.", "B": "Incidence counts only new cases among the population at risk. It measures the risk of developing disease and is useful for studying causes and prevention, not for sizing current service needs.", "C": "CDR measures overall mortality (deaths per 1,000 population per year). It does not show how many people currently live with a disease.", "D": "MMR describes maternal deaths per 100,000 live births. It says nothing about how many people currently live with diabetes."}, "tip": "Incidence = new cases (risk, causes, prevention). Prevalence = existing cases (how widespread, planning)."}, {"k": "C", "lvl": "Understanding", "mn": "", "n": 8, "o": {"A": "Incidence rises, while prevalence stays the same", "B": "Both incidence and prevalence fall", "C": "Incidence stays the same and prevalence rises", "D": "Incidence falls and prevalence rises"}, "q": "In a relatively stable population, a new treatment keeps patients with a rare chronic disease alive much longer but does not cure them. The number of new cases per year does not change. What happens to incidence and prevalence?", "r": {"A": "The treatment acts on people who are already ill, so it does not create new cases. Incidence is unchanged, and prevalence would not stay the same because disease duration has increased.", "B": "Nothing in the scenario reduces new cases or cures existing ones, so neither measure would fall.", "C": "Correct. In a relatively stable population with a relatively rare disease, prevalence ≈ incidence rate × average duration. Longer survival increases the average duration while new cases per year are unchanged, so prevalence rises.", "D": "The scenario states that new cases per year do not change, so incidence does not fall. Only the prevalence prediction in this option is correct."}, "tip": "Prevalence ≈ incidence rate × average duration. This is an approximation, not a universal formula."}, {"k": "D", "lvl": "Remembering", "mn": "DALY = lost to early death (YLL) + lived with disability (YLD).", "n": 9, "o": {"A": "DALY = YLL − YLD", "B": "DALY = YLL × YLD", "C": "DALY = Y × Q", "D": "DALY = YLL + YLD"}, "q": "Which equation correctly expresses the disability-adjusted life year (DALY)?", "r": {"A": "The two components are added, not subtracted. Subtracting would understate the total burden.", "B": "Multiplying the components would not give years of healthy life lost. The mortality and disability burdens are summed.", "C": "This is the QALY formula, in which years lived are multiplied by a quality (utility) weight.", "D": "Correct. A DALY adds Years of Life Lost to premature mortality (YLL) and Years Lived with Disability (YLD). One DALY represents one year of healthy life lost."}, "tip": "Example from the notes: 600 YLL + 400 YLD = 1,000 DALYs."}, {"k": "B", "lvl": "Remembering", "mn": "", "n": 10, "o": {"A": "Perfect health", "B": "A health state equivalent to death", "C": "A disease that lasts exactly one year", "D": "A single new case of the disease"}, "q": "In the prevalence-based formula YLD = I × DW × D, what does a disability weight (DW) of 1 represent?", "r": {"A": "Perfect health corresponds to a weight of 0, not 1.", "B": "Correct. Disability weights run from 0 (perfect health) to 1 (equivalent to death).", "C": "Duration is a separate term (D, the average duration of the disease in years). The weight describes severity, not length.", "D": "The number of new cases is the term I, not the disability weight."}, "tip": "I = number of new cases · DW = disability weight (0 to 1) · D = average duration in years."}, {"k": "A", "lvl": "Understanding", "mn": "", "n": 11, "o": {"A": "DALYs quantify health lost, so lower is better; QALYs quantify health gained, so higher is better", "B": "DALYs are used mainly in cost-utility analysis, while QALYs are used in burden-of-disease studies", "C": "DALYs include only mortality (premature death), while QALYs include only disability", "D": "For both measures, a lower value generally indicates a better outcome"}, "q": "Which statement correctly contrasts DALYs with QALYs?", "r": {"A": "Correct. DALYs measure health loss and are used in burden-of-disease studies. QALYs measure health gained or experienced and are used in cost-utility analysis.", "B": "The uses are reversed. DALYs are used in burden-of-disease studies and QALYs in cost-utility analysis.", "C": "DALYs include both mortality (YLL) and disability (YLD). QALYs combine survival with health-related quality of life.", "D": "Lower is generally better for DALYs because they count health lost. Higher is generally better for QALYs because they count health gained."}, "tip": "DALY = health loss (lower is better). QALY = health gained (higher is better). Example: five years at a utility of 0.8 = four QALYs."}, {"k": "C", "lvl": "Remembering", "mn": "", "n": 12, "o": {"A": "Cardiovascular disease", "B": "Road traffic injury", "C": "Tuberculosis", "D": "Chronic kidney disease"}, "q": "Which of the following belongs to Group I of the global burden of disease (communicable, maternal, neonatal, and nutritional conditions)?", "r": {"A": "This is a noncommunicable disease (Group II), together with cancer, diabetes, chronic respiratory diseases, chronic kidney disease, and mental disorders.", "B": "Road traffic injuries belong to Group III (injuries), together with falls, drowning, burns, occupational injuries, violence, and self-harm.", "C": "Correct. Group I covers communicable, maternal, neonatal, and nutritional conditions, such as tuberculosis, HIV/AIDS, malaria, diarrheal diseases, maternal complications, neonatal disorders, and malnutrition.", "D": "Chronic kidney disease is a noncommunicable disease and belongs to Group II."}, "tip": "Gro
